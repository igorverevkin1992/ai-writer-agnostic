тип: топография
назначение: "Места и их свойства"
множественность: несколько
имя_по_умолчанию: "16_Топография.md"
питает_модули: [окно]
извлечения:
  - имя: места
    выгрузка: places.json
    схема: WorldEntry
    результат: список
    форматы:
      - вид: таблица
        колонки:
          название: {синонимы: [место, название, локация], обязательна: да, роль: ключ}
          описание: {синонимы: [описание, свойства, что там], обязательна: да}
          примечание: {синонимы: [примечан, адрес]}
        постоянные: {kind: место}
        запись: {name: название, description: описание, note: примечание, kind: kind, file: "{файл}"}
сигнатуры:
  имя_файла: [топограф, мест, карта]
  колонки: [место, адрес]
  заголовки: [топограф, мест, адрес]
