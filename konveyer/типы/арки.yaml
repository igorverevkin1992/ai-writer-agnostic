тип: арки
назначение: "Арки персонажей по актам: ложь, желание, потребность, положение на арке, что видно снаружи"
множественность: по_тому
имя_по_умолчанию: "22_Арки_Том{том}.md"
питает_модули: [окно, драматургия, арки]
извлечения:
  - имя: арки
    выгрузка: arcs.json
    схема: Arc
    результат: список
    форматы:
      - вид: таблица
        колонки:
          персонаж: {синонимы: [персонаж, герой], обязательна: да, роль: ключ}
          акт: {синонимы: [акт], тип: целое, обязательна: да}
          ложь: {синонимы: [ложь]}
          желание: {синонимы: [желание, хочет]}
          потребность: {синонимы: [потребность, нужно]}
          положение: {синонимы: [где на арке, положение, где]}
          видно: {синонимы: [видно снаружи, видно, снаружи]}
        запись: {character: персонаж, act: акт, lie: ложь, want: желание, need: потребность, position: положение,
                 visible: видно}
окно:
  показывать: ["только «что видно снаружи» для участников сцены по акту главы"]
  запрещено: ["ложь", "желание", "потребность", "положение на арке"]
проверки_линтера: [АРКА-1, АРКА-2]
сигнатуры:
  имя_файла: [арк, arcs]
  колонки: [ложь, желание, потребность]
  заголовки: [арк]
