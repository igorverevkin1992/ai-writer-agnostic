тип: план_томов
назначение: "План томов: темы и границы каждого тома серии"
множественность: один
имя_по_умолчанию: "20_План_томов.md"
питает_модули: [тома, драматургия]
извлечения:
  - имя: тома
    выгрузка: volumes.json
    схема: VolumePlan
    результат: список
    форматы:
      - вид: таблица
        колонки:
          том: {синонимы: [том, "№"], тип: целое, обязательна: да, роль: ключ}
          год: {синонимы: [год, период]}
          тема: {синонимы: [тема, название, о чём], обязательна: да}
          главы: {синонимы: [глав], тип: строка}
        запись: {volume: том, period: год, theme: тема, chapters: главы}
сигнатуры:
  имя_файла: [план_томов, тома, цикл]
  колонки: [том, тема]
  заголовки: [тома, цикл, план томов]
