тип: проза
назначение: "Принятые тексты глав — корпус для повторов и TTR, источник хвоста прозы и линтера"
множественность: папка
имя_по_умолчанию: "Проза/"
питает_модули: [корпус, э1, линтер]
извлечения: []
имя_главы: "Том{том}_Глава{глава:02d}.md"
регэксп_главы: "Том0*(\\d+)_Глава0*(\\d+)"
исключить: ["МАКЕТ"]
сигнатуры:
  имя_файла: [глава, проза]
  без_таблиц: да
  не_строки: ["^\\s*[-*]\\s*(Фокал|Дата|Сцены|Биты|Участники)\\s*:", "^\\|", "^#{1,3}\\s*\\d+\\.", "^##\\s*Р-\\d+"]
