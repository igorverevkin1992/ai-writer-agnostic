тип: эпистемика
назначение: "Кто и когда узнаёт каждый факт (матрица знаний: факт × субъект × глава)"
множественность: по_тому
имя_по_умолчанию: "31_Эпистемика_Том{том}.md"
питает_модули: [окно, э2, линтер, эпистемика]
извлечения:
  - имя: матрица
    выгрузка: matrix.json
    схема: MatrixFact
    результат: список
    форматы:
      - вид: таблица
        колонки:
          fact_id: {синонимы: [fact_id, id], обязательна: да, роль: ключ}
          факт: {синонимы: [факт, событие], обязательна: да}
          субъект: {синонимы: [субъект, персонаж, кто], обязательна: да}
          узнаёт: {синонимы: [узна, глава], тип: глава}
          источник: {синонимы: [источник]}
          примечание: {синонимы: [примечан]}
        запись: {fact_id: fact_id, fact: факт, subject: субъект, from_chapter: узнаёт, source: источник, note: примечание}
      - вид: широкая_таблица
        ключ: {синонимы: [факт, событие]}
        номер: {синонимы: ["#", "№"]}
        минимум_колонок: 4
        префикс_id: "М-"
        ячейка_знания:
          "всегда|с начала|пролог": 0
          "—|-|нет": null
          "гл.N[ / источник]": N
          "*курсив*": частичное_знание
окно:
  показывать: ["факты, известные фокалу к главе (частичное знание — текстом пометки)"]
  запрещено: ["факты, которых фокал ещё не знает", "содержание тайн"]
проверки_линтера: [МАТР-1, МАТР-2, МАТР-3]
# субъекты матрицы, не являющиеся персонажами; их ячейки читаются по `ячейка_знания_псевдосубъекта`
# (правила проекта/профиля, прежде общих `ячейка_знания` формата)
псевдосубъекты: [Читатель]
сигнатуры:
  имя_файла: [матриц, эпистем, знани]
  колонки: [факт, субъект, узна, читатель]
  широкая_таблица: 4
  заголовки: [матриц, знан, эпистем]
