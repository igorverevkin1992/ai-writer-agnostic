тип: персонажи
назначение: "Досье персонажей: профиль, внешность, речевой паспорт, опознавательный код, отношения"
множественность: папка
имя_по_умолчанию: "Досье/"
питает_модули: [окно, э2, линтер]
обязательные_секции: ["Профиль", "Физика", "Речевой паспорт", "Отношения"]
извлечения:
  - имя: карточки
    выгрузка: dossiers.json
    схема: Dossier
    результат: список
    форматы:
      - вид: секции
        имя: заголовок_1
        поля:
          profile: {секция: "[Пп]рофил"}
          physique: {секция: "[Фф]изик|[Вв]нешност"}
          speech: {секция: "[Рр]ечев"}
          code: {секция: "[Оо]познавательн"}
          relations: {секция: "[Оо]тношени", тип: таблица_пар}
          status: {секция: "[Сс]татус"}
          arc: {секция: "[Аа]рк"}
        запись: {name: name, profile: profile, physique: physique, speech: speech, code: code, relations: relations,
                 status: status, arc: arc, file: "{файл}", line: _строка, sections: _секции}
# образцы разметки карточки для постобработки (проект может переопределить): год рождения — группа «год»;
# возраст по томам — группы «возраст» и «том»
постобработка:
  год_рождения: ["[Рр]ожд\\.\\s*≈?\\s*(?P<год>\\d{4})"]
  возраст_по_томам:
    - "(?P<возраст>\\d{2,3})\\s*\\(\\s*т\\.\\s*(?P<том>\\d+)\\s*\\)"
    - "(?P<возраст>\\d{2,3})\\s*(?:лет|года)\\s+в\\s+томе\\s+(?P<том>\\d+)"
окно:
  показывать: ["профиль", "физика", "речевой паспорт", "опознавательный код", "отношения к участникам сцены"]
  запрещено: ["психологический каркас", "арка", "статус по томам", "фразы с маркерами тайн, недоступных фокалу"]
проверки_линтера: [ДОСЬЕ-1, ДОСЬЕ-2, ДОСЬЕ-3, ДОСЬЕ-4, ДОСЬЕ-5, ДОСЬЕ-6, ПОГЛ-2]
сигнатуры:
  имя_файла: [досье, персонаж, character]
  секции: ["профил", "физик|внешност", "реч", "биограф", "отношени"]
  слова: [профиль, внешность, речевой]
роли_безымянных: [сторож, милиционер, посыльный, писарь, следователь, санитар, извозчик, дежурный, курьер, врач,
                  портье, официант, кондуктор, соседка, сосед]
каркас: |
  # Имя

  ## Профиль

  ⚠ заполнить

  ## Физика

  ⚠ заполнить

  ## Речевой паспорт

  ⚠ заполнить

  ## Отношения

  | к кому | отношение |
  |---|---|
  | — | — |
