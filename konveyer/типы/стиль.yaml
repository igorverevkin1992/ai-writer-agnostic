тип: стиль
назначение: "Стиль и нормы прозы: принципы регистра, числовые нормы Э1, эталоны и анти-эталоны, правила вкуса"
множественность: один
имя_по_умолчанию: "02_Стиль.md"
обязателен_для_такта: да
питает_модули: [окно, э1, линтер, регрессия]
обязательные_секции: ["Регистр", "Нормы", "Правила вкуса"]
извлечения:
  - имя: нормы
    выгрузка: norms.json
    схема: Norm
    результат: "словарь:id"
    форматы:
      - вид: таблица
        секция: "[Нн]орм|§\\s*5"
        колонки:
          id: {синонимы: [id, метрика, идентификатор], обязательна: да, роль: ключ}
          мин: {синонимы: [мин, min], тип: число, обязательна: да}
          макс: {синонимы: [макс, max], тип: число, обязательна: да}
          брак: {синонимы: [брак], тип: число}
          единица: {синонимы: [единиц, ед.]}
        постоянные: {source: "{файл} (нормы)"}
        запись: {id: id, min: мин, max: макс, brak: брак, unit: единица, source: source}
  - имя: усилители
    необязательно: да
    выгрузка: stoplists.json
    схема: StopRule
    результат: "значения:слово"
    сборка: {вид: стоп_правило, kind: усилитель, action: флаг, rule_id: усилители, scope: линии}
    форматы:
      - вид: таблица
        секция: "[Уу]силител"
        колонки:
          слово: {синонимы: [слово, наречие], обязательна: да, роль: ключ}
окно:
  показывать: ["принципы регистра (секции §1–§4)", "числовые нормы прозы", "правила вкуса §6.1–6.2", "эталоны §6.3"]
  запрещено: ["служебные пороги верификатора (n-граммы, окно TTR, допуск объёма)"]
  секции_регистра: "^(?:§\\s*)?(?:[1-4]|6\\.[1-3])\\.?\\s"
  # нормы, показываемые Писателю (идентификаторы реестра метрик Э1); остальные — служебные пороги верификатора
  нормы_писателю: [средняя_длина, доля_коротких, доля_длинных, максимум_длины, короткая_фраза_порог, длинная_фраза_порог,
                   был_на_250, усилители_на_1000, объём_главы]
проверки_линтера: [РАЗМ-1, ПРОЗА-3]
сигнатуры:
  имя_файла: [стил, style, регламент, голос]
  заголовки: [регистр, стиль, ритм, норм, вкус]
  колонки: [мин, макс, брак]
  слова: [норма, брак, слов, коридор, "%"]
  вес: 1.0
каркас: |
  # 02. Стиль

  ## §1. Регистр

  ⚠ заполнить: как звучит повествователь (2–5 фраз).

  ## §5. Численные нормы

  | id | параметр | мин | макс | брак | единица |
  |---|---|---|---|---|---|
  | средняя_длина | средняя длина фразы | — | — | — | слов |
  | объём_главы | объём главы | — | — | — | слов |

  ## §6.1. Правила вкуса

  - ⚠ заполнить
