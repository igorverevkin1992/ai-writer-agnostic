тип: дозы_прошлого
назначение: "Дозированные воспоминания: глава, триггер, что получает читатель и чего не получает"
множественность: по_тому
имя_по_умолчанию: "26_Дозы_прошлого_Том{том}.md"
питает_модули: [окно, линтер, дозы_прошлого]
извлечения:
  - имя: дозы
    выгрузка: doses.json
    схема: Dose
    результат: список
    форматы:
      - вид: таблица
        колонки:
          доза: {синонимы: [доза, "№"], обязательна: да, роль: ключ}
          глава: {синонимы: [глава, гл], тип: целое, обязательна: да}
          триггер: {синонимы: [триггер, повод]}
          получает: {синонимы: [получает, что получает]}
          не_получает: {синонимы: [не получает, чего не]}
          правило: {синонимы: [правило]}
        постоянные: {volume: "{том}"}
        запись: {dose_id: доза, chapter: глава, trigger: триггер, reader_gets: получает, reader_not_gets: не_получает,
                 rule: правило, volume: volume}
окно:
  показывать: ["доза главы: триггер и что получает читатель"]
  запрещено: ["чего читатель не получает", "дозы других глав"]
проверки_линтера: [ДОЗА-1]
сигнатуры:
  имя_файла: [доз, воспоминан, прошл]
  колонки: [доза, триггер]
  заголовки: [доз, прошл, воспоминан]
