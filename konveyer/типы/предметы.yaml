тип: предметы
назначение: "Предметный канон: вещи, их свойства и иерархии"
множественность: несколько
имя_по_умолчанию: "15_Предметы.md"
питает_модули: [окно, закладки]
извлечения:
  - имя: предметы
    выгрузка: objects.json
    схема: WorldEntry
    результат: список
    форматы:
      - вид: таблица
        колонки:
          название: {синонимы: [предмет, название, вещь], обязательна: да, роль: ключ}
          описание: {синонимы: [описание, свойства, суть], обязательна: да}
          примечание: {синонимы: [примечан, владелец, где]}
        постоянные: {kind: предмет}
        запись: {name: название, description: описание, note: примечание, kind: kind, file: "{файл}"}
сигнатуры:
  имя_файла: [предмет, вещ, object]
  колонки: [предмет, свойства]
  заголовки: [предмет, вещ]
