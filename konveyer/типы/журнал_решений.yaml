тип: журнал_решений
назначение: "Журнал решений автора: каждое каноническое решение с номером, датой, формулировкой, обоснованием"
множественность: один
имя_по_умолчанию: "36_Журнал_решений.md"
обязателен_для_такта: нет
питает_модули: [линтер, коммиты]
извлечения:
  - имя: решения
    выгрузка: decisions.json
    схема: Decision
    результат: список
    форматы:
      - вид: секции_с_ключами
        заголовок: "(Р-\\d+)"
        ключи:
          дата: {ключ: Дата}
          формулировка: {ключ: Решение}
          обоснование: {ключ: Обоснование}
        тело: текст
        запись: {decision_id: номер, title: заголовок, date: дата, statement: формулировка, rationale: обоснование,
                 text: текст, line: _строка}
      - вид: строки
        регэксп: "^(?:[-*]\\s+|\\|\\s*)?\\**(?P<decision_id>Р-\\d+)\\**[\\s:|·—-]+(?P<text>.+?)\\s*\\|?$"
        описание: "строки «Р-№ — формулировка»"
        запись: {decision_id: decision_id, text: text, title: decision_id, line: _строка}
проверки_линтера: [КАНОН-1]
сигнатуры:
  имя_файла: [журнал, решени, decisions]
  строки: ["(^|\\W)Р-\\d{2,3}\\b"]
  заголовки: [журнал, решени]
каркас: |
  # 36. Журнал решений

  ## Р-001

  - Дата: ⚠ заполнить
  - Решение: ⚠ заполнить
  - Обоснование: ⚠ заполнить
