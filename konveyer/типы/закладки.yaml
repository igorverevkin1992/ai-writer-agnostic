тип: закладки
назначение: "Закладки: что положено, где, где стреляет"
множественность: по_тому
имя_по_умолчанию: "32_Закладки_Том{том}.md"
питает_модули: [окно, э2, линтер, закладки]
извлечения:
  - имя: закладки
    выгрузка: plants.json
    схема: Plant
    результат: список
    форматы:
      - вид: таблица
        колонки:
          plant_id: {синонимы: [plant_id, id, "№"], обязательна: да, роль: ключ}
          что: {синонимы: [что, закладка, деталь], обязательна: да}
          положена: {синонимы: [положена, где лежит, где], тип: место, обязательна: да}
          выстрел: {синонимы: [выстрел, стреляет], тип: места}
          статус: {синонимы: [статус]}
        запись: {plant_id: plant_id, what: что, placed: положена, fires: выстрел, status: статус}
окно:
  показывать: ["закладки, назначенные главе (техзадание)"]
проверки_линтера: [ЗАКЛ-1, ЗАКЛ-2, ЗАКЛ-3, ЗАКЛ-4, ЗАКЛ-5, ЗАКЛ-6, ЗАКЛ-7]
сигнатуры:
  имя_файла: [заклад, plants]
  колонки: [закладка, положена, стреляет, выстрел]
  заголовки: [заклад]
