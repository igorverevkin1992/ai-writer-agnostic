тип: методика
назначение: "Методика и замысел серии: тема, принципы построения — материал аналитика драматургии"
множественность: один
имя_по_умолчанию: "05_Замысел.md"
питает_модули: [драматургия]
извлечения:
  - имя: замысел
    выгрузка: method.json
    схема: MethodNote
    результат: список
    форматы:
      - вид: секции
        имя: имя_файла
        поля:
          theme: {секция: "[Тт]ема|[Зз]амысел|[Яя]дро"}
          principles: {секция: "[Пп]ринцип|[Мм]етод"}
        запись: {theme: theme, principles: principles, file: "{файл}"}
окно:
  показывать: []
  запрещено: ["всё: материал аналитика Писателю не показывается (FR-DR-6)"]
сигнатуры:
  имя_файла: [метод, замысел, концепц, библия]
  заголовки: [тема, замысел, конфликт, принцип]
  слова: [тема, конфликт, замысел, принцип]
  без_таблиц: да
