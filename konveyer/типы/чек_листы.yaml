тип: чек_листы
назначение: "Правила верификации: чек-листы, по которым Верификатор-2 проверяет главу; секция с пометкой «модуль: имя» в заголовке действует только при включённом модуле"
множественность: один
имя_по_умолчанию: "41_Чек-листы.md"
питает_модули: [э2]
извлечения:
  - имя: пункты
    выгрузка: checklists.json
    схема: Checklist
    результат: список
    форматы:
      - вид: секции_с_ключами
        заголовок: '(.+)'          # каждая секция документа — отдельный чек-лист
        тело: text
        запись: {file: "{файл}", title: заголовок, text: text}
сигнатуры:
  имя_файла: [чек-лист, чеклист, верифик, checklist]
  заголовки: [чек-лист, проверк, верифик]
  слова: [проверить, чек-лист]
