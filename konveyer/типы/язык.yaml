тип: язык
назначение: "Язык и стоп-листы: лексические запреты, анахронизмы по годам, словари"
множественность: один
имя_по_умолчанию: "04_Язык.md"
питает_модули: [э1, э2, хроника_эпохи]
извлечения:
  - имя: лексика_эпохи
    выгрузка: stoplists.json
    схема: StopRule
    результат: список
    форматы:
      - вид: таблица
        колонки:
          rule_id: {синонимы: [rule_id, id, правило], обязательна: да, роль: ключ}
          слова: {синонимы: [слова, обороты, лексика], тип: список, обязательна: да}
          годы: {синонимы: [годы, год, период], тип: годы, по_умолчанию: {all: true}}
          действие: {синонимы: [действ], тип: действие, по_умолчанию: запрет}
          том: {синонимы: [том], тип: целое}                       # правило действует только в этом томе
        постоянные: {scope: эпоха, kind: лексика}
        запись: {scope: scope, rule_id: rule_id, items: слова, action: действие, kind: kind,
                 applies_to: {"*": [годы], volume: том}}
окно:
  показывать: ["лексика года главы"]
проверки_линтера: []
сигнатуры:
  имя_файла: [лексик, язык, анахрон]
  заголовки: [лексик, язык, анахрон, эпох]
  колонки: [годы, слова]
  слова: [запрещено, анахронизм, не употреблять, "до 1"]
