тип: повествование
назначение: "Правила повествования: лицо, фокализация, общие законы, стоп-листы линий"
множественность: один
имя_по_умолчанию: "03_Повествование.md"
питает_модули: [окно, э2, фокализация]
извлечения:
  - имя: законы
    выгрузка: narration.json
    схема: NarrationRules
    результат: список
    форматы:
      - вид: секции
        имя: имя_файла
        поля:
          laws: {секция: "[Оо]бщие законы|[Пп]равила"}
          focals_table: {секция: "[Фф]окальн"}
        запись: {laws: laws, focals_text: focals_table, file: "{файл}"}
  - имя: стоп_листы_линий
    выгрузка: stoplists.json
    схема: StopRule
    результат: список
    форматы:
      - вид: таблица
        колонки:
          rule_id: {синонимы: [rule_id, id, правило], обязательна: да, роль: ключ}
          фокал: {синонимы: [фокал, линия, персонаж], тип: фокал}
          слова: {синонимы: [слова, обороты, лексика], тип: список, обязательна: да}
          действие: {синонимы: [действ], тип: действие, по_умолчанию: запрет}
        постоянные: {scope: "0.3", kind: лексика}
        запись: {scope: scope, rule_id: rule_id, items: слова, applies_to: фокал, action: действие, kind: kind}
окно:
  показывать: ["общие законы", "стоп-листы линий участников сцены"]
  запрещено: ["оговорки о будущих томах в таблице фокалов", "стоп-листы линий, совпадающие с маркерами тайн, которых фокал не знает"]
проверки_линтера: [ФОКАЛ-1, ФОКАЛ-2, ПРОЗА-2]
сигнатуры:
  имя_файла: [фокализ, повествован, narration]
  заголовки: [фокал, законы, повествован, лиц]
  колонки: [фокал, слова]
  слова: [фокал, голова, повествователь, стоп-лист]
каркас: |
  # 03. Повествование

  ## Общие законы

  - Одна глава — одна голова.
  - ⚠ заполнить

  ## Стоп-листы линий

  | rule_id | фокал | слова/обороты | действие |
  |---|---|---|---|
  | Л-1 | все | ⚠ заполнить | запрет |
