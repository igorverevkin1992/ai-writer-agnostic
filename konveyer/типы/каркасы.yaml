тип: каркасы
назначение: "Драматургические каркасы по методике: шаги тома, актов, глав (документ ведёт конвейер)"
множественность: по_тому
имя_по_умолчанию: "21_Каркасы_Том{том}.md"
питает_модули: [окно, э2, драматургия]
извлечения:
  - имя: каркасы
    выгрузка: circles.json
    схема: StoryCircle
    результат: список
    форматы:
      - вид: плагин
        функция: "konveyer.dramaturgy_doc:parse_frames"
  - имя: акты
    выгрузка: acts.json
    схема: Act
    результат: список
    форматы:
      - вид: таблица
        секция: "[Аа]кты"
        колонки:
          акт: {синонимы: [акт], тип: целое, обязательна: да, роль: ключ}
          название: {синонимы: [название]}
          главы: {синонимы: [глав], обязательна: да}
          части: {синонимы: [части]}
          шаги: {синонимы: [шаг]}
        запись: {act: акт, title: название, chapters_text: главы, parts: части, steps: шаги}
окно:
  показывать: ["шаги тома и акта, на которые приходится глава", "шаги главы"]
  запрещено: ["слабое место (оценка аналитика)"]
проверки_линтера: [КРУГ-1, КРУГ-2]
сигнатуры:
  имя_файла: [круг, каркас, драматург]
  строки: ["^##\\s*(Круг|Каркас)\\s+(тома|акта|главы)"]
  заголовки: [круг, каркас, акты тома]
