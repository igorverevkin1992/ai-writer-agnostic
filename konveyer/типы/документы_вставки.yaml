тип: документы_вставки
назначение: "Реестр вставных документов (рапорты, письма, протоколы): после какой главы, стиль, расхождение с правдой"
множественность: по_тому
имя_по_умолчанию: "25_Документы_Том{том}.md"
питает_модули: [окно, э1, э2, документы_вставки]
извлечения:
  - имя: документы
    выгрузка: documents.json
    схема: DocumentSpec
    результат: список
    форматы:
      - вид: таблица
        колонки:
          номер: {синонимы: ["№", номер], тип: целое, обязательна: да, роль: ключ}
          после: {синонимы: [после гл, после главы, глава], тип: целое, обязательна: да}
          стиль: {синонимы: [стиль]}
          расхождение: {синонимы: [расхождение]}
          вид: {синонимы: [вид, тип, что это]}
        постоянные: {volume: "{том}"}
        запись: {number: номер, after_chapter: после, style: стиль, divergence: расхождение, kind: вид, volume: volume}
окно:
  показывать: ["документ, назначенный после главы: вид, стиль"]
  запрещено: ["расхождение документа с правдой (ключ к тайне)"]
проверки_линтера: [ДОК-1]
сигнатуры:
  имя_файла: [документ, вставк, рапорт]
  колонки: [после гл, стиль, расхождение]
  заголовки: [документ, вставк]
