тип: акты
назначение: "Акты (части) тома: границы глав и названия"
множественность: по_тому
имя_по_умолчанию: "21_Акты_Том{том}.md"
питает_модули: [драматургия, линтер]
извлечения:
  - имя: акты
    выгрузка: acts.json
    схема: Act
    результат: список
    форматы:
      - вид: таблица
        колонки:
          акт: {синонимы: [акт, часть, "№"], тип: целое, обязательна: да, роль: ключ}
          название: {синонимы: [название, имя]}
          главы: {синонимы: [глав], обязательна: да}
          части: {синонимы: [части]}
          шаги: {синонимы: [шаг]}
        запись: {act: акт, title: название, chapters_text: главы, parts: части, steps: шаги}
проверки_линтера: [АКТ-1]
сигнатуры:
  имя_файла: [акт, части]
  колонки: [акт, главы]
  заголовки: [акты, части]
