тип: хронология
назначение: "Хронология фабулы: события с датами, участниками, томами и видимостью читателю"
множественность: один
имя_по_умолчанию: "12_Хронология.md"
питает_модули: [окно, линтер]
извлечения:
  - имя: события
    выгрузка: chronology.json
    схема: ChronologyEvent
    результат: список
    форматы:
      - вид: таблица
        колонки:
          id: {синонимы: [id, событие_id, "№"], обязательна: да, роль: ключ}
          дата: {синонимы: [дата], обязательна: да}
          событие: {синонимы: [событие], обязательна: да}
          участники: {синонимы: [участник]}
          том: {синонимы: [том], тип: целое}
          главы: {синонимы: [глав, читатель узна], тип: строка}
          примечание: {синонимы: [примечан, видимость]}
        запись: {event_id: id, date: дата, event: событие, participants: участники, volume: том,
                 visibility: главы, note: примечание, line: _строка}
окно:
  показывать: ["события предыдущих глав тома с участием фокала («что было раньше»)"]
  запрещено: ["события, скрытые от читателя (видимость «скрыт»)", "события будущих глав и томов"]
# слова колонки видимости, означающие «скрыто от читателя» и «фоном» (постобработка; проект может переопределить)
постобработка:
  видимость:
    скрыт: [скрыт]
    фон: [фон]
проверки_линтера: [ДОСЬЕ-4, ДОСЬЕ-5, КАНОН-1]
сигнатуры:
  имя_файла: [хронолог, chronology, фабул]
  колонки: [дата, событие, участник]
  заголовки: [хронолог, фабул, тома]
  строки: ["^\\|?\\s*(?:\\d{1,2}\\.\\d{2}\\.)?\\d{4}\\b", "^\\d{4}\\s*[—–-]"]
  слова: [событие, дата]
