тип: континуити
назначение: "Континуити: устойчивые детали — внешность, предметы, обстановка — с главами-источниками"
множественность: один
имя_по_умолчанию: "33_Континуити.md"
питает_модули: [окно, э2, линтер, континуити]
извлечения:
  - имя: детали
    выгрузка: continuity.json
    схема: ContinuityEvent
    результат: список
    форматы:
      - вид: таблица
        колонки:
          дата: {синонимы: [дата, где, источник], обязательна: да}
          событие: {синонимы: [событие, деталь, факт], обязательна: да}
          главы: {синонимы: [глав, встречается]}
          примечание: {синонимы: [примечан, статус]}
        запись: {date: дата, event: событие, chapters: главы, note: примечание}
      - вид: строки
        регэксп: "^-\\s+(?P<event>[^·]+?)\\s*·\\s*(?P<date>[^·]+?)(?:\\s*·\\s*(?P<note>.+))?$"
        описание: "буллеты «- деталь · т.X гл.Y · статус»"
        запись: {date: date, event: event, note: note, chapters: ""}
окно:
  показывать: ["детали участников сцены из глав, где фокал присутствовал"]
проверки_линтера: [КОНТ-1, ДОСЬЕ-3]
сигнатуры:
  имя_файла: [континуити, трекер, continuity]
  колонки: [деталь, главы, встречается, примечание]
  заголовки: [континуити, детал]
  строки: ["^-\\s+.+·\\s*(т\\.\\s*\\d+\\s*)?гл\\.?\\s*\\d+"]
