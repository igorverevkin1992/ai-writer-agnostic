тип: хроника_эпохи
назначение: "Факты реального мира по датам — проверка анахронизмов"
множественность: несколько
имя_по_умолчанию: "17_Хроника.md"
питает_модули: [э2, хроника_эпохи]
извлечения:
  - имя: хроника
    выгрузка: chronicle.json
    схема: ChronicleEvent
    результат: список
    форматы:
      - вид: таблица
        колонки:
          дата: {синонимы: [дата], обязательна: да, роль: ключ}
          событие: {синонимы: [событие, факт], обязательна: да}
          статус: {синонимы: [статус], по_умолчанию: "✓"}
        запись: {date: дата, event: событие, status: статус}
проверки_линтера: [ХРОН-4]
сигнатуры:
  имя_файла: [хроник, эпох]
  строки: ["^\\|?\\s*(?:\\d{1,2}[./]\\d{1,2}[./])?(?:1[6-9]|20)\\d{2}\\b"]
  колонки: [дата, событие, статус]
  заголовки: [хроника, год, эпох]
  не_слова: [фокал]
