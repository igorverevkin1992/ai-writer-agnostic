тип: мир
назначение: "Мир и организации: институты, правила мира, устройство"
множественность: несколько
имя_по_умолчанию: "14_Мир.md"
питает_модули: [окно, э2]
извлечения:
  - имя: организации
    выгрузка: world.json
    схема: WorldEntry
    результат: список
    форматы:
      - вид: таблица
        колонки:
          название: {синонимы: [название, организация, институт, имя], обязательна: да, роль: ключ}
          описание: {синонимы: [описание, суть, что это], обязательна: да}
          примечание: {синонимы: [примечан, статус]}
        постоянные: {kind: организация}
        запись: {name: название, description: описание, note: примечание, kind: kind, file: "{файл}"}
окно:
  показывать: ["организации, названные в сценах главы"]
сигнатуры:
  имя_файла: [мир, организац, world]
  колонки: [название, описание]
  заголовки: [организац, мир, институт]
  не_слова: [фокал, дата]
