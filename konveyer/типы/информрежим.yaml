тип: информрежим
назначение: "Информационный режим и тайны: что читатель узнаёт и когда, кто из персонажей знает, запреты будущих томов"
множественность: по_тому
имя_по_умолчанию: "24_Информрежим_Том{том}.md"
питает_модули: [окно, э2, линтер, информрежим]
извлечения:
  - имя: запреты
    выгрузка: infobans.json
    схема: InfoBan
    результат: список
    форматы:
      - вид: таблица
        колонки:
          ban_id: {синонимы: [ban_id, id, "№"], обязательна: да, роль: ключ}
          запрет: {синонимы: [запрет, тайна, что], обязательна: да}
          до_тома: {синонимы: [до тома, том], тип: целое}
          до_главы: {синонимы: [читатель узна, до главы, гл], тип: глава}
          тайна: {синонимы: ["тайна?", секрет], тип: да_нет}
          знают: {синонимы: [знают, кто знает]}
          маркеры: {синонимы: [маркер], тип: список}
        запись: {ban_id: ban_id, text: запрет, until_volume: до_тома, until_chapter: до_главы, secret: тайна,
                 known_text: знают, markers: маркеры}
окно:
  показывать: ["факт запрета («не упоминать X», если X не раскрывает тайну)", "число недоступных фокалу фактов"]
  запрещено: ["содержание тайн, недоступных фокалу"]
проверки_линтера: [ТАЙНА-3, ТАЙНА-4, ТАЙНА-5, ТАЙНА-6, ЭПИСТ-1, ПРОЗА-1]
сигнатуры:
  имя_файла: [информреж, тайн, режим]
  колонки: [тайна, читатель узна, запрет, до тома]
  заголовки: [информ, тайн, режим]
  слова: [тайна, читатель узнаёт, не раскрыва]
