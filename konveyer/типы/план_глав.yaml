тип: план_глав
назначение: "План глав (поглавник): дата, фокал, сцены, биты, запреты, объём каждой главы тома"
множественность: по_тому
имя_по_умолчанию: "23_План_глав_Том{том}.md"
обязателен_для_такта: да
питает_модули: [окно, э2, линтер]
извлечения:
  - имя: главы
    выгрузка: briefs.json
    схема: Brief
    результат: список
    форматы:
      - вид: секции_с_ключами
        заголовок: "Глава\\s+(\\d+)"
        ключи:
          дата: {ключ: Дата}
          год: {ключ: Год, тип: целое}
          фокал: {ключ: Фокал}
          участники: {ключ: Участники, тип: список_запятая}
          объём: {ключ: Объём, тип: целое}
          сцены: {ключ: Сцены, тип: список}
          биты: {ключ: Биты, тип: список}
          запреты: {ключ: Запреты, тип: список}
          не_знает: {ключ: "НЕ знает", тип: список}
          закладки: {ключ: Закладки, тип: список}
          документы: {ключ: Документы, тип: список}
          читатель: {ключ: "Читатель узнаёт"}
        постоянные: {volume: "{том}"}
        запись: {chapter: номер, date: дата, year: год, focal: фокал, participants: участники, volume_words: объём,
                 scenes: сцены, beats: биты, bans: запреты, not_knows: не_знает, plants: закладки, documents: документы,
                 reader_learns: читатель, volume: volume, line: _строка}
      - вид: таблица
        колонки:
          глава: {синонимы: [гл, глава, "№"], тип: целое, обязательна: да, роль: ключ}
          фокал: {синонимы: [фокал], обязательна: да}
          дата: {синонимы: [дата]}
          событие: {синонимы: [событие, что происходит, бит], обязательна: да}
          читатель: {синонимы: [читатель]}
        постоянные: {volume: "{том}"}
        запись: {chapter: глава, focal: фокал, date: дата, beats: событие, reader_learns: читатель, volume: volume,
                 line: _строка}
# образцы значения «Фокал», из которых берётся имя (группа «имя»): «глазами Зои» → «Зои» (далее нормализуется)
постобработка:
  фокал_образец: ["глазами\\s+(?P<имя>[^,;(]+)"]
окно:
  показывать: ["дата", "фокал", "сцены", "биты", "запреты", "объём", "явные «не знает»"]
  запрещено: ["колонка «что узнаёт читатель»", "клаузы, адресованные читателю или инструменту"]
проверки_линтера: [ХРОН-1, ХРОН-2, ХРОН-3, ХРОН-5, ПОГЛ-2, ФОКАЛ-1]
сигнатуры:
  имя_файла: [поглавник, план_глав, главы, chapters]
  заголовки: ["глава ", "гл. "]
  строки: ["^#{2,3}\\s*Гл(ава|\\.)\\s*\\d+", "^\\|\\s*\\d+\\s*\\|"]
  колонки: [гл, фокал, событие]
  слова: [фокал, сцен, бит]
каркас: |
  # 23. План глав · Том {том}

  ## Глава 1 — Название

  - Дата: ⚠ заполнить
  - Фокал: ⚠ заполнить
  - Сцены:
    - ⚠ заполнить
  - Биты:
    - ⚠ заполнить
