# Языковой модуль: русский (FR-V1-3). Правила деления на предложения, токенизации, прямой речи, основ слов
# и лексем для метрик. Проект может дополнить: `языки/ru.yaml` в папке проекта (списки складываются,
# скаляры переопределяются). Контекстное сокращение (префикс «~») не завершает фразу перед цифрой/строчной буквой
# («1995 г. в мае») и когда не идёт за числом («в г. Москве», «завод им. Ленина»); «1995 г. Москва» — конец фразы.
язык: ru
название: русский
буква: '[А-Яа-яЁёA-Za-z]'
слово: '[А-Яа-яЁёA-Za-z0-9]+(?:-[А-Яа-яЁёA-Za-z0-9]+)*'
конец_предложения: '[.!?…]+[»«\"'')\]]*'
# после терминатора — строчная буква (в т.ч. за тире реплики): фраза продолжается («кивнул… потом», «— Стой! — крикнул»)
продолжение_фразы: '\s*(?:[—–-]\s+)?[а-яё]'
инициал: (?<![А-Яа-яЁёA-Za-z])([А-ЯЁA-Z])\.
# роли безымянных участников сцен (ПОГЛ-2: «сторож», «врач» без карточки — не ошибка); проект дополняет список
роли_безымянных:
- сторож
- посыльный
- следователь
- санитар
- дежурный
- курьер
- врач
- официант
- соседка
- сосед
- водитель
- продавец
- прохожий
- охранник
# слова с заглавной буквы в таблицах канона, которые не имена (заголовки колонок, служебные слова таблицы фокалов)
не_имена:
- Тома
- Том
- Без
- Открывается
- Фокальные
- Фокал
- Линии
- Линия
- Персонаж
- Глава
- Главы
# одиночная заглавная с точкой после слова со строчной — не инициал, а конец фразы («группа А. Потом…»),
# если за ней не идёт ещё один инициал («Петров А. Х.»)
инициал_не_после: '[а-яёa-z]'
контекст_сокращения_перед: '[0-9а-яёa-z]'
документ_начало: '→ ДОКУМЕНТ'
документ_конец: '← КОНЕЦ ДОКУМЕНТА'
# текст без единой пустой строки (вывод редакторов и моделей): каждая строка — абзац; строка с тире реплики — всегда абзац
абзац_по_строке: да
заголовки_в_прозе:
- Глава
- Часть
- Пролог
- Эпилог
сокращения:
- т.е.
- т.д.
- т.п.
- т.н.
- и т.д.
- и т.п.
- н.э.
- гг.
- ~г.
- ул.
- пр.
- пер.
- ~д.
- кв.
- корп.
- стр.
- ~им.
- см.
- ср.
- руб.
- коп.
- тыс.
- млн.
- млрд.
- чел.
- экз.
- рис.
- табл.
- разд.
- гл.
- рожд.
- Рожд.
- тов.
- ~с.
- ~п.
- пп.
- ~ч.
- ст.
- обл.
- р-н
- пос.
- дер.
- сокр.
- англ.
- рус.
- лат.
# «т. е.», «и т. д.» с пробелом; «т.», «сц.» перед номером тома/сцены (ссылки канона «т.1 гл.4», «сц. 5.1»)
сокращения_с_пробелом: \b(?:и\s+)?т\.\s*[едпкн]\.|\b(?:т|сц)\.(?=\s*\d)
контекст_сокращения: '~'
тире_реплики:
- —
- –
- '-'
атрибуция_реплики: '[,.!?…]\s*[—–-]\s+'
нормализация:
  ё: е
# основы названий месяцев (регэксп-основа → номер) для дат канона: «12 июня», «май–июнь», «в марте»
месяцы:
  январ: 1
  феврал: 2
  март: 3
  апрел: 4
  "ма[йя]": 5
  июн: 6
  июл: 7
  август: 8
  сентябр: 9
  октябр: 10
  ноябр: 11
  декабр: 12
лексемы:
  был:
  - был
  - было
  - были
  - была
основы:
  окончания_основы:
  - ый
  - ий
  - ой
  - ая
  - яя
  - ое
  - ее
  - ые
  - ие
  - ом
  - ем
  - ам
  - ям
  - ах
  - ях
  - ов
  - ев
  - ей
  - ью
  - ь
  - а
  - я
  - о
  - е
  - ы
  - и
  - у
  - ю
  флексии: ерью|ерями|ерях|ерям|ерей|ери|ами|ями|ого|его|ому|ему|ыми|ими|ый|ий|ой|ей|ая|яя|ое|ее|ые|ие|ым|им|ых|их|ую|юю|ом|ем|ам|ям|ах|ях|ов|ев|ою|ею|ью|а|я|о|е|ы|и|у|ю|ь
  мин_основа: 3
  беглая_гласная: ^(.+[^аеиоуыэюя])[ео]([йцкнлрхв])$
# названия месяцев (основа → номер) для дат канона («май 1996», «12 июня»)
месяцы:
  январ: 1
  феврал: 2
  март: 3
  апрел: 4
  мая: 5
  май: 5
  июн: 6
  июл: 7
  август: 8
  сентябр: 9
  октябр: 10
  ноябр: 11
  декабр: 12
# склонение имён персонажей в тексте канона (names.py): падежные окончания после основы; предлоги, после которых
# имя — участник действия («к …», «с …»); окончания глаголов настоящего времени (имя — дополнение действия)
имена:
  окончания: [ами, ями, ой, ей, ом, ем, ым, им, ою, ею, ах, ях, ью, а, я, у, ю, е, и, ы, ь, й]
  усечение_основы: [а, я, ь, й]
  предлоги_действия: [к, ко, с, со, на, за, у, против, перед, рядом, вместе, между, при]
  окончания_глагола: '(?:[её]т|ит|[ую]т|[ая]т|ся|сь|ть|ти)$'
