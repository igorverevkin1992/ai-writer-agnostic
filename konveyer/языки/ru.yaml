# Языковой модуль: русский (FR-V1-3). Правила деления на предложения, токенизации, прямой речи, основ слов
# и лексем для метрик. Проект может дополнить: `языки/ru.yaml` в папке проекта (списки складываются,
# скаляры переопределяются). Контекстное сокращение (префикс «~») действует только перед цифрой/строчной буквой.
язык: ru
название: русский
слово: '[А-Яа-яЁёA-Za-z0-9]+(?:-[А-Яа-яЁёA-Za-z0-9]+)*'
конец_предложения: '[.!?…]+[»«\"'')\]]*'
инициал: (?<![А-Яа-яЁёA-Za-z])([А-ЯЁA-Z])\.
заголовки_в_прозе:
- Глава
- Часть
- Пролог
- Эпилог
сокращения:
- т.е.
- т.д.
- т.п.
- т.н.
- и т.д.
- и т.п.
- н.э.
- гг.
- ~г.
- ул.
- пр.
- пер.
- ~д.
- кв.
- корп.
- стр.
- ~им.
- см.
- ср.
- руб.
- коп.
- тыс.
- млн.
- млрд.
- чел.
- экз.
- рис.
- табл.
- разд.
- гл.
- тов.
- ~с.
- ~п.
- пп.
- ~ч.
- ст.
- обл.
- р-н
- пос.
- дер.
- сокр.
- англ.
- рус.
- лат.
сокращения_с_пробелом: \b(?:и\s+)?т\.\s*[едпкн]\.
контекст_сокращения: '~'
тире_реплики:
- —
- –
- '-'
атрибуция_реплики: '[,.!?…]\s*[—–-]\s+'
нормализация:
  ё: е
# основы названий месяцев (регэксп-основа → номер) для дат канона: «12 июня», «май–июнь», «в марте»
месяцы:
  январ: 1
  феврал: 2
  март: 3
  апрел: 4
  "ма[йя]": 5
  июн: 6
  июл: 7
  август: 8
  сентябр: 9
  октябр: 10
  ноябр: 11
  декабр: 12
лексемы:
  был:
  - был
  - было
  - были
  - была
основы:
  окончания_основы:
  - ый
  - ий
  - ой
  - ая
  - яя
  - ое
  - ее
  - ые
  - ие
  - ом
  - ем
  - ам
  - ям
  - ах
  - ях
  - ов
  - ев
  - ей
  - ью
  - а
  - я
  - о
  - е
  - ы
  - и
  - у
  - ю
  флексии: ами|ями|ого|его|ому|ему|ыми|ими|ый|ий|ой|ей|ая|яя|ое|ее|ые|ие|ым|им|ых|их|ую|юю|ом|ем|ам|ям|ах|ях|ов|ев|ою|ею|ью|а|я|о|е|ы|и|у|ю
  мин_основа: 3
  беглая_гласная: ^(.+[^аеиоуыэюя])[ео]([йцкнлрхв])$
