# Профиль УГАР: стилевой регламент без таблицы норм — числовые ориентиры прозой (Р-015), усилители из журнала (Р-016)
извлечения:
  - имя: нормы
    выгрузка: norms.json
    схема: Norm
    результат: "словарь:id"
    форматы:
      - {вид: плагин, функция: "угар:parse_norms_ugar"}
  - имя: усилители
    необязательно: да
    выгрузка: stoplists.json
    схема: StopRule
    результат: список
    форматы:
      - {вид: плагин, функция: "угар:parse_intensifiers_ugar"}
