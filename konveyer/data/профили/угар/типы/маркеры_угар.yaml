тип: маркеры_угар
назначение: "Маркеры поглавника и досье УГАР, которые не должны попадать в окно Писателя (профиль эталона, не движок)"
кратность: несколько
окно:
  # ссылка на будущее серии: «цикл II», «в цикле»
  маркеры_будущего: ["цикл"]
  # пометки инструменту/автору в скобках: «(матрица №17)», «(арка-парабола, старт)», «(эхо в гл.5)»,
  # «(реш. при прозе ⚠)», «(после фильтрации гл. 4)»
  маркеры_инструмента: ["матрица №", "арка-парабол", "эхо в гл", "реш. при прозе", "улика слоя", "после фильтрации"]
  # клаузы, адресованные читателю/перечитывателю
  маркеры_читателя: ["перечитывател", "улика\\s+слоя", "матриц[аы]\\s*№", "арка-парабол", "эхо\\s+в\\s+гл", "реш\\.\\s*при\\s*прозе"]
