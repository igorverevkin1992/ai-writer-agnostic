тип: эпистемика
# Колонка «Читатель» матрицы эталона: «улики с гл.4; расчётная разгадка ≈гл.20» — читатель узнаёт в гл. 20;
# одни «улики …» — знание не показано (пометка). Правила читаются прежде общих `ячейка_знания`.
ячейка_знания_псевдосубъекта:
  "разгадк[а-я]*\\D{0,25}?гл\\.?\\s*(\\d+)": N
  "улик": пометка
