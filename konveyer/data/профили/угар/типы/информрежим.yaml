# Профиль УГАР: реестр информационного режима тома — брифы (постраничная сетка), тайны и закладки (§7)
множественность: по_тому
извлечения:
  - имя: главы
    выгрузка: briefs.json
    схема: Brief
    результат: список
    форматы:
      - {вид: плагин, функция: "угар:parse_briefs_ugar"}
  - имя: запреты
    выгрузка: infobans.json
    схема: InfoBan
    результат: список
    форматы:
      - {вид: плагин, функция: "угар:parse_secrets_ugar"}
  - имя: закладки
    выгрузка: plants.json
    схема: Plant
    результат: список
    форматы:
      - {вид: плагин, функция: "угар:parse_plants_ugar"}
