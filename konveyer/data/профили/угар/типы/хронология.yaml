извлечения:
  - имя: события
    выгрузка: chronology.json
    схема: ChronologyEvent
    результат: список
    форматы:
      - {вид: плагин, функция: "угар:parse_chronology_ugar"}
сигнатуры:
  имя_файла: [хронолог, chronology, фабул]
  колонки: [дата, событие, участник]
  заголовки: [хронолог, фабул, тома]
  строки: ["^\\*\\*[А-ЯA-Z]-\\d{4}-\\d+\\*\\*", "^\\|?\\s*(?:\\d{1,2}\\.\\d{2}\\.)?\\d{4}\\b"]
  слова: [событие, дата]
