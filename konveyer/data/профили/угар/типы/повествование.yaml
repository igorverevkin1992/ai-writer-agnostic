# Профиль УГАР: «Персональные запреты линий» и прозаические запреты вместо таблицы стоп-листов
извлечения:
  - имя: законы
    выгрузка: narration.json
    схема: NarrationRules
    результат: список
    форматы:
      - {вид: плагин, функция: "угар:parse_narration_ugar"}
  - имя: стоп_листы_линий
    выгрузка: stoplists.json
    схема: StopRule
    результат: список
    форматы:
      - {вид: плагин, функция: "угар:parse_stoplists_ugar"}
