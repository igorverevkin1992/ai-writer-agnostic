# КОНВЕЙЕР · конфиг.yaml — технологические параметры проекта (FR-AD-1, FR-AD-2, FR-EC-1, FR-EC-2, FR-BK-*).
# Нормы прозы здесь не живут (П-1): они в документе стиля библиотеки. Русские ключи равноправны латинским
# (библиотека / library_dir, модели / writer…, пороги / thresholds, текущий_том / volume, папка_архива / backup_dir …).
# Точные ID и параметры моделей впишите при настройке; их смена — через пере-тест и запись в журнал решений (FR-RT-2).

library_dir: "Библиотека"

writer:                      # Писатель — пин версии модели (Д-16)
  provider: gemini
  model: "gemini-3.1-pro"    # уточнить точный ID при старте (`konveyer доктор` сверяет пины с API, FR-RT-3)
  params:                    # параметры, при которых пройден отбор; передаются в SDK как есть
    thinking_config:         # уровень размышлений (google-genai: ThinkingConfig.thinking_level)
      thinking_level: HIGH   # MINIMAL | LOW | MEDIUM | HIGH
  # цены за 1 млн токенов для оценки стоимости (журналы/api.jsonl, FR-CT-1); 0 = не считать
  price_in_per_1m: 0.0       # или: цена_вход_1м
  price_out_per_1m: 0.0      # или: цена_выход_1м
  # режим_без_обучения: да  # FR-SC-10: провайдер не обучается на текстах автора (по умолчанию — да; «нет» подсветит доктор)

verifier2:                   # Верификатор-2
  provider: anthropic
  model: "claude-sonnet-4-5" # пин точного ID при настройке
  params:
    max_tokens: 8192

canonist:                    # Канонист
  provider: anthropic
  model: "claude-sonnet-4-5"
  params:
    max_tokens: 8192

# Необязательные роли (FR-AD-2): не заданы — наследуют модель Канониста.
# аналитик:                  # аналитик драматургии (круги истории)
#   provider: anthropic
#   model: "claude-sonnet-4-5"
# линтер:                    # модельный слой линтера канона
#   provider: anthropic
#   model: "claude-sonnet-4-5"
# архивариус:                # модельный слой онбординга
#   provider: anthropic
#   model: "claude-sonnet-4-5"

api:                         # повторы и таймаут вызовов (FR-AD-4)
  retries: 3
  backoff_base_s: 2.0
  timeout_s: 120

window_soft_limit_chars: 80000   # мягкий лимит окна, знаков (Д-20); или: лимит_окна
auto_retries_verify1: 2          # авто-повторы Э1 при браке метрик (FR-TK-3)
edit_cycle_max_iterations: 3     # лимит итераций цикла правок (FR-TK-3)

# пороги предупреждений экономики (FR-EC-2); 0 — не предупреждать. Или: пороги: {стоимость_главы, расход_за_сутки}
# thresholds:
#   chapter_cost_usd: 1.0
#   daily_cost_usd: 5.0
# ориентиры: {окно_знаков: 13000, выход_токенов: 1200}   # размеры для ориентиров FR-EC-3, пока нет фактов журнала
# пауза_автора_мин: 120            # авторская пауза дольше порога — перерыв, не работа (FR-CT-2)

backup_remotes_min: 2            # мест хранения библиотеки (FR-BK-1); или: мест_хранения_мин
# backup_dir: "../архивы"        # архив рабочей области после каждой приёмки главы (FR-BK-2); без него — `konveyer бэкап --архив`
# backup_keep: 10                # сколько последних архивов хранить; или: хранить_архивов
# commit_author: "Автор <автор@example.com>"  # авторство коммитов канона (Д-17); или: автор_коммита
