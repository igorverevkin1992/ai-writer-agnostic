# КОНВЕЙЕР · конфиг.yaml — модели ролей, ключи (через .env), цены, пороги, бэкап (ТЗ v1.0, §8–§9, §11).
# Нормы прозы здесь не живут (П-1): они в документе стиля библиотеки. Русские ключи равноправны латинским
# (библиотека / library_dir, писатель / writer, пороги / thresholds, текущий_том / volume, папка_архива / backup_dir …).
# Копируется в каждый новый проект. Точные ID моделей впишите при настройке; смена модели или провайдера —
# через пере-тест и запись в журнал решений (FR-RT-2). Секреты только в .env / переменных окружения.

библиотека: "Библиотека"          # папка канона проекта (свой git-репозиторий, FR-DM-1)
текущий_том: 1                    # том, над которым идёт работа (главы/, выгрузки/ — по нему); меняет `konveyer том`

# ---- роли и модели (FR-AD-2): каждая роль привязана к модели независимо. Провайдеры: gemini, anthropic, ручной.
# Провайдер «ручной» — без API: система готовит промпт файлом, ответ автор кладёт файлом (FR-AD-3, П-5).
писатель:                         # Писатель — единственная роль, пишущая прозу
  provider: gemini
  model: "gemini-3.1-pro"         # точный ID модели у провайдера (`konveyer doctor` сверяет пины с API)
  режим_без_обучения: да          # провайдер не обучается на текстах автора (FR-SC-10); доктор напоминает, если нет
  params:                         # параметры генерации, при которых пройден отборочный тест (Д-16); в SDK — как есть
    thinking_config:
      thinking_level: HIGH        # MINIMAL | LOW | MEDIUM | HIGH
  цена_вход_1м: 0.0               # цены за 1 млн токенов (вход/выход) — для оценки стоимости в журналы/api.jsonl
  цена_выход_1м: 0.0              # и `konveyer учёт` (FR-EC-1); 0 = не считать; латинские синонимы price_in_per_1m/price_out_per_1m

верификатор2:                     # Верификатор-2 — проверка главы по чек-листам модулей
  provider: anthropic
  model: "claude-opus-5"
  режим_без_обучения: да
  params:
    max_tokens: 8192
  цена_вход_1м: 0.0
  цена_выход_1м: 0.0

канонист:                         # Канонист — предложения правок канона (в библиотеку — только через подтверждение)
  provider: anthropic
  model: "claude-opus-5"
  режим_без_обучения: да
  params:
    max_tokens: 8192
  цена_вход_1м: 0.0
  цена_выход_1м: 0.0

# Аналитик драматургии, линтер (модельный слой) и архивариус (онбординг) наследуют модель Канониста,
# если не заданы явно — раскомментируйте, чтобы назначить свою:
# аналитик:
#   provider: anthropic
#   model: "claude-opus-5"
# линтер:
#   provider: ручной              # пример ручного режима для роли: пакет промптов файлами, без ключа
#   model: "ручной"
# архивариус:
#   provider: anthropic
#   model: "claude-opus-5"

api:                              # сеть (§9): повторы с нарастающей паузой, таймаут одного вызова
  retries: 3
  backoff_base_s: 2.0
  timeout_s: 120

# ---- пороги и лимиты
пороги:                           # предупреждения по деньгам (FR-EC-2); 0 = не предупреждать
  стоимость_главы: 0.0            # долларов на одну главу (все вызовы такта)
  расход_за_сутки: 0.0            # долларов за календарные сутки
# пауза_автора_мин: 30            # пауза дольше этого не считается временем автора в задаче (FR-CT-2)
лимит_окна: 80000                 # мягкий лимит окна Писателя в знаках; превышение — предупреждение, не отказ
auto_retries_verify1: 2           # автоповторов Писателя по красным метрикам Э1 до вопроса автору
edit_cycle_max_iterations: 3      # итераций цикла правок главы до вопроса автору
backup_remotes_min: 2             # сколько удалённых копий библиотеки требует доктор (FR-BK-1)
# backup_dir: "../архивы"         # архив рабочей области после каждой приёмки главы (FR-BK-2); без него — `konveyer бэкап --архив`
# push_после_приёмки: да          # после приёмки главы отправлять библиотеку во все remotes (нужна сеть; иначе `konveyer бэкап --push`)
# backup_keep: 10                 # сколько последних архивов хранить
# commit_author: "Автор <автор@example.com>"  # авторство коммитов, если git не настроен
# ориентиры: {окно_знаков: 13000, выход_токенов: 1200}   # размеры для ориентиров экономики (FR-EC-3), пока нет фактов журнала
# бюджет_линтера: 0.0             # бюджет модельного слоя линтера за прогон, $ (FR-LT-3); 0 — без лимита
