# Заведомые противоречия демо-канона (NFR-9; §7.11 «Приёмка»): по одному на класс проверок линтера.
# Поставляемая библиотека чиста (ноль находок); `konveyer init --демо --противоречия` вносит эти правки
# в развёрнутую копию, а tests/test_этап5.py проверяет по этому же списку, что линтер ловит каждое
# и ничего лишнего. Поля: код — ожидаемая находка; файл — документ библиотеки; было → стало — замена
# первого вхождения (без «было» — файл создаётся целиком; «манифест» — запись для него в проект.yaml);
# следствия — коды, которые законно тянет за собой это противоречие в смежных реестрах.
