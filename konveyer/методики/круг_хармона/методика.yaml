методика: круг_хармона
название: "Круг истории (восемь шагов)"
уровни: [том, акт, глава]
заголовок_документа: Круг
незаданный_шаг: "(шаг {n} «{name}» в каркасе главы не задан — изменение фокала не требуется)"
шаги:
  - {n: 1, имя: Ты, описание: "исходное состояние, зона привычного"}
  - {n: 2, имя: Потребность, описание: "чего не хватает / что выбивает из равновесия"}
  - {n: 3, имя: Переход, описание: "шаг в незнакомую ситуацию"}
  - {n: 4, имя: Поиск, описание: "адаптация, проба, цена"}
  - {n: 5, имя: Обретение, описание: "получение искомого (или его подмены)"}
  - {n: 6, имя: Расплата, описание: "цена обретения, удар"}
  - {n: 7, имя: Возвращение, описание: "назад в привычный мир"}
  - {n: 8, имя: Изменение, описание: "кем стал; что изменилось необратимо"}
обязательность:
  том: [1, 2, 3, 4, 5, 6, 7, 8]
  акт: [1, 2, 3, 4, 5, 6, 7, 8]
  глава: [1, 2, 3, 4, 5, 6, 7]
