# 17 правил фэнтези-мифа. Источник: исследование продюсера (октябрь 2026), части 1, 3.4, 4.4, 6, 7.
# check.code — что считает код; check.llm — что решает судья другого семейства с цитатой.
# Привязка правил к проверкам кода — Claude Code, утверждено продюсером 01.10.2026.
module: slavic_myth
title: Тёмное славянское фэнтези-миф
stub: false
rules:
  - id: R01
    module: slavic_myth
    text: "Главный вопрос — «Кем ты станешь, пройдя иной мир и заплатив его цену?». Тема — искупление. Герой — искатель. Вопрос ставится в 1-й серии, ответ — в 60-й"
    check:
      code: "опорные точки talisman (1) и redemption (59–60)"
      llm: "Вопрос «кем ты станешь» поставлен в 1-й серии и получает ответ в финале? Финал — искупление, а не просто победа?"
      run:
        - {fn: season_frame, only: [anchor.talisman, anchor.redemption]}
    severity: blocker
  - id: R02
    module: slavic_myth
    text: "Каждая серия открывается образом мира и конфликтом в первые 3 секунды. Два мира рядом, граница видна в кадре"
    check:
      llm: "В первых 3 секундах каждой серии есть образ мира и конфликт? Граница миров видна?"
    severity: major
  - id: R03
    module: slavic_myth
    text: "Закон мира показывается через нарушение, а не лекцией. Законов может быть сколько угодно, но у каждого — серия, где его произносят, и серия, где он срабатывает с видимым последствием. В 4-й серии называются правила: срок и цена"
    check:
      code: "у каждого правила мира есть heard_eps и plays_eps, срабатывает не раньше, чем произнесено; опорная точка rules_recount в 4-й серии"
      llm: "Закон мира зритель узнаёт через нарушение, а не из объяснения? В 4-й серии названы срок и цена? Нет ли закона, который так и не сработал?"
      run:
        - {fn: world_rules, params: {min: 1, require_episodes: true}}
        - {fn: season_frame, only: [anchor.rules_recount]}
    severity: blocker
  - id: R04
    module: slavic_myth
    text: "Каждая магия и каждый рост силы оплачены в кадре. «Сила без усилий» запрещена. Обереги — ресурс с ценой"
    check:
      llm: "Каждое применение магии и каждый рост силы героя чем-то оплачены, и цена видна в кадре?"
    severity: blocker
  - id: R05
    module: slavic_myth
    text: "8-я серия — точка оплаты: обрыв-вопрос, ответ на который нельзя угадать из бесплатных серий. Платят за картинку, не за слово. Каждая из 9–11-й даёт то, чего бесплатно не было"
    check:
      code: "в серии paywall_hook есть раскрытие тайны; опорные точки paywall_hook (8) и paywall_answer (9–11)"
      llm: "Обрыв 8-й серии — вопрос, который нельзя угадать? Каждая из 9–11-й дарит новое, и купивший доступ не чувствует обмана?"
      run:
        - {fn: paywall_hook, params: {anchor: paywall_hook, needs: [reveal]}}
        - {fn: season_frame, only: [anchor.paywall_hook, anchor.paywall_answer]}
    severity: blocker
  - id: R06
    module: slavic_myth
    text: "60 серий по кругу истории: переход границы 5–8, пинч 22, мидпоинт 30 (рана раскрыта целиком), пинч 37, нисхождение в Навь 38–48, обряд 49–58, искупление 59–60. Опорные точки на своих номерах ±1"
    check:
      code: "checkSeasonFrame: все опорные точки каркаса"
      run:
        - {fn: season_frame}
    severity: blocker
  - id: R07
    module: slavic_myth
    text: "Пять антагонистов идут лестницей, у каждого свой блок серий. Каждый следующий бьёт глубже: внимание, имущество, правда, жизнь, душа. В конце — «власть» мира"
    check:
      code: "checkVillainLadder: число, ранги, роли, появление, снятие по блокам и по порядку"
      llm: "Угроза каждого следующего антагониста глубже прежней? У каждого чудовища своя форма, цвет и звук?"
      run:
        - {fn: villain_ladder, only: [count, rank, role, on_screen, introduced, takedown, takedown_plan, order]}
    severity: blocker
  - id: R08
    module: slavic_myth
    text: "Каждое чудовище даёт подсказку к следующему и берёт цену. Чудовище закрывается за блок, а подсказка и цена переходят в сквозной сюжет. Главный антагонист связан с раной героя"
    check:
      code: "у каждого антагониста key_to_next, у главного — link_to_ghost; после снятия — ответный удар"
      llm: "Каждая подсказка стоит герою цену? Подсказки ведут к следующему чудовищу, а не появляются из ниоткуда?"
      run:
        - {fn: villain_ladder, only: [key_to_next, counterstrike]}
    severity: major
  - id: R09
    module: slavic_myth
    text: "Чудовища уходят по-разному и по законам фольклора: побеждены в испытании, откуплены договором, упокоены, изгнаны, стали дарителем. Подряд одинаково — нельзя"
    check:
      code: "способ ухода — из списка жанра; соседние антагонисты уходят по-разному; дарителем становится не больше одного"
      llm: "Способ победы следует из закона и слабости этого существа (оберег, договор, запрет), а не из силы героя?"
      run:
        - {fn: villain_ladder, only: [punishment, turned_ally]}
    severity: major
  - id: R10
    module: slavic_myth
    text: "Серия 90–120 с: 0–3 с — образ; 3–15 — ответ на вчерашний вопрос и новая проблема; новый стимул каждые 10–15 с; мини-поворот около 45-й; 60–80 — цена или решение; финал — обрыв на вопросе. Резать на две секунды раньше, чем безопасно"
    check:
      code: "2–3 эмоции в серии; тип крючка не больше 2 серий подряд"
      llm: "Серия начинается с ответа на вчерашний вопрос и кончается вопросом? Есть мини-поворот в середине?"
      run:
        - {fn: rhythm, only: [hook_repeat, emotions]}
    severity: major
  - id: R11
    module: slavic_myth
    text: "Герой действует в каждой серии. Удар антагониста → ответ за 1–3 серии. Тьма — не дольше 3 серий подряд"
    check:
      code: "удар → ответ за 1–3 серии; подряд не больше 3 серий mood suffering"
      run:
        - {fn: rhythm, only: [response, suffering]}
    severity: major
  - id: R12
    module: slavic_myth
    text: "Положительная арка: до мидпоинта герой живёт во Лжи («чудовище — чужой»), после — в Истине («чудовищем был я»). Рану раскрывать по частям, целиком — на мидпоинте; тогда цель меняется на искупление"
    check:
      code: "хотя бы одна смена цели около мидпоинта"
      llm: "Ложь героя видна до 30-й серии, а после мидпоинта он действует из Истины? Рана раскрыта по частям, а не одной лекцией?"
      run:
        - {fn: secret_turns, params: {min: 1, near: [midpoint]}}
    severity: blocker
  - id: R13
    module: slavic_myth
    text: "У героя постоянный спутник-проводник. Одна функция на спутника: проводник, совесть или трикстер. В 30–36-й спутник платит цену — первым, раньше героя"
    check:
      code: "опорная точка companion_cost (30–36)"
      llm: "У героя есть постоянный проводник? У каждого спутника одна функция? Цена спутника настоящая?"
      run:
        - {fn: season_frame, only: [anchor.companion_cost]}
    severity: major
  - id: R14
    module: slavic_myth
    text: "Финал без драки-хореографии: битва становится обрядом-испытанием, где герой сражается за право сказать правду. Самооткровение публичное. Община платит за молчание, а не только кается. Новое равновесие — «перерасти кодекс»"
    check:
      code: "опорные точки climax_rite (49–58) и public_revelation (56–58)"
      llm: "Кульминация — обряд, а не драка? Герой признаёт вину публично? Община платит за своё молчание?"
      run:
        - {fn: season_frame, only: [anchor.climax_rite, anchor.public_revelation]}
    severity: blocker
  - id: R15
    module: slavic_myth
    text: "Существа и обряды — из классических собраний (Афанасьев, Даль, Максимов, Зеленин): у каждого место, закон и запрет, слабость или договор, грех или страх. Затасканные образы — только с поворотом. Известно, кто что знает и с какой серии"
    check:
      code: "хронология и знание персонажей"
      llm: "Закон, запрет и слабость существа взяты из фольклора, а не придуманы под удобство сюжета? Затасканный образ повёрнут по-новому?"
      run:
        - {fn: timeline}
        - {fn: knowledge}
    severity: major
  - id: R16
    module: slavic_myth
    text: "Ничего из «Ведьмака» и не пара «охотник ищет девочку». Нет узнаваемых современных армии и полиции, священник не злодей, ребёнок не страдает в кадре, семья и отцовство в центре, никаких реальных лиц"
    check:
      code: "checkLegalMarkers"
      llm: "Нет ли заимствований из «Ведьмака» и пары «Геральт — Цири»? Ребёнок не страдает в кадре? Религия и армия не задеты?"
      run:
        - {fn: legal_markers}
    severity: blocker
  - id: R17
    module: slavic_myth
    text: "Писать, чтобы ИИ снял: кадр 5–12 с; не больше 3 человеческих лиц в кадре, у чудовищ нет человеческих лиц; лицо крупно не дольше 5 с; диалог — через закадровый голос, силуэт, руки; драка — «удар, вспышка, последствие», не больше 3 планов; толпа — огни, тени, голоса; ночь, туман, вода, огонь прячут артефакты; у каждого героя неизменный визуальный якорь; никаких надписей в кадре; камера — словами"
    check:
      code: "checkLimits, checkScriptMetrics"
      llm: "Сцены сняты кадрами 5–12 с? Лицо крупно не дольше 5 с? Драка не длиннее 3 планов? Нет толп и надписей? У героев есть визуальные якоря?"
      run:
        - {fn: limits}
        - {fn: script_metrics}
    severity: blocker
