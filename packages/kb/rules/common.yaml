# Общие правила для всех жанров: из методик (Моуэри, Рабкин, Уэйланд), утверждены продюсером 14.10.2026.
# Жанр подключает их строкой `common_rules: true` в genres/<id>.yaml и получает их после своих R-правил.
# Что у жанра своё (опорная точка середины, что именно обещает первая серия) — переопределение
# в rules/<жанр>.yaml, раздел `common:` (text, severity, check.code/llm/run, fix_hints).
# Слова о герое — через {{hero.nom}}/{{hero.gen}}/{{hero.dat}}: подставляются термины жанра или проекта.
module: common
title: Общие правила драматургии сезона
stub: false
rules:
  - id: C01
    module: common
    text: "Три ставки сезона — внешняя (что {{hero.nom}} получит или потеряет), внутренняя (отношения, эмоциональное ядро) и философская (чья правда победит) — записаны в библии и закрыты в финальном блоке, каждая по отдельности"
    check:
      code: "в библии есть stakes из трёх ставок; closed_ep каждой — в финальном блоке каркаса"
      llm: "В финале по каждой из трёх ставок ясно, чем она кончилась для {{hero.gen}} — победой или проигрышем? Философская ставка решена действием, а не речью?"
      run:
        - {fn: stakes}
    severity: major
    fix_hints: ["Назвать ставки одной фразой каждую и серию закрытия", "Если ставка решается раньше финала — финал теряет её; перенести закрытие или поднять ставку"]
  - id: C02
    module: common
    text: "Арка {{hero.gen}} расписана по сериям: до мидпоинта не меньше трёх поступков по Лжи с ценой, после мидпоинта — хотя бы один откат ко Лжи, за который {{hero.nom}} платит. Ложь и Правда — одной фразой каждая в библии"
    check:
      code: "в плане серии с arc: lie до опорной точки midpoint — не меньше 3; после неё есть arc: relapse"
      llm: "Каждый отмеченный поступок по Лжи стоит {{hero.dat}} чего-то? Откат после мидпоинта правдоподобен и оплачен? Финальный выбор — между Ложью и Правдой?"
      run:
        - {fn: hero_arc, params: {anchor: midpoint, min_lie_acts: 3, relapse: true}}
    severity: major
    fix_hints: ["Отметить arc: lie в сериях, где {{hero.nom}} действует по Лжи", "Дать откат ко Лжи после мидпоинта и его цену"]
  - id: C03
    module: common
    text: "Каждая победа {{hero.gen}} до финального блока стоит {{hero.dat}} чего-то в той же или следующей серии. Победа без цены останавливает историю"
    check:
      code: "у каждой серии с victory: true до финального блока есть cost в ней или в следующей"
      llm: "Цена каждой победы видна в кадре и бьёт по тому, что {{hero.dat}} дорого? Из цены рождается проблема следующей серии?"
      run:
        - {fn: victory_cost, params: {within: 1}}
    severity: major
    fix_hints: ["Записать цену победы в cost той же или следующей серии", "Если цены нет — победа не настоящая: отнять у {{hero.gen}} что-то взамен"]
  - id: C04
    module: common
    # Что именно обещает жанр и чем это проверяет код (опорная точка или линия кайфа 1-й серии) — в переопределении жанра.
    text: "То, что обещает жанр, — в первой серии. Пилот считают образцом всех серий — чего нет в первой, того для зрителя нет в сериале"
    check:
      code: "в 1-й серии есть опорная точка или линия кайфа, которые жанр называет своим обещанием (параметры проверки promise у жанра)"
      llm: "Первая серия показывает то, за чем зритель пришёл? Нет ли «разогрева» без обещания?"
    severity: major
    fix_hints: ["Перенести обещанное жанром в первую серию, не откладывать до разогрева сюжета"]
