# 18 правил жанра. Источник: SPEC.md, раздел «18 правил жанра» (ТЗ v2 от продюсера).
# check.code — что считает код (checks/code, веха M3); check.llm — что решает судья другого семейства с цитатой.
module: revenge_thriller
title: Женский психологический триллер мести с семейной тайной
stub: false
rules:
  - id: R01
    module: revenge_thriller
    text: "Предательство — в 1-й серии. В первые 60–90 секунд героиня сама видит или слышит предательство"
    check:
      code: "серия и секунда события betrayal: ep 1, ep1_second <= 90"
      llm: "Предательство показано с точки зрения героини: она сама видит или слышит его?"
    severity: blocker
  - id: R02
    module: revenge_thriller
    text: "Предатель — самый близкий человек с корыстным мотивом. Сильнее всего: муж + деньги героини + угроза её близкому. Предатель — финальный босс или его правая рука"
    check:
      code: "ранг предателя (betrayal.who среди villains) — 1 или 2"
      llm: "Мотив предателя корыстный? Он самый близкий героине человек?"
    severity: blocker
  - id: R03
    module: revenge_thriller
    text: "Маска. Героиня решает скрыть, что знает, в 1–3-й серии и дальше всегда знает больше, чем показывает"
    check:
      code: "у героини заполнено поле mask; опорная точка mask в сериях 1–3"
      llm: "В сценах героиня ведёт себя так, будто знает меньше, чем знает?"
    severity: major
  - id: R04
    module: revenge_thriller
    text: "Героиня не жертва. Действует в каждой серии. Страдание — не дольше 2 серий подряд, после него кайф"
    check:
      code: "heroine_action заполнено в каждой карточке; подряд не больше 2 серий с mood suffering"
    severity: blocker
  - id: R05
    module: revenge_thriller
    text: "Первая победа — в 3-й серии. Снят злодей 5, пешка"
    check:
      code: "checkVillainLadder: снятие ранга 5 в серии 3"
    severity: blocker
  - id: R06
    module: revenge_thriller
    text: "Удар → ответ за 1–3 серии в обе стороны. После каждой победы героини злодеи бьют в ответ за 1–3 серии"
    check:
      code: "checkRhythm"
    severity: major
  - id: R07
    module: revenge_thriller
    text: "Устройство серии. 0–5 с — продолжение прошлого крючка, одно событие, один новый вопрос, 2–3 эмоциональные точки, клиффхэнгер в последние 5–10 с. Один тип крючка — не больше 2 серий подряд"
    check:
      code: "поля карточки заполнены; hook_type не повторяется больше 2 серий подряд"
      llm: "В серии одно событие?"
    severity: major
  - id: R08
    module: revenge_thriller
    text: "Всегда 60 серий, точки на своих номерах ±1. Paywall после 8-й, пинч 1 — 22, мидпоинт — 30, пинч 2 — 37, падение — 45–49 (не дольше 5 серий), главное раскрытие — 48–51, финал — 59–60"
    check:
      code: "checkSeasonFrame"
    severity: blocker
  - id: R09
    module: revenge_thriller
    text: "8-я серия — точка оплаты. Частичное раскрытие тайны + угроза героине. Самый сильный крючок сезона"
    check:
      code: "в серии paywall_hook есть reveals_secret и threat_to_heroine"
      llm: "Крючок 8-й серии — самый сильный в сезоне?"
    severity: blocker
  - id: R10
    module: revenge_thriller
    text: "Тайна меняет цель мести минимум дважды: около 10-й серии и на мидпоинте. Мидпоинт — контрраскрытие, может перевернуть лестницу злодеев"
    check:
      code: "не меньше двух смен цели в secret.goal_from/goal_to: около secret_turn и на midpoint"
      llm: "Цель мести реально меняется, а не просто добавляется информация?"
    severity: major
  - id: R11
    module: revenge_thriller
    text: "Ровно пять злодеев, снизу вверх: пешка — 3, исполнитель — 18–20, страж — 38–40, правая рука — 48–50, финальный босс — 57–59. Все в кадре к 10-й серии, босс — в 1-й, под маской"
    check:
      code: "checkVillainLadder"
    severity: blocker
  - id: R12
    module: revenge_thriller
    text: "Каждая победа — ключ к следующему злодею. Каждый следующий опаснее и ближе к героине. Финальный босс связан с её главной раной"
    check:
      code: "у каждого злодея заполнено key_to_next, у босса — link_to_ghost"
      llm: "Связь победы со следующим злодеем и связь босса с раной героини — настоящие?"
    severity: major
  - id: R13
    module: revenge_thriller
    text: "Злодей проигрывает уму героини, а не своей глупости. У каждого свой план и слабость. Хотя бы одна победа — через стравливание злодеев"
    check:
      code: "у каждого злодея own_plan и weakness; хотя бы у одного via_infighting: true"
      llm: "Нет ли победы за счёт глупости злодея?"
    severity: major
  - id: R14
    module: revenge_thriller
    text: "Самый сильный кайф — публичное разоблачение. Злодея 2 — перед его кругом, финального босса — «битва историй» перед большой аудиторией"
    check:
      code: "punishment.public у рангов 2 и 1"
      llm: "Сцена разоблачения — публичная и самая сильная в сезоне?"
    severity: blocker
  - id: R15
    module: revenge_thriller
    text: "Законный финал. Суд, следствие, документы, без самосуда. Злодеи — частные лица, силовики — компетентные союзники. Насилие за кадром, без курения, 16+"
    check:
      code: "checkLegalMarkers"
      llm: "Юридический контролёр: финал законный, силовики — союзники, насилия в кадре нет?"
    severity: blocker
  - id: R16
    module: revenge_thriller
    text: "Героиня побеждает сама. Женский союз сильнее «спасающего мужчины», любовь — фон. Финал закрывает каждого злодея, тайну и новую жизнь героини, одна нить — на второй сезон"
    check:
      llm: "Кто принимает решения в ключевых сценах? Что закрыто в финале и какая одна нить оставлена?"
    severity: major
  - id: R17
    module: revenge_thriller
    text: "Никаких дыр. У каждого правила мира есть причина и цена. На вопросы «почему никто не заметил?», «почему она не бежит?», «почему никому не рассказывает?» есть ответ, видимый в кадре. Известно, кто что знает и с какой серии"
    check:
      code: "checkTimeline, checkKnowledge"
      llm: "«Адвокат дьявола» по 11 типам дыр"
    severity: blocker
  - id: R18
    module: revenge_thriller
    text: "Снимается дёшево и читается на телефоне. До 8 постоянных героев, до 10 локаций внутри одной основной, до 3 говорящих, эффекты только практические. Раскрытие понятно без звука за 2 секунды. Реплика-удар — до 12 слов, реплик — 200–300 знаков в минуту"
    check:
      code: "checkLimits, checkScriptMetrics"
      llm: "«Проверка метро» и производственный контролёр"
    severity: major
