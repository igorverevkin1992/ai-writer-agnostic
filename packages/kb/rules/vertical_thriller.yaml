# Правила вертикального триллера, саспенса и хоррора. Источник: исследование продюсера «Драматургия
# вертикальных сериалов в хорроре, мистике и триллере» (октябрь 2026): блоки 1–6, стоп-факторы линтера
# L01–L32; дополнено общими правилами микродрам из второго исследования. Общие правила C01–C04
# (ставки, арка героини, цена победы, обещание жанра) подключены из rules/common.yaml, см. `common:` внизу.
# check.code — что считает код; check.llm — что решает судья другого семейства с цитатой.
# Числа лимитов живут в одном месте — в каркасе (frames/thriller60.yaml) и производственных рамках
# (constraints/vertical_live.yaml); тексты ссылаются на них: {{limits.*}}, {{metrics.*}}, {{rhythm.*}},
# {{anchors.*}}, {{inputs.paywall}}, {{L}}. Главный персонаж — «героиня» по умолчанию жанра; проект может
# задать свой термин, модель читает его как термин проекта.
module: vertical_thriller
title: Вертикальный триллер, саспенс и хоррор
stub: false
rules:
  - id: R01
    module: vertical_thriller
    text: "Хук в первые 3 секунды — один из видов хука каркаса (hook_kinds): нарушение нормы, in media res, парадоксальная реплика, визуальный шок или продолжение обрыва. Стоп-кадр на 3-й секунде понятен без предыстории и без звука"
    check:
      code: "в карточке есть бит HOOK с hook_kind из словаря каркаса, он заканчивается не позже 3-й секунды"
      llm: "Стоп-кадр на 3-й секунде понятен случайному зрителю без предыстории и без звука? Хук 1-й серии работает как самостоятельное промо?"
      run:
        - {fn: beats, only: [missing, hook_long, order]}
    severity: blocker
    fix_hints: ["Начать с нарушения нормы или посреди действия", "Если хук требует объяснения — переписать сцену, а не добавлять титр"]
  - id: R02
    module: vertical_thriller
    text: "Серия кончается клиффхэнгером, не разрешением (кроме финала сезона). Обрыв — задержанный кадр, задающий вопрос; обрыв на полуслове без новой информации или угрозы — не клиффхэнгер"
    check:
      code: "последний бит карточки — CLIFFHANGER длиной 5–10 с; у него есть тип обрыва из словаря каркаса"
      llm: "Последний кадр задаёт вопрос, а не отвечает? Зритель получил новую информацию или угрозу, а не просто оборванную фразу?"
      run:
        - {fn: beats, only: [cliffhanger]}
    severity: blocker
  - id: R03
    module: vertical_thriller
    text: "У серии есть цель героини в сцене и препятствие: «героиня хочет X, но Y» к 15-й секунде"
    check:
      code: "в карточке заполнены goal и obstacle, бит STAKES заканчивается не позже 15-й секунды"
      llm: "Понятно к 15-й секунде, чего героиня хочет в этой серии, что потеряет и кто давит?"
      run:
        - {fn: beats, only: [goal, stakes_late, new_info]}
    severity: blocker
  - id: R04
    module: vertical_thriller
    text: "В серии есть разворот на 180° (ловушка, улика меняет смысл, ход угрозы); при ≤60 с — ровно один; разворот читается без звука"
    check:
      code: "бит REVERSAL есть; при длительности ≤60 с он один; поле mute_readable отмечено"
      llm: "Если выключить звук, поворот остаётся? Разворот меняет картину, а не только громкость?"
      run:
        - {fn: beats, only: [reversal, reversal_double, mute]}
    severity: blocker
  - id: R05
    module: vertical_thriller
    text: "Диалог: реплика не длиннее {{metrics.max_line_words}} слов (больше {{metrics.hard_line_words}} — блок); экспозиция ≤2 реплик подряд без действия или угрозы (>4 — блок); 10 с диалога без смены положения — «говорящие головы»; монолог запрещён, голос за кадром ≤8 с (L08–L10)"
    check:
      code: "слова в реплике; подряд идущие реплики без смены сцены, звука или вставки дольше 10 с; голос за кадром дольше 8 с"
      llm: "Есть ли больше двух экспозиционных реплик подряд без действия или угрозы? Меняет ли каждая реплика баланс власти?"
      run:
        - {fn: script_metrics, only: [line_words]}
        - {fn: script_linter, only: [talking_heads, voiceover]}
    severity: major
  - id: R06
    module: vertical_thriller
    text: "Кадр 9:16: 1–2 лица, при >2 персонажах в сцене — пометка «в кадре»; говорящих в сцене и за серию не больше {{limits.max_speakers_per_scene}}; общий план ≤1 на серию и ≤3 с (L11–L13)"
    check:
      code: "сцены с faces > 2 без списка in_frame; говорящих за сцену и за серию; общих планов и их длительность"
      llm: "Ключевая деталь — в центральной трети кадра, не под интерфейсом плеера?"
      run:
        - {fn: script_linter, only: [faces, wide_shots, speakers_episode]}
        - {fn: script_metrics, only: [speakers]}
    severity: major
  - id: R07
    module: vertical_thriller
    text: "У каждого сюжетного звука есть визуальный дубль (смотрят без звука); звуковой удар — не больше одного на серию; резать на неразрешённом звуке"
    check:
      code: "звуковые блоки с plot: true без visual_double; блоков с hit: true больше одного"
      llm: "Если звук выключен, зритель всё равно видит удар, стук, голос за кадром?"
      run:
        - {fn: script_linter, only: [sound_double, sound_hits]}
    severity: blocker
  - id: R08
    module: vertical_thriller
    text: "Обрывы чередуются: тип — из словаря каркаса, одинаковых подряд не больше {{rhythm.max_same_hook_run}}, «ложное спасение» ≤1 на 6 серий; пэйволл = откровение + физическая угроза (L15, L16)"
    check:
      code: "hook_type из словаря; повтор типа; доля false_rescue"
      llm: "Обрыв серии барьера — откровение и физическая угроза одновременно, а не одно из двух? Типы обрывов на дистанции блока чередуются, «ложное спасение» не идёт дважды подряд?"
      run:
        - {fn: rhythm, only: [hook_repeat, hook_unknown]}
        - {fn: hook_quota, params: {type: false_rescue, per: 6, max: 1}}
    severity: major
  - id: R09
    module: vertical_thriller
    text: "Ствол и матрёшка: один вопрос сезона (≤12 слов) с ответом и заделом; вложенные вопросы Q1…Qn, n ≥ 5, масштаб строго растёт (кто → почему → сколько → кто стоит → что это значит для героини); закрыт Qn — в той же серии открыт Qn+1; активных подтайн ≤3"
    check:
      code: "trunk и nested в библии: число уровней, рост масштаба, цепочка закрыт→открыт, активные подтайны по сериям"
      llm: "Каждая подтайна закрывается в своей арке? Вопрос сезона можно произнести одной фразой?"
      run:
        - {fn: matryoshka, params: {min_levels: 5, max_active: 3, max_question_words: 12}}
    severity: blocker
  - id: R10
    module: vertical_thriller
    text: "Лор: не больше одного нового правила мира на серию и не больше пяти за сезон; правило даётся через нарушение и цену, не объяснением (L18)"
    check:
      code: "правила мира: произнесено ≤1 на серию, всего ≤5; у каждого — серия, где произнесено, и серия, где сработало"
      llm: "Правило показано нарушением и ценой, а не лекцией?"
      run:
        - {fn: world_rules, params: {min: 1, max: 5, max_per_episode: 1, require_episodes: true}}
    severity: major
  - id: R11
    module: vertical_thriller
    text: "Карта улик: на каждую разгадку ≥3 улики, хотя бы одна визуальная без комментария; на 2 поддерживающие — 1 противоречащая (рождает конкурирующие теории); выплата ≤15 серий после посадки (L19, L20)"
    check:
      code: "улики по вопросам: число, visual, contradicts, paid_ep − planted_ep"
      llm: "Из улик складываются хотя бы две конкурирующие теории?"
      run:
        - {fn: clues, params: {min: 3, payoff_within: 15}}
    severity: major
  - id: R12
    module: vertical_thriller
    text: "Драматическая ирония: угроза, показанная зрителю, не раскрывается героине в той же серии; есть «окно спасения» (зритель видит выход, героиня — нет); серий саспенса подряд не больше {{rhythm.max_suspense_run}}, затем серия сюрприза, иначе героиня выглядит глупой (L21)"
    check:
      code: "режим знания по сериям: threat_seen_by_viewer и threat_known_to_hero в одной серии; серий саспенса подряд"
      llm: "Угроза показана зрителю в серии N — в какой серии о ней узнаёт героиня? Если в той же N, иронии нет. Если позже — есть ли у зрителя «окно спасения», чтобы крикнуть «оглянись», и не выглядит ли героиня глупой, пока не знает?"
      run:
        - {fn: knowledge_mode, params: {max_suspense_run: "{{rhythm.max_suspense_run}}"}}
    severity: major
  - id: R13
    module: vertical_thriller
    text: "Пэйволл «В+У+Л» на серии барьера ({{anchors.paywall_hook}}-я): вопрос получает поворот (не ответ), угроза немедленная и личная, личная ставка — связь из серий 1–{{anchors.solution_collapse}}. Главная разгадка — в сериях {{anchors.paywall_answer}}; на барьере второй по силе твист, сильнейший — на перезагрузке или в финале"
    check:
      code: "в серии барьера question_turn, threat_to_heroine и personal_stake; опорные точки paywall_hook и paywall_answer; strongest_twist не на барьере"
      llm: "Вопрос барьера нельзя угадать из бесплатных серий? Серии после барьера дают то, чего не было бесплатно?"
      run:
        - {fn: paywall_hook, params: {anchor: paywall_hook, needs: [turn, threat, stake]}}
        - {fn: season_frame, only: [anchor.paywall_hook, anchor.paywall_answer]}
        - {fn: strongest_twist, params: {anchor: paywall_hook}}
    severity: blocker
  - id: R14
    module: vertical_thriller
    text: "«Золотые 3»: 1-я — хук-нарушение, уязвимость героини, необратимый инцидент, ≤2 персонажей, без предыстории и флэшбэка; 2-я — мгновенное продолжение, первое правило мира, первая улика; 3-я — первая цена, угроза направлена на героиню, намёк на масштаб. К концу 1-й вопрос сезона формулируется одной фразой"
    check:
      code: "в сериях 1–3 отмечено необратимое событие; в 1-й не больше 2 персонажей в кадре; в сценарии 1-й нет флэшбэка; опорные точки hook_violation, first_rule, first_cost"
      llm: "После 1-й серии угроза воспринимается всерьёз? В 1–3 нет «тихой» серии и объяснения мистики?"
      run:
        - {fn: golden_three, params: {irreversible_by: 3, max_cast_ep1: 2}}
        - {fn: season_frame, only: [anchor.hook_violation, anchor.first_rule, anchor.first_cost]}
        - {fn: script_linter, only: [flashback]}
    severity: blocker
  - id: R15
    module: vertical_thriller
    text: "Моно-линия: ствол и осколки. В-линия запрещена; второстепенный персонаж допустим, только если даёт улику стволу, создаёт угрозу героине или превращает союзника во врага; вставки 3–7 с с точки зрения угрозы — инструмент иронии, не линия"
    check:
      llm: "Каждая сцена работает на одну ось угрозы или тайны? Есть ли сцена, которая не двигает ствол, не угрожает и не меняет союзника?"
    severity: blocker
  - id: R16
    module: vertical_thriller
    text: "Перезагрузки (смена правил, ложный финал, жертва↔охотник, второе дно, смена пространства, смена регистра): не меньше одной на каждые 30 серий — на {{L}} серий это {{L/30}}; между ними и до финала не больше {{0.42*L}} серий (L27)"
    check:
      code: "опорные точки reset1 и false_finale; число перезагрузок от длины сезона; расстояние между перезагрузками"
      llm: "Каждая перезагрузка меняет правила, роли или дно, а не просто добавляет событие?"
      run:
        - {fn: resets, params: {anchors: [reset1, false_finale], min: "{{L/30}}", max_gap: "{{0.42*L}}"}}
        - {fn: season_frame, only: [anchor.reset1, anchor.false_finale]}
    severity: major
  - id: R17
    module: vertical_thriller
    text: "Финальная арка: −5 улики сводятся, −4 потеря союзника, −3 конфронтация с уликой из первой трети, −2 ложная или пиррова победа, −1 разрешение ствола + ровно один новый вопрос. Форма финала — Ответ, Инверсия или Дверь; самое старое обещание 1-й серии погашено кадром без закадрового голоса (L28)"
    check:
      code: "опорные точки финальной арки; в финале ровно один открытый вопрос (nested без closed_ep и trunk.next_question)"
      llm: "Финал гасит самое старое обещание 1-й серии кадром? Больше одного нового вопроса в финале — обман"
      run:
        - {fn: matryoshka, only: [finale_questions]}
        - {fn: season_frame, only: [anchor.clues_converge, anchor.ally_cost, anchor.confrontation, anchor.pyrrhic_victory, anchor.finale]}
    severity: major
  - id: R18
    module: vertical_thriller
    text: "У угрозы есть лицо или повторяющийся визуальный знак, показанный к {{anchors.threat_personal.max}}-й серии (когда угроза становится личной); лучшие угрозы — близкие (супруг, свекровь, сосед, двойник, телефон); гибрид «жанр + эмоциональное ядро» (L31)"
    check:
      code: "в библии threat с visual_sign и sign_shown_ep не позже опорной точки threat_personal"
      llm: "Угроза узнаётся по знаку без слов? Она близкая и дешёвая в кадре?"
      run:
        - {fn: threat_sign, params: {by_ep: "{{anchors.threat_personal.max}}"}}
    severity: major
  - id: R19
    module: vertical_thriller
    text: "Связка с прошлым обрывом: перехлёст ≤5 с (после барьера ≤3 с и ответ в первые 10 с); после физического обрыва — мгновенный результат; после откровения — реакция крупно ≤2 с; «ложный результат» ≤1 на арку (L32)"
    check:
      code: "в карточке link_prev; перехлёст в сценарии не длиннее 5 с (3 с после барьера)"
      llm: "Зритель из ленты, пришедший в середину, удержит связь с прошлой серией?"
      run:
        - {fn: beats, only: [link]}
        - {fn: script_linter, only: [overlap]}
    severity: major
  - id: R20
    module: vertical_thriller
    text: "Вертикальная композиция страха: верхняя треть — глаза героини и угроза сверху, нижняя — угроза снизу и субтитры, глубина — фигура в коридоре, передний план — дверная щель, UI-слой — телефон поверх лица. Ключевая деталь не у нижнего и правого края (зона интерфейса) (L29 INFO)"
    check:
      llm: "Ключевая деталь кадра не попадает под интерфейс плеера? Страх строится на вертикальной оси (верх/низ, щель, экран), а не на общем плане?"
    severity: minor
  - id: R21
    module: vertical_thriller
    text: "Компактность: не больше {{limits.max_locations}} локаций на сезон (идеал — {{limits.main_locations}} якорная), не больше {{limits.max_regular_characters}} ключевых персонажей, ≤2 локации на серию; сцены снимаются блоками по локациям"
    check:
      code: "checkLimits: постоянные персонажи и локации из библии"
      llm: "Каждая локация и каждый постоянный персонаж работают на ствол или угрозу? Есть ли сцена, которую можно снять в уже существующей локации, или персонаж, чью функцию выполнит другой?"
      run:
        - {fn: limits}
    severity: blocker
  - id: R26
    module: vertical_thriller
    text: "Встроенный конфликт: угроза есть уже в логлайне и премисе; «это могло случиться со мной» — угроза из знакомого пространства (квартира, офис, семейный ужин)"
    check:
      llm: "В логлайне названа угроза и то, чем она близка зрителю? Конфликт встроен в премису, а не ждёт завязки?"
    severity: blocker
# Общие правила C01–C04 — в rules/common.yaml; здесь то, что у триллера своё.
# Номер R22–R25 больше не используются: это были копии C01–C04.
common:
  C02:
    text: "Арка героини: «архетип + трещина + выбор». До перезагрузки №1 (серии {{anchors.reset1}}) — не меньше трёх поступков по Лжи героини с ценой, после — хотя бы один откат; развитие только через выбор под угрозой"
    check:
      code: "в плане серии с arc: lie до опорной точки reset1 — не меньше 3; после неё есть arc: relapse"
      llm: "Каждый шаг арки — выбор под угрозой, а не разговор?"
      run:
        - {fn: hero_arc, params: {anchor: reset1, min_lie_acts: 3, relapse: true}}
  C04:
    # Опорную точку hook_violation в 1-й серии уже проверяет код в R14 («Золотые 3»): здесь только судья, чтобы не было двойной находки.
    text: "Обещание жанра — в 1-й серии: нарушение нормы видно в кадре, зритель понимает, чего бояться"
    check:
      code: null
      llm: "Первая серия показывает то, за чем пришли: невозможный кадр и угрозу, которой стоит бояться весь сезон?"
      run: []
