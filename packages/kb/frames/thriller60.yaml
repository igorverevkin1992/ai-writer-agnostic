# Каркас сезона вертикального триллера: 60 серий, пэйволл — входной параметр (по умолчанию 10-я серия).
# Источник: исследование продюсера «Драматургия вертикального хоррора», разделы 2.2–2.7, 6.2.
# Опорные точки записаны через pw (серия барьера) и L (число серий): при другом барьере
# или другой длине сезона дуга 4–12 и перезагрузки пересчитываются сами.
season_frame:
  inputs:
    paywall: 10                   # 8–12 по исследованию; A/B-практика платформ — 9 или 12
  episodes: 60                    # 50–80 по исследованию
  free: paywall
  duration_s: {min: 60, max: 120, target: 90}
  anchors:
    hook_violation: 1             # хук-нарушение нормы, уязвимость героя, необратимый инцидент
    first_rule: 2                 # мгновенное продолжение, первое правило мира, первая улика
    first_cost: 3                 # первая цена, угроза направлена на героя, намёк на масштаб
    threat_personal: [4, 5]       # угроза персонализируется: антагонист знает то, чего не должен
    ally_suspect: [6, 7]          # союзник под подозрением
    false_solution: paywall-2     # ложная разгадка, зритель почти верит
    solution_collapse: paywall-1  # разгадка рушится, новая улика делает хуже
    paywall_hook: paywall         # «В+У+Л»: вопрос получает поворот + угроза самому близкому + личная ставка
    paywall_answer: paywall+1..paywall+2   # частичный ответ, вопрос уровнем выше
    reset1: 0.42*L..0.5*L         # перезагрузка №1 (≈45% длины): смена правил, второе дно
    false_finale: 0.77*L..0.83*L  # перезагрузка №2 / ложный финал (≈80%): победа рушится
    clues_converge: L-4           # улики сводятся в картину; сильнейший твист, если не потрачен
    ally_cost: L-3                # цена: потеря союзника
    confrontation: L-2            # конфронтация; герой использует улику из первой трети
    pyrrhic_victory: L-1          # ложная или пиррова победа
    finale: L                     # разрешение ствола + ровно один новый вопрос
  anchor_labels:
    hook_violation: Хук-нарушение и необратимый инцидент
    first_rule: Первое правило мира
    first_cost: Первая цена
    threat_personal: Угроза становится личной
    ally_suspect: Союзник под подозрением
    false_solution: Ложная разгадка
    solution_collapse: Разгадка рушится
    paywall_hook: Пэйволл «В+У+Л»
    paywall_answer: Выплата после барьера
    reset1: Перезагрузка 1
    false_finale: Ложный финал
    clues_converge: Улики сводятся
    ally_cost: Потеря союзника
    confrontation: Конфронтация
    pyrrhic_victory: Пиррова победа
    finale: Финал
  # Лестницы злодеев нет: вместо неё — ствол (вопрос сезона) и матрёшка вложенных вопросов (библия).
  rhythm:
    response_within: 3
    max_suffering_run: 3          # в саспенсе давление дольше, чем в мести
    max_same_hook_run: 2          # исследование: ≤2 одного типа подряд (три подряд — WARN)
    emotions_per_episode: [2, 3]
  # Типы обрывов — объединённый словарь двух исследований (семь типов хоррор-сетки + четыре архетипа Character.app).
  hook_types:
    ticking: Тикающая бомба
    attack: Нападение
    revelation: Откровение
    betrayal: Предательство
    mystical_shift: Мистический сдвиг
    false_rescue: Ложное спасение
    decision: Точка выбора
    return_of_thing: Возвращение детали
    unanswered_question: Неотвеченный вопрос
    visual_sting: Визуальный укол
  # Фазы сетки: «Золотые 3», эскалация до барьера, выплата, микро-арки, перезагрузка 1,
  # микро-арки (жертва становится охотником), ложный финал, предфинал и финал.
  blocks: [[1, 3], [4, paywall-1], [paywall, paywall+2], [paywall+3, 0.4*L], [0.4*L+1, 0.5*L], [0.5*L+1, 0.75*L], [0.75*L+1, 0.83*L], [0.83*L+1, L]]
  tolerance: 1
