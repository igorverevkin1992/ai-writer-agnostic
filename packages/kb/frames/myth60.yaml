# Каркас сезона фэнтези-мифа: 60 серий. Платный барьер после 10-й, ответ — в 11–12-й.
# Источник: исследование продюсера (октябрь 2026), разделы 1.3, 7.2, 7.4 и «Проверки».
# Каркас — общий для жанра: имена героев и чудовищ из «Дочери лешего» сюда не входят.
season_frame:
  episodes: 60
  free: 10
  duration_s: {min: 90, max: 120, target: 100}
  anchors:
    talisman: 1                  # талисман и вредительство: беда случилась, знак на двери
    ghost: [2, 5]                # призрак — рана героя по частям, осколки старой вины
    rules_recount: 5             # серия пересчитывает правила мира: срок и цена
    crossing: [6, 9]             # переход границы миров, даритель
    paywall_hook: 10             # откровение-вопрос: сталкивает два главных секрета
    paywall_answer: [11, 12]     # ответ на вопрос 10-й серии
    pinch1: 22                   # противники атакуют: напоминание о силе антагониста
    midpoint: 30                 # рана раскрыта целиком, цель меняется
    companion_cost: [31, 36]     # спутник платит цену
    pinch2: 37                   # власть мира наступает
    descent: [38, 48]            # нисхождение в подземный мир
    climax_rite: [49, 58]        # битва становится обрядом-испытанием
    public_revelation: [56, 58]  # публичное самооткровение, обличение
    redemption: [59, 60]         # искупление, новое равновесие
  anchor_labels:
    talisman: Талисман и беда
    ghost: Призрак (рана)
    rules_recount: Пересчёт правил
    crossing: Переход границы
    paywall_hook: Точка оплаты
    paywall_answer: Ответ после оплаты
    pinch1: Пинч 1
    midpoint: Мидпоинт
    companion_cost: Спутник платит цену
    pinch2: Пинч 2
    descent: Нисхождение в Навь
    climax_rite: Обряд-испытание
    public_revelation: Публичное откровение
    redemption: Искупление
  villains:
    count: 5
    # Ранг 5 — самый слабый; угроза растёт: внимание, имущество, правда, жизнь, душа.
    roles: {5: deceiver, 4: bargainer, 3: communal_guilt, 2: gatekeeper, 1: world_power}
    # «Череда чужаков»: каждый антагонист входит в своём блоке. Главного надо назвать к ответу на вопрос 10-й серии.
    boss_on_screen_by: 12        # утверждено продюсером 01.10.2026
    all_on_screen_by: 49
    on_screen_by: {5: 6, 4: 13, 3: 25, 2: 37, 1: 12}
    # Исследование задаёт блок каждого антагониста, а не серию победы: победить можно в любой серии блока.
    takedowns: {5: [6, 12], 4: [13, 24], 3: [25, 36], 2: [37, 48], 1: [49, 60]}
    counterstrike_within: 3
    max_turned_allies: 1
    turned_ally_ranks: [2, 3, 4] # страж или существо со сделкой может стать дарителем
    public_and_legal: []         # в сказочном мире нет суда и полиции
    varied_punishments: true     # каждое чудовище закрывается по-своему
    punishments: [defeated, bargain, laid_to_rest, turned_ally, flight, shame]
  rhythm:
    response_within: 3
    max_suffering_run: 3         # в нисхождении тьма гуще, чем в мести; утверждено продюсером 01.10.2026
    max_same_hook_run: 2
    emotions_per_episode: [2, 3]
  # Части, которыми пишется план: по кругу истории Хармона.
  blocks: [[1, 10], [11, 22], [23, 30], [31, 37], [38, 48], [49, 60]]
  tolerance: 1
