# Жанровые подсказки вертикального триллера, саспенса и хоррора: модели получают их вместе с правилами.
# Источник: исследования продюсера «Драматургия вертикального хоррора» (блоки 1–6) и «Архитектура микродрам»
# (октябрь 2026). Места, которые исследование помечает [ЭКСТРАПОЛЯЦИЯ], — гипотезы для калибровки.
stub: false
source: "Исследования продюсера, октябрь 2026"
sections:
  - title: Главное в жанре
    items:
      - "Вертикальный хоррор или триллер — не сжатое ТВ, а машина повторяющихся решений «смотреть дальше / платить». Оптимизируется вероятность перехода из серии N в N+1"
      - "Slow burn заменяется «нарушением нормы в кадре»: страх держится на крупном плане, вертикальной оси (верх/низ, дверная щель, экран телефона), драматической иронии и сюжетном звуке с визуальным дублем. Атмосферные общие планы не работают"
      - "Три критические зоны потерь: первые 3 секунды (~30% не кликают), серии 1–3 (>60% бросают), серия перед пэйволлом (>90% уходят при окне оплаты)"
      - "Хиты — гибриды: хоррор с эмоциональным ядром (семья, пара, месть) безопаснее «чистого» саспенса. Нужна плотность напряжения, а не твист каждые 15 секунд"
      - "Четыре работающих механизма: драматическая ирония и структура открытого ответа («я знаю, кто это сделал»), бытовой триллер и газлайтинг, психологический атмосферный хоррор в замкнутых локациях, хоррор на правилах (каждое правило и попытка его обойти — готовый каркас обрыва)"
  - title: Что забыть сценаристу ТВ и кино
    items:
      - "Разгон: если 1-й серии нужна предыстория — перестроить премису"
      - "Самостоятельные В/С-линии: каждая сцена работает на одну ось угрозы или тайны"
      - "Атмосферный общий план: в 9:16 он теряет детали"
      - "Пауза как основа саспенса: только ≤1–2 с и только если в ней что-то меняется"
      - "Объясняющий диалог: реплика двигает сюжет или вскрывает персонажа под давлением"
      - "Просмотр подряд и со звуком: зритель приходит из ленты в середину, смотрит без звука и на скорости до 2x"
      - "Разрешение в конце серии: оно даёт повод остановиться"
      - "«Один большой твист на сезон»: нужны десятки малых и несколько больших перезагрузок"
  - title: Экспозиция, персонаж, мир
    items:
      - "Экспозиция «3+10»: к 3-й секунде виден конфликт, к 13-й — кто чего хочет и что мешает. Факт нужен сейчас → UI-элемент или реплика под действием; нужен потом → визуальная улика без пояснения; не нужен — удалить"
      - "Персонаж — «архетип + трещина + выбор»: архетип читается за 3 с («медсестра ночной смены»), трещина — скрытая вина, ложь или провал памяти; развитие только через выбор под угрозой"
      - "Мир — «правило через нарушение»: записка «после 3:00 не открывать» → сосед открыл → утром его квартира пуста. ≤1 нового правила на серию, ≤5 за сезон"
      - "«Ствол и осколки»: ствол — один вопрос сезона («Кто убивает жильцов дома?»). Осколок (второстепенный персонаж) допустим, если даёт улику стволу, создаёт угрозу герою или превращает союзника во врага. Иначе сцена удаляется"
  - title: Саспенс без slow burn
    items:
      - "Длинная пауза → обрыв звука на 0,5–1,5 с перед ударом"
      - "Общий план дома → деталь-нарушение крупно: детская рука на стекле 10-го этажа"
      - "Медленный наезд → резкая смена крупности: средний → сверхкрупный глаз"
      - "Нарастание за 10 минут → три бита: звук → тень → контакт"
      - "Пустое пространство → вертикальная ось: что-то над героем или под ним"
      - "Двусмысленность → ирония: зритель видит угрозу раньше героя"
      - "«Сжатый страх»: страх рождается из нарушения нормы, которое зритель уже увидел, а герой — нет. Долгое нагнетание переносится на уровень сезона: серия — короткий удар, «гул» держит неразрешённая загадка ствола"
      - "Плотность: хук ≤3 с; мини-кульминация ~каждые 45 с; разворот 1 на 60 с, до 2 при 90–120 с; клиффхэнгер в 100% серий, кроме финала; хоррор-серия = 1 нарушение + 1 эскалация + 1 неразрешённый удар"
  - title: Сетка сезона (60 серий, пэйволл 10)
    items:
      - "1–3 «Золотые 3»: захват, премиса, первая цена — «Что происходит?»"
      - "4–9 Эскалация: рост ставок, ложная разгадка — «Кому верить?». 4–5 угроза персонализируется (антагонист знает о герое то, чего не должен), 6–7 союзник под подозрением, 8 ложная разгадка, 9 разгадка рушится, новая улика делает хуже"
      - "10 (±2) Пэйволл: максимальный вопрос + угроза — «Я обязана узнать». Формула «В+У+Л»: Вопрос получает поворот, а не ответ («Кто стучит?» → «Стучит умершая здесь — с моим лицом»); Угроза немедленная и личная, с таймером; Личная ставка — связь из серий 1–9 (ребёнок, сестра, партнёр)"
      - "11–12 Выплата: ответ + больший вопрос — «Всё хуже». Серии 11–15 обязаны быть максимально плотными: высокая цена в начале сокращает разблокировки сильнее, чем растущая"
      - "13–24 Микро-арки 2–3: расследование / выживание — «Как остановить?»"
      - "25–30 Перезагрузка №1: смена правил / второе дно — «Всё было ложью»"
      - "31–45 Микро-арки 4–5: жертва становится охотником — «Победит ли?»"
      - "46–50 Перезагрузка №2 / ложный финал: победа рушится — «Это не конец»"
      - "51–55 Предфинал: сведение улик, жертва союзника — «Какой ценой?»"
      - "56–60 Финал: разрешение ствола + задел — «Что дальше?». На 80 серий — третья перезагрузка около 65-й; на 40–50 — минус одна микро-арка, перезагрузка №2 сливается с ложным финалом"
  - title: Золотые 3
    items:
      - "1-я: обязательно хук-нарушение, уязвимость героя, необратимый инцидент; запрещены предыстория, флэшбэк, пейзаж, больше 2 персонажей. Пример: под ковром записка её почерком «Не открывай дверь в 3:07». В 3:07 стук. В глазке — она сама"
      - "2-я: мгновенное продолжение, первое правило мира, первая улика; запрещены объяснение мистики и «тихая» серия. Пример: сосед: «В 9Б никто не живёт с 2019-го». В телефоне 14 сообщений от неё самой"
      - "3-я: первая цена, угроза направлена на героя, намёк на масштаб; запрещена разгадка главной тайны. Пример: сосед мёртв, рядом её ключи. Сообщение: «Ты следующая. Или я?»"
      - "К концу 1-й серии вопрос сезона формулируется одной фразой — иначе переписать. В сериях 1–3 есть необратимое событие — иначе угроза не воспринимается всерьёз"
  - title: Микро-арки и матрёшка
    items:
      - "Микро-арка = 5–10 серий: вход (1) → расследование/выживание (2–5) → локальная кульминация (1) → переход-матрёшка (1)"
      - "Формула: закрыт Qn → в той же серии открыт Qn+1, масштаб(Qn+1) > масштаб(Qn). Шкала: кто? → почему? → сколько их? → кто стоит за этим? → что это значит для героя? Пример: «Кто убил соседа?» → «Почему убийца умер 5 лет назад?» → «Сколько жильцов — не те, кем кажутся?» → «Кто управляет домом?» → «Почему героиня жила здесь в 2019-м?»"
      - "Типы перезагрузок: смена правил («не открывать в 3:07» на деле призывает стучащего), ложный финал (убийца пойман на 46-й, в 48-й его почерк повторяется), жертва ↔ охотник (все убийства совершала она во сне), второе дно (помогавший муж — организатор семейного культа), смена пространства (подвал, которого нет в планах дома), смена регистра (рациональное расследование упирается в доказуемо сверхъестественное)"
      - "Финальная арка от конца: −5 улики сводятся в картину, сильнейший твист (если не потрачен); −4 цена — потеря союзника; −3 конфронтация, герой использует улику из первой трети; −2 ложная или пиррова победа; −1 разрешение ствола + один новый вопрос. Задел на спин-офф — через персонажа-«осколок» с собственной тайной"
  - title: Анатомия серии (90 с, масштабируется)
    items:
      - "0–3 с ХУК: нарушение нормы / действие / шок-реплика / продолжение клиффхэнгера. Проверка: стоп-кадр на 3-й секунде — нужна ли предыстория?"
      - "3–15 с СТАВКИ: цель героя в сцене + немедленная угроза. Проверка: «герой хочет X, но Y»"
      - "15–45 с ЭСКАЛАЦИЯ: улика, звук, второе присутствие, отказ союзника. Проверка: ≥1 новая информация или ухудшение"
      - "45–75 с РАЗВОРОТ: ловушка / улика меняет смысл / угроза делает ход. Проверка: читается без звука? Если нет — это громкость"
      - "Последние 5–10 с КЛИФФХЭНГЕР: угроза / откровение / мистический сдвиг / рухнувшая безопасность. Проверка: кадр задаёт вопрос, а не отвечает"
      - "Сначала пишется временной скелет (0:00, 0:32, 1:18, 1:50), потом диалог; клиффхэнгер — первым. Порядок генерации: клиффхэнгер → разворот, делающий его неизбежным → хук, связанный с прошлой серией → ставки и эскалация → режим знания → кадр и звук с дублями → диалог под таймкоды → линтер (при блоке перегенерировать бит)"
      - "Связка с прошлым обрывом: перехлёст (повтор последних 2–5 с; после пэйволла и для зрителя из ленты; >5 с съедает хук), мгновенный результат (старт с последствия; бинж-зоны 3–9, 13–24), ложный результат («это был сон» → через 5–10 с угроза сильнее; ≤1 раза на арку), смена точки зрения (тот же момент глазами угрозы; нужна маркировка). После пэйволла — перехлёст ≤3 с + ответ в первые 10 с; после физического обрыва — мгновенный результат; после откровения — реакция крупно ≤2 с, затем действие"
      - "Образец 90-секундной серии: 0:00–0:03 сверхкрупно монитор палаты — прямая линия, пациент сзади смотрит в камеру, писк обрывается в тишину; 0:03–0:15 героиня хватает телефон, UI «Не заходи в 412»; 0:15–0:30 коридор снизу, лампы мигают по вертикали, шаги; 0:30–0:45 палата пуста, на подушке её бейдж; 0:45–0:60 РАЗВОРОТ: UI камеры — она входила в 412 вчера в 03:12 и не помнит; 0:60–0:80 дверь закрывается сама, в стекле за спиной пациент, вдох у микрофона; 0:80–0:90 голос за кадром «Ты обещала не заходить», чёрный экран. Хук — нарушение нормы; разворот — видео опровергает память (газлайтинг + двойник); обрыв — мистический сдвиг + угроза за спиной"
  - title: Стартовые хуки (0–3 с)
    items:
      - "Визуальный шок (читается без звука за ≤1 с): из слива ванной выползает прядь чужих волос, героиня продолжает чистить зубы; в холодильнике её фото на документы с сегодняшней датой; умные часы: «Пульс: 0. Вы мертвы 04:12» — он бежит"
      - "Парадоксальная реплика: «Мама, а почему у тёти в шкафу твоё лицо?»; голосовое мужа: «Если ты это слушаешь — я тебя уже похоронил»; «Не оборачивайся. Он стоит ровно там, где ты его оставила»"
      - "In media res: героиня держит дверь, которую выбивают, телефон: «Вызов 911… линия занята»; героиня ныряет под машину — под соседней кто-то уже лежит и смотрит на неё; ноутбук: «00:00:47. Выберите, кто из близких умрёт»"
      - "Нарушение нормы (бытовой ужас): семья за ужином одновременно моргает, героиня — нет; соседский ребёнок называет героиню девичьей фамилией, которую не знает никто; робот-пылесос останавливается у закрытой спальни и стучит трижды"
      - "Визуальный хук читается без звука; хук-реплика дублируется субтитром и крупным планом; хук 1-й серии работает как самостоятельное 3-секундное промо"
  - title: Клиффхэнгеры
    items:
      - "Тикающая бомба (~20%): вода в подвале у подбородка, «Осталось 40 секунд»"
      - "Нападение (~15%): рука из-под кровати хватает за щиколотку"
      - "Откровение (~20%): выпускное фото 1998 года — «новый» муж того же возраста. Подтипы: появление нового лица перед кульминацией, переворот прошлого героя против него, «ядерный взрыв» — глобальная тайна через серию опасных сближений (ложные тревоги калибровать: любопытство, не гнев)"
      - "Предательство (~15%): подруга звонит: «Она у меня. Приезжайте»"
      - "Мистический сдвиг (~15%): выходит из квартиры — и входит в неё же; снова 3:07"
      - "Ложное спасение (~15%): полиция, выдох — водитель оборачивается: лицо из глазка. Не чаще одного на 6–8 серий"
      - "Точка выбора: рука замирает на полпути к ручке или красной кнопке; оба варианта видны в одном кадре, склейка посреди движения — зрители спорят в комментариях"
      - "Возвращение детали: крупный план рук с предметом из начала сезона (гроссбух, кольцо, телефон, записка из 2-й серии); нить заложена в первые 10 с этой серии"
      - "Неотвеченный вопрос: реплика требует ответа, серия держит паузу сверхкрупным планом лица; крупность соответствует масштабу поворота"
      - "Визуальный укол: один атмосферный кадр без новой информации (силуэт в глубине тёмного коридора)"
      - "≤2 одного типа подряд; пэйволл = откровение + физическая угроза; обрыв посреди фразы — не клиффхэнгер; резать на вопросе, «на две секунды раньше, чем кажется безопасным»; опасность, показанную зрителю, не разрешать в той же серии"
  - title: Драматическая ирония и асимметрия
    items:
      - "Саспенс — больше знает зритель (тревога, «крик в экран»); тайна — не знает никто (любопытство); сюрприз — знает персонаж в кадре (шок). 2–3 серии саспенса → 1 серия сюрприза, иначе герой выглядит глупым"
      - "Носители иронии в 9:16: фигура за спиной (верх/низ кадра, расфокус); экран телефона или монитора; отражение (зеркало, чёрный экран, стекло); вставка 3–7 с с точки зрения угрозы"
      - "Угроза, показанная зрителю, не раскрывается герою в той же серии. Нужно «окно спасения»: зритель видит выход, герой — нет (повод для комментариев «оглянись!»)"
      - "Пример: видеозвонок с мужем. В маленьком окне её видео за плечом стоит фигура. Муж замолкает и смотрит не на неё. Он видит — и молчит. Конец серии"
      - "Mystery box: одна центральная тайна + ≤3 активные подтайны, подтайна закрывается в своей арке; три улики на разгадку, хотя бы одна визуальная без комментария; на 2 поддерживающие — 1 противоречащая; повторяющийся символ (9Б, 3:07, красная нитка) работает без звука; вопрос для комментариев в конце каждой арки; выплата ≤15 серий после посадки"
  - title: Антагонисты и угрозы
    items:
      - "Газлайтинг — 2 лица в кадре, дёшево; риск затянутости. Изоляция — компактные локации, этажи, подвал, лифт; риск монотонности. Двойник — хук «моё лицо там, где меня нет»; риск логики правил. Техно-паранойя — UI как экспозиция; риск устаревания. Эти четыре — ★★★★★"
      - "Семейный культ — наследует тропы платформ (свадьба, наследство); риск ухода в мелодраму. Смертельная игра / правила — раунд = серия, таймеры; риск массовки. Призрак / проклятие — правила дают структуру; риск лора. ★★★★"
      - "Классический монстр — узнаваем, но эффекты и общие планы; апокалипсис с перерождением — фантазия всемогущества. ★★★"
      - "Лучшие угрозы — близкие (супруг, свекровь, сосед, двойник, телефон): помещаются в кадр, дёшевы, наследуют прибыльные тропы. Гибрид — стратегия по умолчанию. У угрозы должен быть повторяющийся визуальный признак"
  - title: Кадр 9:16, мизансцена и звук
    items:
      - "Норма: 1–2 лица, крупный/средний план. ≥3 персонажей — монтаж по одному/парами или «вертикальная группа» (лестница, ярусы). Общий план ≤1 на серию, ≤3 с. Говорящих ≤3 рекомендуемо, ≤4 жёстко. При >2 персонажах в сцене — пометка «[В КАДРЕ: Вера, Д.]» в каждом бите"
      - "Плохо: «Семья за столом. Свекровь объявляет, что в доме пятеро, хотя их четверо». Хорошо: «КРУПНО: свекровь улыбается. СВЕКРОВЬ: Нас пятеро. — КРУПНО: героиня считает глазами. — ДЕТАЛЬ: пять тарелок. — КРУПНО: свекровь смотрит на пустой стул рядом с героиней»"
      - "Вертикальная композиция страха: верхняя треть — глаза героя, угроза сверху (пролёт, потолок) [ВЕРХ КАДРА]; нижняя треть — угроза снизу (под кроватью, щель под дверью), зона субтитров [НИЗ КАДРА]; глубина — фигура в конце коридора [ФОН/РАСФОКУС]; передний план — дверная щель, жалюзи [ПЕРЕДНИЙ ПЛАН]; UI-слой — телефон поверх лица, видеозвонок, камера [UI]"
      - "Приёмы: «этажом выше» (рука на перилах вверху); «под кроватью» (кадр разделён полом); «дверная щель» (по очереди глаз героя и глаз угрозы); «экран поверх лица»; «лифт/шахта»; «ростовая фигура» (голова за верхним краем); «чёрный экран» (отражение за плечом). Интерфейс плеера перекрывает края: ключевую деталь не ставить у нижнего и правого края, лица и текст — в центральной трети"
      - "Диалоги: реплика ≤12–15 слов (жёстко 20); реплик в 90-секундной серии ≤10–12; монолог запрещён, голос за кадром ≤8 с; экспозиция подряд ≤2 реплик без действия или угрозы; субтитры обязательны. Реплику, объясняющую видимое, заменить визуалом; 10 с диалога без смены положения, угрозы или информации — «говорящие головы»; имя, дата, правило мира дублируются визуально"
      - "Экспозиция в UI и предметах: мессенджер («Ты опять не спишь? Я вижу свет» — от «Мама †»); камера/домофон (тайм-код 03:07); записка («Правило 3: если назовёт по имени — не отвечай»); заголовок («Семья из 9Б пропала, 2019»); протокол («Время смерти 02:40», звонок от него — в 02:55)"
      - "Аудио-триггеры с визуальным дублем: резкая тишина [ЗВУК: ОБРЫВ В ТИШИНУ] → замирание; стук/шаги [ЗВУК: 3 СТУКА, ПАУЗА, 1] → дрожь двери, рябь в стакане; голос за кадром [ГЗК: Д., шёпот] → субтитр другим стилем; искажение [ЗВУК: голос замедляется] → глитч, мигание света; дыхание у микрофона [ЗВУК: вдох вплотную] → запотевшее стекло; уведомление [ЗВУК: уведомление] → UI-оверлей; звуковой мотив [МОТИВ: колыбельная, 2 ноты] → связанный предмет"
      - "≥1 сюжетный аудио-бит на серию; звуковой удар ≤1 на серию; резать на неразрешённом звуке с чёрным экраном; сводить под динамик телефона — внятная середина и тишина надёжнее суббаса"
  - title: Стресс-тест концепта
    items:
      - "Десять критериев по 0–2: встроенный конфликт (угроза в логлайне); хук в 3 с (≥1 «невозможный» кадр без звука); центральный вопрос ≤12 слов; близость угрозы (лицо или знак); ёмкость (≥5 уровней матрёшки); перезагрузки (≥2 способа сменить правила/роли/дно); эмоциональное ядро (отношенческая ставка); компактность (≤5 локаций, ≤6 персонажей); пэйволл-момент («В+У+Л» на 8–12); обсуждаемость (≥2 конкурирующие теории)"
      - "≥16 — запуск, 12–15 — доработка, <12 — отказ. Ноль по встроенному конфликту, хуку, центральному вопросу или пэйволл-моменту — отказ независимо от суммы"
      - "Входные параметры генерации: длина сезона 50–80 (60), длительность серии 60–120 с (90), серия пэйволла 8–12 (10), монетизация (IAP / реклама / гибрид), основной жанр (хоррор / мистика / триллер / психологический саспенс / выживание / детектив), гибрид (романтика / месть / семья / нет), архетип угрозы"
