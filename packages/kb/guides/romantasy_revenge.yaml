# Жанровые подсказки ромэнтэзи с реваншем: модели получают их вместе с правилами.
# Источник: исследование продюсера (30.09.2026), части 2–7 и YAML-модуль (libraries, antipatterns).
stub: false
source: "Исследование «Ромэнтэзи с реваншем и наказанием подлеца», 30.09.2026"
sections:
  - title: Главное в жанре
    items:
      - "Главный жанр — месть, любовь — сильный второй двигатель, но не спаситель"
      - "Одна рана — две линии: предательство научило её Лжи «никому нельзя доверять»; месть подкрепляет Ложь, любовь её разрушает. Внешний выбор: «использовать его или поверить ему»"
      - "Сила даёт знание, закон даёт наказание: магия никогда не наказывает сама"
      - "Серии 1–8 продают подписку: в них униженная героиня, первая победа, искра силы, опасная любовь, в 8-й — почти-поцелуй, частичное раскрытие природы героя и угроза"
  - title: Героиня
    items:
      - "Архетипы: Золушка рода, отвергнутая невеста, вернувшаяся, подкидыш-наследница"
      - "Уэйланд: Призрак (мать погибла «при пожаре», дар рода «ушёл») → Ложь («я никто, любовь — сделка») → Желание (вернуть имя и наследство, наказать предателей) → Потребность (принять силу как свою и позволить себя любить)"
      - "Пять ступеней пробуждения: искра (1–2) → проба (3–10) → цена (11–22) → владение (23–37) → потеря (45–47) → полная сила через Потребность (50–60)"
      - "Лестница статуса: служанка → замечена → нужна → уважаема → опасна → хозяйка рода. Ступень силы открывает ступень статуса"
      - "Любят: быстрый ответ с достоинством; герой — первый свидетель её силы; ревность, которая кончается её публичным выбором. Раздражает: героиня-жертва дольше 2 серий; спаситель; токсичный герой без искупления"
  - title: Любовный интерес
    items:
      - "Формула: тёмный снаружи, честный с ней. Вся его тьма направлена на злодеев и остаётся законной"
      - "Опасный, а не токсичный: опасен для мира, бережен с ней; контролирует свою силу, а не её; скрывает тайну ради защиты и платит за это; ревнует и признаёт это; просит разрешения; меняется к финалу"
      - "Архетипы: наследник древнего рода (его семья виновна в гибели её матери), проклятый (проклятие убьёт его, если он полюбит), старший волчьего рода, кровный договор (навий), бывший враг"
      - "Сильный, но не спаситель: правило мира запрещает ему бить своих; у него своя цель; он даёт инструмент, а не результат; в больших битвах связан или опаздывает; его большой жест — жертва статусом"
      - "Его вклад в победы — знание, допуск, укрытие, свидетельство, жертва. Ни одну из пяти побед он не выигрывает"
  - title: Любовная линия по битам (Хейз, Труби)
    items:
      - "Знакомство 1–2; «ни за что» № 1 — 3; сцепка-сделка 5–6; «первый танец» (дуэль слов) — 7; почти-поцелуй — 8"
      - "«Ни за что» № 2 — 10–11; желание растёт 12–18; первый поцелуй 20–21; удар по доверию (пинч 1) — 22"
      - "«Может, получится» 24–28; идеальный момент + страшное открытие — 30; сомнение 32–34; он «выбирает род» (пинч 2) — 37"
      - "Щиты подняты 40–44; разрыв 45–47; тёмная ночь 48; пробуждение 49–51; большой жест 55–57; воссоединение 59–60"
      - "Ритм: три вкуса — кайф мести, кайф любви, страдание. Не больше 2 серий страдания подряд, не больше 3 серий без каждого кайфа. Исключение — падение, но и там в каждой серии нужна искра"
  - title: Реванш и наказание подлеца
    items:
      - "Пощёчины: правда при свидетелях; документ; переворот статуса; отказ тому, кто отверг; оружие злодея против него; выбор героя; вход в родовом знаке"
      - "Соперница нужна — это и ревность, и злодей. Рядом обязательно союзница"
      - "Законные наказания по силе кайфа: разоблачение перед своим кругом; потеря наследства или места в роду через суд; разрыв помолвки на её условиях; потеря бизнеса после проверки; задержание по доказательствам; «проклятие вернулось» по правилу мира — только если это не самосуд"
      - "Физическая расправа — запрет"
      - "Лестница злодеев: пешка (горничная-сплетница, шпионит) — 3; исполнитель (невеста героя по договору, ревность) — 18–20; страж (начальник безопасности рода, хранит тайну семьи героя) — 38–40; правая рука (бывший жених, соперник героя) — 48–50; босс (мать или отец героя, любовь против мести) — 57–59"
      - "Сильнее всего работает босс из семьи героя: тогда пинч 2 и большой жест рождаются сами"
      - "Финал: в «битве историй» героиня предъявляет правду, герой свидетельствует против своей крови, босс уходит под закон. Потом тихая сцена — обручение по обычаю рода. Одна нить — на второй сезон"
  - title: Одно чудо
    items:
      - "Три правила: кто (дар по женской линии, просыпается от предательства крови), что (одно действие: слышать ложь, видеть клятвы), цена (холод, седина, память)"
      - "Почему она? — родовой знак, портрет прабабки. Почему никто не видит? — видят только посвящённые, род хранит тайну. Почему не всегда? — растущая цена, лимит"
      - "Почему суд не верит магии? — нужна улика, это правило сюжета. Почему он не решит сам? — клятва рода. Почему она не уходит к нему? — он из рода врагов, её Ложь"
      - "Перерождение — это второе чудо, не смешивать"
  - title: Российская адаптация
    items:
      - "Альфа, Луна, стая звучат как перевод: старший рода, хозяйка рода, род. Истинная пара — суженый, «обручённые кровью». Отказ пары — разрыв обручения при всех. Вампир — кровный договор, навий. Миллиардер — наследник древней семьи"
      - "Главная возможность — славянская тёмная мистика: Морана и Мара, Морок, берегини, обереги, кощеево проклятие, навьи. Лучшая база чуда — древний род и тайная кровь"
      - "Без церковных таинств, ритуалов «по шагам», сатанинской символики. 16+ через затемнение, насилие через последствия, полиция и суд приходят по доказательствам героини, самосуда нет"
  - title: Производство без графики
    items:
      - "Глаза героя — линзы и контровой свет; вампир — съёмные клыки и бледный грим; оборотень — когти из латекса, шрамы, рык, тень, превращение за кадром"
      - "Сила героини — мигающий свет, бутафорское стекло, вентилятор; цена силы — седая прядь, бутафорская кровь, иней; знак рода — УФ-грим и УФ-свет. Драконов, полётов и лучей не показывать"
      - "Показывать силу без графики: реакция вместо действия, последствие вместо процесса, звук, резкая смена света, короткий рапид"
      - "Любовь в вертикали: два профиля в одном кадре; взгляд на губы; крупно запястье и шея; затемнение"
      - "Локация — родовой отель-усадьба: холл с гербом, кабинет босса, архив, зимний сад, номер героя, закрытая комната матери, кухня, подвал"
  - title: Библиотеки приёмов
    items:
      - "Пробуждение силы: гаснут лампы, теплеет медальон, трескается стекло, ложь звенит, видны клятвы"
      - "Любовные крючки: вспыхнули глаза, взгляд на губы, он с другой, знает невозможное, «моя» при всех"
      - "Реплики-удары: «Ты отверг меня. Теперь я отвергаю тебя.» «Этот дом помнит мою мать.» «Ложь звенит. Ты звенишь.» «Я не прошу защиты. Я прошу правды.»"
  - title: Антипаттерны
    items:
      - "Жертва дольше 2 серий; спаситель побеждает за неё; токсичный герой без искупления"
      - "Второе чудо; превращение в кадре; графика вместо практических эффектов"
      - "Самосуд; полиция — злодей; ритуалы «по шагам»; нет союзницы"
hole_questions:
  "1":
    - "Почему сила работает не всегда? Какая у неё цена и лимит?"
    - "Почему суд не верит магии и какая нужна улика?"
    - "Почему злодей не убирает её сразу, если знает о её силе?"
  "2":
    - "Почему никто не видит магию и знаки рода?"
  "3":
    - "Почему герой не решит всё сам? Что ему запрещает?"
    - "Почему она не уходит к нему?"
    - "Почему полиция не вмешалась раньше?"
