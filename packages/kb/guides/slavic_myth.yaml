# Жанровые подсказки фэнтези-мифа: модели получают их вместе с правилами.
# Источник: исследование продюсера «Пакет „Фэнтези-миф“», октябрь 2026, части 1–7.
# Подсказки общие для жанра: имён героев конкретного сериала здесь нет.
stub: false
source: "Исследование «Пакет „Фэнтези-миф“ для ИИ-агента вертикальных сериалов», октябрь 2026"
sections:
  - title: Главное в жанре
    items:
      - "Успех даёт не картинка, а связка «одна рана — одна цель — лестница чудовищ, где каждое даёт подсказку и берёт цену»"
      - "Миф (Труби) — путешествие, чтобы понять себя. Формула: «Ищи бессмертия, находя своё предназначение в этой жизни». Фэнтези — найти магию в мире и в себе"
      - "Главный вопрос: «Кем ты станешь, если пройдёшь иной мир и заплатишь его цену?». Тема — предназначение через понимание себя, в нашем жанре — искупление"
      - "Биты второго жанра берём, только если они работают на главный"
      - "Финал-искупление спорит с битом «жестокая битва». Бит не выбрасываем, а выкручиваем: битва становится обрядом-испытанием, где герой сражается за право сказать правду"
      - "Эмоциональное ядро — защитник. Линия «отец спасает дочь» — свежий угол: на Западе ядро фэнтези — романтика, хитов про отца нет"
  - title: Биты мифа и фэнтези (Труби)
    items:
      - "16 битов мифа: мир — природа в двух культурах; призрак — трудное рождение и потеря отца; «великая цепь бытия» от людей до духов; архетипы; герой-искатель; слабость-потребность; талисман как побуждающее событие; желание — путь и предназначение; союзники; противник — череда чужаков; символические предметы; откровение — противники атакуют; врата, коридор испытаний, визит в подземный мир; жестокая битва; публичное или космическое самооткровение; новое равновесие — «перерасти кодекс»"
      - "11 битов фэнтези: мир истории; герой-исследователь; желание исследовать иной мир; фантастические персонажи; противник — власти; план; проходы между мирами; путь через под-миры; сверх-волшебный момент; битва — последнее испытание; самооткровение «свободный и радостный»"
      - "Сжать: мир двух культур — до одного кадра границы; талисман — до одного крупного плана; архетипы — до одной функции на каждого"
      - "Выкинуть: «великую цепь бытия» как рассказ; длинный «план»; битву как хореографию — ИИ плохо делает драки"
      - "Растянуть на сезон: рану — по частям, целиком на мидпоинте; «череду чужаков» — на пять антагонистов; символические предметы — на подсказки; нисхождение — на серии 38–48"
  - title: Карта сезона (круг истории Хармона)
    items:
      - "Ты, 1–2: мир и искатель; беда в 1-й серии, знак-талисман, голос или след из иного мира"
      - "Нужда, 2–5: призрак, обрывки старой вины; община молчит или лжёт; в 5-й — пересчёт правил: срок и цена («за три луны она забудет тебя»)"
      - "Уход, 6–10: переход границы, даритель, первый антагонист. 10-я — умирающее чудище бросает откровение-вопрос («Ты убил его сына» — «Чьего сына?»)"
      - "Поиск, 11–22: ответ на вопрос 10-й в 11–12-й; второй антагонист; цена растёт. Пинч 22: противники атакуют, близкий забывает героя"
      - "Находка, 23–30: третий антагонист, символические предметы, «община знала». Мидпоинт 30 — сверх-волшебный момент и полная правда о ране; цель меняется на искупление"
      - "Расплата, 31–37: спутник платит цену, потеря дара. Пинч 37: власть мира наступает, лес у порога"
      - "Возвращение, 38–55: четвёртый антагонист, нисхождение в Навь (38–48), затем обряд вместо битвы"
      - "Перемена, 56–60: обличение и публичное самооткровение (56–58), община кается и платит, искупление и новое равновесие (59–60)"
  - title: Пропп («Морфология сказки», 31 функция)
    items:
      - "Порядок функций постоянен — он даёт порядок событий. Схему использовать можно, тексты Проппа охраняются"
      - "I–III (отлучка, запрет, нарушение) и VIII (вредительство) — серии 1–2; IV–VII (выведывание, выдача) — флешбэками 2–5; IX–XI (беда сообщена, герой соглашается, уходит) — 3–6"
      - "XII–XIV (даритель, волшебное средство) — 6–12; XV (перемещение) — 10–12; XVI–XVIII (борьба, клеймо, победа) — 13–36; XIX (беда ликвидирована) частично — 30"
      - "XX–XXII (возвращение, погоня, спасение) — 37–48; XXIII–XXIV (неузнанное прибытие, ложный герой) — 41–50; XXV–XXVI (трудная задача) — 49–56; XXVII–XXVIII (узнавание, обличение) — 56–58; XXIX–XXXI — 59–60"
      - "Сказка выросла из обряда посвящения: лес — вход в царство мёртвых, Яга — страж. Закон мира — через пару «запрет — нарушение»"
  - title: Лестница чудовищ
    items:
      - "Пять антагонистов, по 10–12 серий на каждого: обман (внимание) → сделка (долг, имущество) → вина общины (правда) → страж Нави (жизнь) → власть мира (душа)"
      - "Один из вариантов: кикимора — обман, 6–12, подсказка-след; водяной — сделка, 13–24, имя; навьи — вина общины, 25–36, «деревня знала»; Баба Яга — страж Нави, 37–48, путь к главному; леший — 49–60, искупление. Это пример, а не обязательный набор"
      - "«Монстр недели» и сквозная линия: чудовище закрывается за блок, но подсказка и цена переходят в сквозной сюжет"
      - "У каждого чудовища своя форма, цвет и звук: однообразие — признак ИИ-слопа"
      - "Чудовище побеждают его же законом: слабость, договор, оберег, запрет. Не силой героя"
  - title: Мир, магия, цена
    items:
      - "Каждая магия имеет цену в кадре. Закон мира показывать через нарушение. В 5-й серии пересчитать правила"
      - "Зрители прощают нестыковки ради зрелища, но «сила без усилий» вызывает критику: каждый рост силы оплачен"
      - "Реквизит с ясным происхождением делает больше, чем две строки экспозиции"
      - "Обряды как механики: Купала — ночь, когда открыта граница леса; Святки — маска, чтобы пройти незамеченным; Деды — мёртвые за столом, сцена публичного откровения; Русальная неделя — запрет"
      - "Обереги (соль, полынь, железо) — ресурс с ценой: кончаются, ломаются, трескаются"
  - title: Банк славянского фольклора
    items:
      - "Источники свободны: Афанасьев, Даль, Максимов, Зеленин, Гоголь. Комментарии изданий могут охраняться. Сверять с первоисточником; былички живее сказок"
      - "Леший — лес; путает дорогу, не терпит свиста; спасает вывернутая одежда, хлеб-соль; грех — вторжение в чужое. Затасканность средняя"
      - "Кикимора — болото, дом; путает ночью; оберег, порядок; тайный обман. Низкая"
      - "Водяной — омут; требует жертвы; откуп; долг. Средняя"
      - "Русалка — вода, рожь; щекочет в Русальную неделю; полынь; неоплаканная смерть. Высокая"
      - "Упырь — могила; пьёт кровь; осиновый кол; неупокоенная вина. Высокая"
      - "Навьи — мир мёртвых; приходят в поминальные дни; поминки; забвение предков. Низкая"
      - "Баба Яга — граница миров; испытывает гостя; «накорми, напои, спать уложи»; смерть, переход. Очень высокая — только с поворотом"
      - "Кощей — иное царство; смерть спрятана; найти смерть; нежелание отпустить. Высокая"
      - "Полудница — поле в полдень; карает за работу в полдень; укрыться; нарушение меры. Низкая"
      - "Банник — баня; нельзя мыться «в четвёртый пар»; оставить воду; нарушение порядка. Низкая"
      - "Анчутка — мелкий бес; пакостит; не поминать; сквернословие. Низкая"
      - "Вий — во многом образ Гоголя; убивает взглядом; не смотреть; страх разоблачения. Высокая"
      - "Домовой — дом; мстит за неуважение; угощать; разрыв с родом. Средняя"
      - "Оборотень — лес; превращение через нож; вернуть шкуру; скрытая вина. Средняя. Превращение — то, что ИИ-видео делает лучше всего"
      - "Лихо Одноглазое — глухой лес; прилипает к человеку; хитрость; беда, позванная самим. Средняя"
  - title: Спутники и арка героя
    items:
      - "Одна функция на спутника: проводник, совесть или трикстер. Постоянный спутник-проводник обязателен"
      - "Арки по Вейланд: у героя положительная (Ложь «чудовище — чужой» → Истина «чудовищем был я»), у проводника плоская — он уже знает Истину и меняет мир"
      - "Ложь — до 30-й серии, Истина — после. Мидпоинт — «Момент Истины», пинчи 22 и 37 — напоминание о силе антагониста"
  - title: Карта серии (90–120 секунд)
    items:
      - "0–3 с — образ, «точка взрыва»: мир, ставка, образ. 3–15 с — ответ на вчерашний вопрос и новая проблема"
      - "15–45 с — эскалация, новый стимул каждые 10–15 секунд. 45–60 с — мини-поворот. 60–80 с — цена или решение. 80–120 с — обрыв на вопросе"
      - "Резать на две секунды раньше, чем безопасно. Зритель решает за первые 3 серии, примерно за 4 минуты"
      - "Четыре формы обрыва: откровение, разворот, дедлайн, вторжение. Обрыв 10-й серии спрашивает, а не отвечает"
  - title: Крючки (22)
    items:
      - "Глаза в темноте; детский голос из леса; след лапы-корня; свеча гаснет сама; чужое лицо в ведре; говорящий ворон; кровь на снегу; открытая пустая дверь; игрушка в чаще; туман против ветра; птицы смолкают"
      - "Чужая кровь на руках; песня дочери; огонь меняет цвет; деревья смыкаются; лицо в окне без отражения; ответ одним словом; старуха знает имя; шёпот «Ты должен»; трещина на обереге; красная луна; звон несуществующего колокола"
  - title: Клиффхэнгеры (22)
    items:
      - "Откровение; союзник-враг; дедлайн «до рассвета»; чудовище у порога; рука покрывается корой; герой теряет голос; нарушен закон леса; найден свидетель; новое чудовище; дочь не узнаёт отца; ложная подсказка"
      - "Спутник исчезает; оберег не работает; «Ты уже был здесь»; гибель спутника; открыты двери Нави; чудовище смотрит в камеру; деревня горит; голос с двух сторон; выбор «дочь или деревня»; тень живёт сама; «Смерть твоя — в лесу»"
  - title: Писать, чтобы ИИ снял
    items:
      - "ИИ хорошо делает общие планы, драконов, русалок, превращения, костюмы. Плохо — лица в движении, слёзы, долгие крупные планы, диалоги вдвоём, микромимику, непрерывность между сериями, драки и толпы"
      - "Серию собирают из десятка клипов по 5–12 секунд: описывать кадр, а не «сцену». Писать с точностью оператора, камеру — словами: «медленный наезд», «облёт»"
      - "Не больше 3 человеческих лиц в кадре; у чудовищ нет человеческих лиц. Лицо крупно — не дольше 3–5 секунд. Диалог — через закадровый голос, силуэт, руки"
      - "Драка — «удар, вспышка, последствие». Толпа — огни в окнах, тени, голоса. Ночь, туман, вода, огонь и дым прячут артефакты"
      - "У каждого героя неизменный визуальный якорь: шрам, амулет, цвет плаща. Никаких надписей в кадре. Никаких реальных лиц"
      - "Последнюю реплику серии проверяет человек: ИИ-голос слабо подаёт обрыв. Это шаг продюсера после сценария"
  - title: Границы
    items:
      - "Идея охотника на чудовищ не охраняется, а «Ведьмак» — товарный знак и книги Сапковского. Не брать: «ведьмак» как профессия, школы, мутации, белые волосы и кошачьи глаза, медальон с волчьей головой, боевые знаки, два меча, «Право Неожиданности», мотив «отдай то, чего дома не знаешь». Визуальный якорь чудовища — из Афанасьева, Даля, Максимова, Зеленина, не из игр и сериалов: леший — старик навыворот, без коры и ветвей"
      - "Опасная зона — «охотник ищет чужую девочку» (Геральт — Цири). Решение: герой — родной и виноватый отец"
      - "Нет узнаваемых современных армии и спецслужб; священник не злодей; ребёнок не страдает в кадре; семья и отцовство в центре"
      - "Для госфондов: «популяризация образов русского фольклора», «ценность семьи и отцовства», «ответственность и искупление»"
  - title: Уроки разбора «Трёх лун»
    items:
      - "Чудовище не убивается: его отгоняют огнём, откупаются, хоронят, проходят испытание. Единственное убийство в истории — грех героя"
      - "Люди в кадре не гибнут от рук героев: падают в воду, расступаются, их обходят дымом"
      - "Беда на земле — от вины людей, а не от войны и не от власти. Если войско есть, оно побеждает и отпущено с честью; князя нет ни в кадре, ни в репликах"
      - "Праздники и обряды сверять с веком: «Покров» позже XI–XII века. Не употреблять «капище», «старые боги», «красный угол с иконами»: вера не показывается и не обсуждается"
      - "Нейросети блокируют кровь и слова «убить», «рана», но пропускают сражения и бой с чудовищами. Промпты — киноязыком: «широкий план, строй щитов, пыль, воин падает»"
      - "Рисованный стиль держит одно лицо 60 серий легче фотореализма и мягче проходит фильтры на детей и бои"
      - "Слова для заявки в госфонд: «убил ребёнка» → «нарушил закон леса и должен искупить вину»; «старые боги, капище» → «народные поверья, обряды поминовения предков»; «тёмное фэнтези» → «сказочная драма»"
  - title: Эталоны рынка
    items:
      - "«Под Плахой бессмертных я потряс богов» (Douyin, больше 1 млрд, ИИ): миф, герой против богов, 12 человек за 30 дней"
      - "«Странное зеркало гор и морей» (Kuaishou, больше 50 млн, ИИ): чудовища из древнего мифа с первого кадра; критика — застывшие лица"
      - "Fated to My Forbidden Alpha (ReelShort, 100–217 млн): искренность сильнее высмеянных CGI-волков"
      - "Black Book (Morteshka): подлинный фольклор из быличек, больше 100 тыс. копий за три недели, студия из пяти человек"
      - "«Финист. Первый богатырь» (2,7 млрд рублей): сказка из собрания Афанасьева"
  - title: Антипаттерны
    items:
      - "ИИ-слоп: однообразные чудовища, застывшие лица, сюжеты, сошедшиеся к одному шаблону"
      - "«Мягкий» бесплатный блок без эскалации; обрыв 10-й серии, который отвечает, а не спрашивает"
      - "Сила без усилий; магия без цены; закон мира, объяснённый лекцией"
      - "Драка-хореография; толпа; длинный диалог крупным планом; надписи в кадре; лица, похожие на реальных людей"
      - "«Ведьмак»; охотник ищет чужую девочку; священник-злодей; страдающий ребёнок в кадре"
hole_questions:
  "1":
    - "Почему магия работает именно сейчас? Какая у неё цена и где эта цена в кадре?"
    - "Откуда закон этого существа — из фольклора или придуман под удобство сюжета?"
    - "Почему чудовище не убивает героя сразу, если может?"
  "2":
    - "Почему община не видит, что творится в лесу, и почему молчит?"
  "3":
    - "Почему спутник-проводник не делает всё сам, если знает дорогу?"
    - "Почему герой не ищет помощи у общины или дарителя раньше?"
  "6":
    - "Кто в общине знал о ране героя с самого начала и почему молчал?"
