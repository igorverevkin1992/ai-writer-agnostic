# Шесть персон зрителей вертикального триллера и хоррора для аудита.
# Основа: исследования продюсера (аудитория 18–44, ядро 25–34, рост Gen Z; теории в комментариях;
# повторные просмотры ради улик; просмотр из ленты без звука и на скорости 2x).
# Шестая персона — следователь: правовая и медицинская достоверность (аудит 17.10.2026). Отдельный
# проход «юрист/следователь/врач» в аудиторе может дополнить её, но персона остаётся одна.
# Номер серии барьера — {{inputs.paywall}} из каркаса, не константа.
stub: false
personas:
  - {id: theory_hunter, name: Охотник за теориями, age: 22, focus: "Пишет теории в комментариях: хватает ли улик на две конкурирующие версии, не обманули ли его ложной тревогой, не угадывается ли разгадка"}
  - {id: rewatcher, name: Пересматривающая улики, age: 29, focus: "Возвращается к ранним сериям искать пропущенные подсказки: посажены ли улики заранее, сходится ли таймлайн, не появилось ли правило из ниоткуда"}
  - {id: feed_scroller, name: Зритель из ленты, age: 34, focus: "Пришёл в середину сезона, смотрит без звука на скорости 2x: понятен ли хук на 3-й секунде, читается ли разворот без звука, видна ли угроза в кадре"}
  - {id: horror_fan, name: Фанат хоррора, age: 19, focus: "Нарушение нормы, звук, вертикальная ось страха; узнаёт штампы и дешёвые скримеры; не прощает ложного спасения дважды"}
  - {id: platform_editor, name: Редактор площадки, age: 38, focus: "Барьер оплаты: ставит ли {{inputs.paywall}}-я серия вопрос, за который заплатят; досмотр первых трёх; рейтинг {{age_rating}}, насилие, культы, самоубийства"}
  - {id: investigator, name: Следователь на пенсии, age: 52, focus: "Правовая и медицинская достоверность: так ли работают полиция, следствие, экспертиза, больница и морг; реальны ли сроки, процедуры, документы, симптомы и действие лекарств; не делают ли силовиков и врачей глупыми или продажными ради сюжета; нет ли в кадре рабочей инструкции (яд, взлом, слежка)"}
