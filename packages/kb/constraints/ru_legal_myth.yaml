# Правовые рамки фэнтези-мифа. Источник: исследование продюсера (октябрь 2026), часть 6.
# В исследовании статьи названы по памяти и не сверены: нужен юрист. Это не юридическое заключение.
# Возрастной рейтинг в исследовании не назван: 16+ — предложение Claude Code, ждёт решения продюсера.
# Словарь маркеров — заготовка, юрист дополняет.
age_rating: "16+"
principles:
  - {id: L1, text: "В сказочном мире нет узнаваемых современных армии, полиции и спецслужб"}
  - {id: L2, text: "Священник и церковь — не злодеи. Без церковных таинств, ритуалов «по шагам» и сатанинской символики"}
  - {id: L3, text: "Ребёнок не страдает в кадре: угроза ребёнку — через звук, тень и последствия"}
  - {id: L4, text: "Насилие — «удар, вспышка, последствие», без смакования"}
  - {id: L5, text: "Семья и отцовство в центре; финал — искупление и восстановленная семья"}
  - {id: L6, text: "Никаких реальных лиц: лица, созданные ИИ, не похожи на реальных людей"}
  - {id: L7, text: "Ничего из «Ведьмака»: слово «ведьмак» как профессия, школы, мутации, белые волосы и кошачьи глаза, медальон с волчьей головой, боевые знаки, два меча, «Право Неожиданности». Мотив «отдай то, чего дома не знаешь» — народный, его можно"}
markers:
  - category: witcher
    principle: L7
    words: ["ведьмак", "школа волка", "школа кота", "мутаци", "кошачьи глаза", "волчьей голов", "знак игни", "знак аард", "право неожиданности", "два меча"]
  - category: power_structures
    principle: L1
    words: ["полиц", "полицейск", "спецназ", "фсб", "мвд", "росгвард", "военкомат"]
  - category: religion
    principle: L2
    words: ["злой священник", "злой поп", "оскверн", "богохульств", "пентаграмм", "сатан", "чёрная месса"]
  - category: child_violence
    principle: L3
    words: ["бьёт ребёнка", "бьёт дочь", "избивает ребёнка", "пытают ребёнка", "ребёнок кричит от боли"]
  - category: onscreen_violence
