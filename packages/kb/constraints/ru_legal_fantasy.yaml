# Правовые рамки для фэнтези-жанров: общие принципы (ru_legal) плюс правила про чудо.
# Источник: исследование продюсера, «Российская адаптация» и «Регулирование» (30.09.2026).
# Риски по религии и оккультизму — вывод исследования, не юридическое заключение.
# Словарь маркеров — заготовка, юрист дополняет.
age_rating: "16+"
principles:
  - {id: L1, text: "Силовики — компетентные союзники или нейтральны, не злодеи и не глупцы"}
  - {id: L2, text: "Все злодеи — частные лица"}
  - {id: L3, text: "Финал законный, без самосуда: сила даёт знание, закон даёт наказание"}
  - {id: L4, text: "Насилие — за кадром, через последствия"}
  - {id: L5, text: "Без курения в кадре"}
  - {id: L6, text: "Без ритуалов «по шагам», церковных таинств и сатанинской символики"}
  - {id: L7, text: "Близость — через затемнение; финал — обручение и восстановленная семья"}
markers:
  - category: smoking
    principle: L5
    words: ["закурил", "закурила", "сигарет", "курит"]
  - category: vigilante
    principle: L3
    words: ["самосуд", "сама накажу", "своими руками", "расправ"]
  - category: police_negative
