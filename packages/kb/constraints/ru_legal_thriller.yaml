# Правовые рамки вертикального триллера и хоррора для российских площадок.
# Исследование продюсера отмечает: нужен параметр интенсивности насилия (в Китае — обязательная
# регистрация и многоуровневая проверка микродрам). Рейтинг 16+ — решение продюсера (17.10.2026);
# словарь маркеров — заготовка, юрист дополняет. Это не юридическое заключение.
age_rating: "16+"
principles:
  - {id: L1, text: "Насилие — «удар, вспышка, последствие»: без смакования, без натуралистичной крови (gore); страх — из нарушения нормы, не из расчленёнки"}
  - {id: L2, text: "Силовики и врачи — компетентные; угроза — частные лица, близкие, двойник, система правил"}
  - {id: L3, text: "Самоубийство, самоповреждение, зависимости — не как выбор героя и не «по шагам»; только как действие внешней силы"}
  - {id: L4, text: "Секты и культы — вымышленные, без имён реальных организаций и религий; обряды не воспроизводимы"}
  - {id: L5, text: "Насилие над детьми и животными — только через звук, тень и последствия"}
  - {id: L6, text: "Никаких инструкций: способы взлома, отравления, слежки не показываются рабочими"}
  - {id: L7, text: "Без курения в кадре; алкоголь — не как решение проблемы"}
markers:
  - category: gore
    principle: L1
    words: ["кишки", "расчлен", "кровь хлещет", "отрубает голову", "выдавливает глаз", "разрывает горло"]
  # Силовики и врачи как злодеи или дураки: только устойчивые обороты, чтобы «следователь», «врач», «полиция» сами по себе не срабатывали.
  - category: authorities
    principle: L2
    words: ["продажный мент", "продажные менты", "продажный полицейский", "мент крышует", "полиция куплена", "следователь подкуплен", "следователь берёт взятку", "врач-убийца", "врачи-убийцы", "врач подкуплен", "врачи специально залечили"]
  - category: suicide
    principle: L3
    words: ["покончить с собой", "перерезает вены", "петля на шее", "прыгает с крыши", "горсть таблеток"]
  - category: cult
    principle: L4
    words: ["свидетели иеговы", "саентолог", "сатанист", "чёрная месса", "иегов"]
  - category: child_violence
    principle: L5
    words: ["бьёт ребёнка", "избивает ребёнка", "пытает ребёнка", "душит ребёнка", "убивает собаку в кадре"]
  - category: instructions
    principle: L6
    # «дозировка» сама по себе — обычное слово врача; маркер — только дозировка яда или смертельная.
    words: ["рецепт яда", "дозировка яда", "смертельная дозировка", "смертельную дозировку", "как взломать", "как отключить камеру", "пин-код от"]
  - category: smoking
    principle: L7
    words: ["закурил", "закурила", "сигарет"]
