      - "Мотив злодея в прошлом проверять на то, что он давал ему тогда"
      - "Детали эпохи сверять с выбранным веком: оружие, праздники, обряды не позже него"
  - id: П
    name: Российские рамки
    check: "Пройдёт ли прокатное удостоверение? Образ полиции, следователя и суда; тема самоубийства; религия; «традиционные ценности»."
    hole_types: [10]
    rules:
      - "Любая сцена, где герой по своей воле идёт к смерти, проверяется по закону 149-ФЗ: показывать как действие внешней силы, не как выбор"
      - "Религиозные образы не смешивать с языческой мистикой; пользоваться ими только как историческим фоном"
      - "Силовые структуры и суд — честные и компетентные; месть завершается законно, без самосуда"
      - "В задании агенту и в документах не называть чужие франшизы как образец — агент принесёт их образы. Чужое — только в списке «чего нельзя»"
      - "Самая опасная зона сходства с франшизой — профессия героя"
      - "Религия, капища и иконы, не нужные сюжету, — лишние вопросы эксперта: убирать"
      - "Документ не противоречит себе в рамках: если войско есть, оно показано достойно"
      - "Слово цепляет эксперта фонда раньше смысла: для заявки нужен словарь замен"
