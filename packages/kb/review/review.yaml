# Метод разбора дыр: общий для всех жанров. Агент («адвокат дьявола») проходит по нему каждый проект.
# Источники: промпт продюсера для разбора (docs/hole_review_prompt.md); правила из раздела
# «Дыры в первых версиях и правила для агента» концепта «Купальская ночь» и из эталонного разбора
# Fable 5.1 (fixtures/golden/kupala); 58 исправлений «было / стало» концепции «Три луны»
# (fixtures/golden/tri_luny/fixes.yaml, 03.10.2026). Повторы сведены вместе.
# hole_types — какие типы из holes/catalog.yaml получают правила категории при проверке.
stub: false
six_questions:
  - "Зачем ему это, если он знает то, что знает? (Мотив на тот момент, а не на момент сценариста.)"
  - "Как именно он это делает? (Физически, юридически, технически: возможно ли, хватит ли времени, есть ли доступ.)"
  - "Откуда он это знает? (Каким путём информация попала к нему.)"
  - "Что ему мешает сделать проще? (Есть ли очевидный более простой путь, который сюжет игнорирует.)"
  - "Что будет, если он ничего не сделает? (Действительно ли нужно действие.)"
  - "Какой простой шаг соперника это обнуляет? (Завещание, развод, заявление в полицию, звонок юристу, разговор с одним человеком.)"
severities:
  critical: "Ломает логику сезона или основной поворот"
  high: "Зритель заметит и перестанет верить"
  medium: "Заметит внимательный зритель"
  low: "Придирка, но её проще закрыть сейчас, чем потом"
patterns:
  - "Унижение героини без объяснённого механизма"
  - "Событие раны без «кто, как, когда и зачем»"
  - "Героиня оказывается там, где ей нечего делать"
  - "Сделка, в которой не видна выгода обеих сторон"
  - "Мотив «деньги» без конкретного механизма"
  - "Юридический ход, который не работает по закону"
  - "Слабость героя игнорируется сюжетом"
  - "Злодей действует против собственной выгоды"
  - "Правило чуда непонятно, как использовать в сюжете"
  - "Два чуда вместо одного"
  - "Правило чуда нарушено ценой или арифметикой"
  - "Злодей после проигрыша продолжает использовать путь, который уже закрыт"
  - "У злодея после поворота нет новой цели"
  - "Финал опирается на правило, которое не было заявлено раньше"
categories:
  - id: А
    name: Мотивы
    check: "Есть ли у каждого злодея, героини и любовного героя понятная причина действовать именно так и именно тогда? Меняется ли мотив после поворотов, и учтено ли это?"
    hole_types: [3, 6]
    rules:
      - "Злодей не действует против своей выгоды. Каждое ключевое действие проверять вопросом: зачем это ему, если он знает и верит в то, во что верит сейчас"
      - "У каждого хода злодея — цель на момент хода, а не на момент, когда её придумал сценарист"
      - "Когда героиня отнимает у злодея цель, он получает новую, более отчаянную. После каждого удара героини старая уверенность злодея исчезает"
      - "Проигранный злодеем путь больше не используется"
      - "У пойманного злодея есть выгодный ход — сдать старших. Если он молчит или отказывается от показаний, причина и выгода — в кадре"
      - "Сдача сообщника приносит злодею больше, чем отнимает. Показать выгоду в кадре"
      - "Каждое предложение злодея — сделка с понятной ему выгодой. У каждой сделки — выгода обеих сторон и понятная история знакомства"
      - "Мотив «деньги» всегда раскрывается конкретным механизмом: кредит, долг, наследство, сделка"
      - "У союзника-предателя мотив — конкретная выгода, а не только обида"
      - "Злодей до преступления ведёт себя так, чтобы потом не стать первым подозреваемым. Злодей не отдаёт бумагу с собственной подписью"
      - "Если мотив касался двоих, а пострадал один, — объяснить, почему второго не тронули"
      - "Перед каждой ловушкой проверить, какой простой шаг жертвы её обнуляет (звонок, сообщение, вопрос), и закрыть его в кадре"
      - "У каждой переписки-улики — причина, почему эти двое так говорят друг с другом"
      - "Ограничение силы действует только там, где заявлено. Если персонаж ведёт себя так же вне этой зоны — назвать причину характером"
      - "Желание персонажа — действие, а не состояние: «удержать поле», а не «дождаться». Арка — список сцен с номерами серий"
      - "Жертва без показанного мотива не трогает: мотив жертвы показать до жертвы"
      - "У спутника — своя цель и своя неправда"
      - "Предыстория отвечает на все «а почему он просто не…»"
  - id: Б
    name: Закон
    check: "Работают ли по праву РФ все юридические ходы: наследство, добрачное имущество, завещание, недееспособность, экспертиза, развод, срок давности, недостойный наследник, покушение, показания, признание как доказательство? Где нет уверенности — пометить «нужен юрист»."
    hole_types: [5]
    rules:
      - "Каждый юридический ход проверять тремя вопросами, как магию: кто имеет право это сделать, сколько это занимает, что это даёт на самом деле. Нормы — по кодексу, не по памяти; где нет уверенности — «нужен юрист»"
      - "Каждый документ в сюжете проверять вопросом: кто и на каком основании мог его выдать"
      - "Развод и наследство — разные вещи"
      - "Если у злодея денежный мотив, проверить, какие простые юридические шаги героини его обнуляют (завещание, развод, продажа, дарение). Показать, почему они не спасают или как злодей отвечает"
      - "Перед ответом героини проверить, нет ли более простого законного хода. Если закон даёт героине ход сильнее придуманного — брать его, а не прятать"
      - "Каждое «почему не вызвали врача, полицию, юриста» закрыть репликой в той же серии"
      - "Наказание по закону — только то, что закон реально даёт. Каждое наказание в финале — с указанием улики, на которой оно стоит"
      - "Юридические ходы финала проверять на то, жив ли герой к этому моменту, и на сроки после последней серии"
      - "После переписки финала перечитать старые формулировки"
  - id: В
    name: Правила чуда
    check: "Соблюдены ли условия каждого применения силы (где, как, на что тратится, что запрещено)? Нет ли применения, которое обходит правило без объяснения? Не растёт ли сила сверх заявленной цены? Учтено ли, у кого ещё есть та же сила?"
    hole_types: [1, 2]
    rules:
      - "Каждое правило чуда описано так: как выглядит в кадре, ограничения, 3 примера использования в сюжете"
      - "Если сверхъестественных элементов больше одного — объединить их в одну систему с общими правилами. Мифическое существо можно не называть: показывать признаками, а не термином"
      - "Правило чуда прогнать по всему прошлому мира, не только по сериям: оно должно работать и в годы до 1-й серии"
      - "Каждое применение силы проверять на соблюдение условий: где, как, при чём. Цену силы сверять с формулировкой правила; если сюжет требует больше — уточнить правило, а не нарушать его"
      - "У слабости сверхсилы есть мера. Если мера числовая — каждую сцену сверять с числом, а не с ощущением"
      - "Каждое слово правила («рассвет», «вода», «вслух») определить один раз с точной границей. Финал не должен зависеть от толкования слова"
      - "Когда правило дополняют, перепроверить все ранние сцены, где оно было угрозой"
      - "Сила героини не растёт без нового правила и цены. Симптом и сила — разные вещи"
      - "У платной силы — точный способ прицеливания: все примеры подчиняются одному описанию"
      - "Каждое условие главного правила звучит на экране до того, как на нём построен поворот. Как выглядит срабатывание главного правила — показать до финала; финальная ловушка опирается только на заявленные правила"
      - "Если у злодея есть детектор лжи, в ключевой сцене показать, как героиня проходит проверку, а не то, что злодей забыл проверить"
      - "У каждого мистического знака — одно точное условие срабатывания; у мистического предмета — объяснённый путь"
      - "Задел на продолжение опирается только на правила, заявленные в сезоне, и не противоречит уликам сезона"
      - "У каждого закона мира — серия, где его произносят, и серия, где он срабатывает с видимым последствием"
      - "Средство без серии — не средство: у каждого оберега и ресурса чуда — цена и серии, где его применяют"
      - "Закон мира не спорит с событиями: то, что «спит» или «не может», не действует в кадре"
  - id: Г
    name: Время
    check: "Сходится ли счётчик дней и ход суток по всем сериям? Хватает ли времени в мире на суд, экспертизу, комиссию, переезд, стройку? Не расходятся ли сроки в таблицах и посерийном плане?"
    hole_types: [5, 7]
    rules:
      - "Сроки юридических процедур сверять со счётчиком сюжета. Если процедура длиннее — заменить на ту, что укладывается"
      - "Одно заседание в сериале — один реальный этап процедуры, с его сроком"
      - "Задать, когда тикает счётчик (рассвет или полночь), и сверить по нему каждую серию"
      - "Отключённый ресурс (свет, связь, транспорт) остаётся отключённым, пока не показано обратное"
      - "У задержания злодея — механика: кто, где, как"
      - "Срок в природных циклах проверять арифметикой: три полнолуния — не меньше 59 дней, и времена года должны их вместить"
  - id: Д
    name: Информация
    check: "Кто что знает и с какой серии? Не действует ли персонаж по информации, которой у него ещё нет? Не забывает ли информацию, которая у него уже есть?"
    hole_types: [2, 11]
    with_notice_questions: true   # вопросы «кто был рядом?» по конкретным событиям сезона
    rules:
      - "Каждую улику вести по цепочке «у кого она сейчас». Если предмет попал к полиции — полиция знает всё, что в нём есть. Каждая улика, показанная зрителю, учтена следствием — или объяснено, почему не работает"
      - "У каждого важного предмета и документа в руках героини — путь: где лежал, кто знал, почему злодей не забрал раньше"
      - "Если злодей пользуется знанием о природе героя — показать, когда он узнал. У всеведущего героя и у персонажа-старожила — источник каждого знания и явные границы: чего не знает и почему"
      - "Не знает ли зритель раньше героини то, чем она удивляется"
      - "Улику с датой проверять вопросом «что знает зритель на этот момент»"
      - "Очевидные вопросы задаются в кадре и получают ответ, пусть ложный"
      - "Таблицы и посерийный план сверять друг с другом построчно"
      - "В сценах климакса проверять состояние каждого персонажа: где он, в сознании ли, что у него в руках"
      - "Всезнающий проводник делает путь ненужным: проводник знает законы, но не знает тайн"
      - "Истина должна быть увидена, а не рассказана"
  - id: Е
    name: Посадки и окупаемость
    check: "Где окупается каждая посадка? Нет ли окупаемостей без посадки и посадок без окупаемости?"
    hole_types: [4, 10]
    rules:
      - "Каждый предмет, снятый крупным планом, — посадка. Вести список: где он сейчас и где окупается"
      - "Клиффхэнгер-улика окупается в ближайших пяти сериях; мистическая посадка — хотя бы в финале сезона"
      - "У каждой окупаемости есть посадка раньше: что сработало в финале, должно быть показано заранее"
      - "Каждая заявленная беременность, болезнь, долг — с исходом в финале"
      - "Подсказка каждого блока работает в финале"
      - "Потерю показать до того, как она случилась: предмет в кадре раньше, чем его отнимут"
      - "Дверь во второй сезон объясняется законом этого сезона"
  - id: Ж
    name: Лестница злодеев
    check: "Ровно ли злодеев, сколько требует жанр? Каждый ли наказан по закону? Каждая ли победа даёт ключ к следующему? Есть ли победы через стравливание? Выигрывает ли героиня умом, а не силой или удачей?"
    hole_types: [6, 10]
    rules:
      - "Каждая победа героини даёт ключ к следующему злодею"
      - "Героиня выигрывает умом, а не силой и не удачей"
      - "Каждый злодей наказан по закону, и наказание стоит на названной улике"
      - "Антагонист хочет того, что можно дать не оружием"
      - "У злодея — своя правда и личная цена молчания"
      - "Каждое чудовище или злодей требует своего действия героя"
      - "Рост угрозы измеряется потерями героя: «больше» — не рост, рост — это «меньше средств»"
  - id: З
    name: Главный персонаж
    check: "Действует ли героиня сама в каждой серии? Нет ли серий, где ей просто везёт или её спасают? Логичны ли её ошибки? Не глупеет ли она ради сюжета?"
    hole_types: [3, 10]
    rules:
      - "В каждой серии — одно действие героини по её воле"
      - "Ключевые раскрытия героиня добывает действием, не случаем"
      - "Эмоции серий подряд считать по таблице, а не по ощущению"
      - "У каждого унижения героини — механизм: кто на нём выигрывает и почему она терпит"
      - "У раны героини — конкретное событие: кто, как, когда и зачем"
      - "Для каждой локации ответить: почему героиня здесь и как сюда попала"
      - "Грех героя — выбор, а не ошибка: он знал и сделал ради выгоды"
      - "Важная потеря — решение героя, а не случай"
      - "После мидпоинта нужен откат: герой ещё раз срывается в старую Ложь и платит"
      - "Нельзя полюбить того, кого зритель не видел: у персонажа, ради которого всё, — сцены в кадре"
  - id: И
    name: Любовная линия
    # Только в жанрах с любовной линией.
    genres: [revenge_thriller, romantasy_revenge]
    check: "Держатся ли этапы романа? Не токсичен ли герой без искупления? Оправданы ли разрыв и примирение? Не слишком ли легко героиня прощает? Не спасает ли он её больше одного раза?"
    hole_types: [10]
    rules:
      - "У любовного героя с тёмным прошлым — цена, которую он платит по закону или в кадре. Проверять героя теми же вопросами, что злодеев"
      - "Любовный герой не спаситель: спасает героиню не больше одного раза, побед за неё не выигрывает"
  - id: К
    name: Тема
    check: "Не противоречит ли теме какая-нибудь победа (обман, шантаж, ложь героини)? Не отделена ли героиня от темы в важных сценах?"
    hole_types: [10]
    rules:
      - "Героиня, которая побеждает правдой, не лжёт официальному лицу. Каждую её реплику следователю проверять на ложь"
      - "Каждую победу проверять на соответствие теме сериала"
      - "Тема без спора — лозунг: люди каждого блока дают свой неправильный ответ на вопрос темы вслух"
      - "Выбор в финале стоит дорого и закрывает желание антагониста"
      - "Жертва с оговоркой — не жертва"
  - id: Л
    name: Производство
    check: "Укладывается ли всё в производственные рамки жанра (практические эффекты или ИИ-видео)? Нет ли сцен, которые этим способом не снять, или массовки? Соответствуют ли персонажи и локации лимитам?"
    hole_types: [8]
    rules:
      - "Каждую серию проверять по списку зон. Новая локация — только если её нельзя заменить существующей"
      - "Считать говорящих в каждой сцене и постоянных персонажей за сезон"
      - "Приём, который повторяется весь сезон, не требует того, что плохо делает способ съёмки (крупные лица, руки, толпа)"
  - id: М
    name: Формат
    check: "Понятен ли каждый ключевой поворот без звука за 2 секунды? Одно событие, один вопрос, клиффхэнгер? Не перегружены ли серии? Не повторяются ли типы крючков?"
    hole_types: [9]
    rules:
      - "В серии 60–120 секунд — не больше одного события, одного поворота и одного клиффхэнгера. Всё, что не работает на них, — в следующую серию"
      - "Каждый ключевой поворот проверять без звука; реплике дать визуальный эквивалент"
      - "Обрыв в каждой серии. В карте сезона нет строк на несколько серий: строка на девять серий — отложенная работа и провис"
      - "Два обрыва подряд — разных типов; в каждом блоке — одно откровение не в последней серии и одно вторжение"
      - "За картинку платят, за угадываемое слово — нет: обрыв перед барьером нельзя угадать из бесплатных серий"
      - "Каждая серия сразу после барьера дарит то, чего бесплатно не было"
      - "Один большой вопрос держит около десяти серий: после барьера нужны 2–3 промежуточных вопроса, закрытых к мидпоинту"
      - "Аудитория, которой обещали персонажа, должна видеть его: у второстепенных линий — номера серий"
      - "Если в финале нет места для развязки второстепенного злодея — сделать её кадрами, без слов"
  - id: Н
    name: Имена и ясность
    check: "Различимы ли главные имена по первой букве и на слух? Не слишком ли много родственных связей для зрителя, который смотрит по 90 секунд?"
    hole_types: [9]
    rules:
      - "Имена основных персонажей — с разных первых букв и разного звучания; проверять и на слух"
      - "Не больше трёх покойных родственников на сезон"
      - "Одна константа — одно число во всём документе: барьер, срок, возраст, число голосов называть одинаково везде"
      - "Одно слово — одно значение: термин мира не используется в двух смыслах"
  - id: О
    name: История и факты
    check: "Сходятся ли возраста персонажей и даты на каждый год прошлого? Сверены ли исторические события и праздники с календарём?"
    hole_types: [7]
    rules:
