# Жанровый пакет: вертикальный триллер, саспенс и хоррор (бытовой триллер, газлайтинг, мистика, хоррор на правилах).
# Источники: исследования продюсера «Драматургия вертикальных сериалов в хорроре, мистике и триллере:
# правила и фреймворк для софта» и «Архитектура, драматургия и производственная экономика вертикальных
# микродрам» (октябрь 2026). Гибрид «жанр + эмоциональное ядро» — стратегия по умолчанию.
id: vertical_thriller
