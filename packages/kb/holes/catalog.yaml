# 11 типов дыр и вопросы «адвоката дьявола». Источник: SPEC.md. Ответ «так работает» не принимается.
holes:
  - id: 1
    name: Правило мира без причины
    questions: ["Почему это правило?", "Какая цена нарушения?", "Почему злодей не нашёл пути проще?"]
  - id: 2
    name: «Почему никто не заметил?»
    questions: ["Кто рядом с событием: коллеги, врачи, соседи, родня?", "Что сделал бы нормальный человек?"]
  - id: 3
    name: Бездействие
    questions: ["Почему героиня не уходит?", "Почему не идёт в полицию?", "Почему злодей не действует быстрее?"]
  - id: 4
    name: Судьба второстепенных
    questions: ["Что стало с персонажем после последней сцены?", "Почему свидетеля не убрали?"]
  - id: 5
    name: Быт и физика
    questions: ["Кто не заметит этого неделями?", "Хватает ли времени?", "Откуда у неё ключ?"]
  - id: 6
    name: Скрытые роли
    questions: ["Действует против героини — значит, злодей. Какой ранг, какое наказание?"]
  - id: 7
    name: Хронология
    questions: ["Сколько лет каждому в год события?", "Что злодей делал все эти годы?"]
  - id: 8
    name: Производство
    questions: ["Сцена вне основной локации?", "Нужна графика?", "Больше трёх говорящих?"]
  - id: 9
    name: Формат
    questions: ["Деталь видна на экране телефона?", "Реплика длиннее 12 слов?"]
  - id: 10
    name: Структура
    questions: ["Что стоит на 8-й серии?", "Мидпоинт — контрраскрытие?", "Нет ли трёх серий страдания подряд?"]
  - id: 11
    name: Знание персонажа
    questions: ["Откуда он это знает?", "В какой серии узнал?", "Почему ведёт себя так, будто не знает?"]
