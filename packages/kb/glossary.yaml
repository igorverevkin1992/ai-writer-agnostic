# Словарь терминов, которыми говорят промпты и правила. Термины без genres — общие;
# с genres — только для перечисленных жанров. Определения продюсер может уточнить.
stub: false
terms:
  - {term: кайф, definition: "Момент удовольствия зрителя: героиня побеждает, злодей получает по заслугам", genres: [revenge_thriller, romantasy_revenge, slavic_myth]}
  - {term: страдание, definition: "Серия, где героиня терпит поражение или боль"}
  - {term: поворот, definition: "Событие, которое меняет направление истории"}
  - {term: разница в знании, definition: "Зритель, героиня и злодей знают разное; на этом держится напряжение"}
  - {term: барьер (пэйволл), definition: "Серия, после которой просмотр платный; её обрыв должен ставить вопрос, который нельзя угадать по бесплатным сериям"}
  - {term: лестница злодеев, definition: "Пять антагонистов по рангу: каждого снимают по очереди, и каждый — ключ к следующему", genres: [revenge_thriller, romantasy_revenge, slavic_myth]}
  - {term: ствол, definition: "Один главный вопрос сезона; все сцены работают на него", genres: [vertical_thriller]}
  - {term: матрёшка, definition: "Вложенные вопросы: ответ на вопрос уровня N в той же серии открывает вопрос уровня N+1, крупнее прежнего", genres: [vertical_thriller]}
  - {term: перезагрузка, definition: "Серия, где меняются правила, роли или открывается второе дно: всё, что зритель считал правдой, оказывается не тем", genres: [vertical_thriller]}
  - {term: режим знания, definition: "Саспенс — зритель знает больше героя; тайна — зритель и герой узнают вместе; сюрприз — знает только персонаж в кадре", genres: [vertical_thriller]}
  - {term: окно спасения, definition: "Момент, когда зритель видит выход, а герой нет; на нём держится драматическая ирония", genres: [vertical_thriller]}
  - {term: ложное спасение, definition: "Герой считает, что спасён, и зритель вместе с ним; через серию выясняется, что нет. Не чаще раза на шесть серий", genres: [vertical_thriller]}
  - {term: перехлёст, definition: "Следующая серия начинается за несколько секунд до конца предыдущей, с той же точки, а не после неё", genres: [vertical_thriller]}
  - {term: говорящие головы, definition: "Длинный диалог без действия, звука и смены плана; в вертикали — больше десяти секунд подряд", genres: [vertical_thriller]}
  - {term: визуальный знак угрозы, definition: "Повторяющийся предмет, след или жест, по которому зритель узнаёт угрозу без слов", genres: [vertical_thriller]}
  - {term: улика, definition: "Деталь, которая работает на разгадку одного из вопросов матрёшки; окупается не позже чем через 15 серий", genres: [vertical_thriller]}
  - {term: золотые три, definition: "Первые три серии: необратимое событие, не больше двух персонажей в первой, ни одного флэшбэка", genres: [vertical_thriller]}
