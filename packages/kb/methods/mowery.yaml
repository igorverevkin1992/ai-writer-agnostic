# Методика Тайлера Моуэри (Practical Screenwriting). Пересказ принципов по конспектам
# лекций продюсера (34 лекции, docs/methods/inbox — локально, не в репозитории).
# Чужой текст не цитируется; здесь — правила в формулировке для агента.
# for — шаги конвейера, на которых принцип попадает в промпт (пусто — на всех):
# concept, logline, bible, season_plan, episode_cards, scripts, review.
id: mowery
name: Практическая драматургия Моуэри
author: Тайлер Моуэри
stub: false
source: "Конспекты лекций Practical Screenwriting (34 лекции), 2026"
summary: "Персонаж — это желание плюс убеждение. Конфликт идёт на трёх уровнях сразу (внешний, внутренний, философский) и сходится в выборе под давлением. Каждое получение желаемого стоит цены; цена рождает следующую проблему. Круг истории — рабочий чертёж сезона, блока и серии."
principles:
  # Основа
  - id: M01
    text: "Персонаж = чего он хочет + во что верит. Желание — внешнее и конкретное (его можно снять), убеждение — ответ на вопрос «как правильно жить». Без одного из двух персонажа нет."
    for: [concept, bible]
  - id: M02
    text: "Три уровня конфликта присутствуют одновременно в истории и в каждом крупном выборе: внешний (что герой делает), внутренний (отношения, что он чувствует), философский (чьё убеждение верно). Отдельные сцены «про чувства» и «про действие» — ошибка: один выбор держит все три слоя."
  - id: M03
    text: "Главная беда историй — нет философского конфликта: герой очевидно прав, злодей очевидно неправ. У желания героя есть цена, у позиции антагониста — своя правда и выгода. Зритель понимает, зачем антагонист верит в то, во что верит."
    for: [concept, bible, review]
  - id: M04
    text: "Одна история — одна центральная идея. Все линии, персонажи и сцены подкрепляют один вопрос; что не работает на него — вырезается. Сложность — это глубина одной идеи, а не число тем."
    for: [concept, bible, review]
  - id: M05
    text: "Призрак — событие прошлого, которое укрепило убеждение героя. Это не «ложь», а убеждение с весом и причиной. Слабый призрак (вывод из события очевидно глуп) вредит сильнее, чем его отсутствие. Строить от убеждения назад к событию."
    for: [bible, review]
  - id: M06
    text: "Антагонист — зеркало темы: он хочет того же или спорит с тем же, но верит иначе. Лучший антагонист может сказать герою правду в лицо, и зритель на секунду с ним согласится."
    for: [bible]
  # Круг истории как рабочий инструмент
  - id: M07
    text: "Круг истории применяется на трёх уровнях: сезон, блок (акт), серия. Акт — не доля хронометража, а полный круг: герой с нуждой → незнакомая ситуация → адаптация → получил → заплатил → возвращение → перемена."
    for: [season_plan, episode_cards]
  - id: M08
    text: "Семь битов серии или акта: цель → начальная проблема → выбор и действие → цель достигнута (прогресс виден) → неожиданная цена («это потребует больше, чем он думал») → решающий выбор (кульминация) → мир изменился. Цена — следствие достигнутого, а не беда с неба."
    for: [episode_cards, scripts]
  - id: M09
    text: "Начальная проблема каждого акта — результат предыдущего: цена, заплаченная в конце одного круга, становится проблемой следующего."
    for: [season_plan, episode_cards]
  # Движение и цена
  - id: M10
    text: "Каждое получение желаемого стоит чего-то: получил → заплатил → новое желание. Сцена, где герой получил и ушёл без цены, останавливает историю."
    for: [episode_cards, scripts, review]
  - id: M11
    text: "Выбор между двумя ценностями сильнее препятствия: выбирая одно, герой теряет другое. Там, где можно поставить препятствие, лучше поставить выбор."
  - id: M12
    text: "Страдание героя — не жестокость автора, а единственный способ заставить его пересмотреть убеждения и действовать. Без цены герой не меняется."
    for: [bible, season_plan]
  # Протагонист
  - id: M13
    text: "Протагонист — тот, чей выбор решает философский конфликт; у него самое сильное желание и самая высокая цена. Он действует, а не реагирует, с первой серии."
    for: [concept, bible]
  - id: M14
    text: "Запоминающийся персонаж узнаваем по действию под давлением, не по описанию. Характер — это выбор там, где выбирать не хочется."
    for: [bible, scripts]
  - id: M15
    text: "Персонаж определяется контрастом с другими: у каждого из главных — своя позиция по теме (четырёхугольник оппозиции: герой, главный антагонист и ещё двое, спорящие и с героем, и друг с другом)."
    for: [bible]
  # Арка
  - id: M16
    text: "Арка — путь от набора убеждений А к набору Б через события, которые этим убеждениям противоречат. Арка без переходных событий — заявление, а не арка."
    for: [bible, season_plan]
  - id: M17
    text: "Три шага перемены: первый пинч — убеждение оспорено, герой отказывается меняться и платит; мидпойнт — герой видит новое убеждение и уже не может его отрицать; второй пинч — герой впервые действует по новому убеждению и проходит проверку."
    for: [season_plan]
  - id: M18
    text: "Арку проще всего строить от финального выбора: что герой выберет в кульминации и чего это будет стоить — и отсюда назад к началу."
    for: [bible, season_plan]
  - id: M19
    text: "Второстепенные герои несут арки, зеркальные к арке героя: один уже держит правду, другой платит за ту же ложь. Так тема спорится в кадре, а не в голове героя."
    for: [bible]
  # Мидпойнт
  - id: M20
    text: "Мидпойнт — герой получает то, что хотел, и это оборачивается новой проблемой или раскрывает тайну, переворачивающую цель. Вторая половина — не продолжение, а новое направление."
    for: [season_plan]
  - id: M21
    text: "Мидпойнт — ложная победа или ложное поражение, а не просто «большое событие». После него прежний путь героя закрыт."
    for: [season_plan, review]
  # Внешний сюжет
  - id: M22
    text: "Внешний сюжет — цепь «хочу → препятствие → действие → результат», где результат меняет положение, а не возвращает к исходному. Нет сцен, после которых всё как было."
    for: [season_plan, episode_cards]
  - id: M23
    text: "Антагонистическая сила присутствует во второй четверти не реже, чем в первой: герой встречает её прямо, а не слышит о ней."
    for: [season_plan]
  # Кульминация и финал
  - id: M24
    text: "Три ставки заявлены в первом акте: внешняя (что герой получит или потеряет), внутренняя (отношения), философская (чьё убеждение победит). Без заявленных ставок финал не на что опирать."
    for: [concept, bible]
  - id: M25
    text: "Кульминация — выбор героя между желанием и новым убеждением; выбор стоит ему чего-то в сам момент выбора. Философский спор решается действием, не речью."
    for: [season_plan, scripts]
  - id: M26
    text: "В финале по каждой из трёх ставок ясно: выиграл или проиграл. Смешанный финал допустим (выиграл внешнее, проиграл внутреннее), но каждая ставка закрыта явно."
    for: [season_plan, review]
  - id: M27
    text: "Финал говорит, как жить: исход показывает, какое убеждение оказалось верным и какой ценой. Это смысл истории — то, что остаётся со зрителем."
    for: [concept, season_plan]
  - id: M28
    text: "Ошибки финала: злодей побеждён силой или случаем, а не выбором героя; работает правило, не заявленное раньше; кульминация без личной цены; развязка длиннее кульминации."
    for: [review]
  # Твист
  - id: M29
    text: "Значимый твист сдвигает три слоя сразу: внешний (факты переставлены), внутренний (зритель переходит из одного ясного чувства в другое, не в растерянность), философский (убеждение, казавшееся сильнее, оказалось слабее). Твист только внешний — фокус, не поворот."
    for: [season_plan, review]
  - id: M30
    text: "Твист честен: все кусочки были показаны раньше, и в обратном взгляде он неизбежен."
    for: [season_plan, review]
  # Клиффхэнгер
  - id: M31
    text: "Серия — полный мини-круг с собственной кульминацией; обрыв — цена победы или новый вопрос после решённого конфликта, а не оборванная кульминация. Резать до решающего выбора можно, но не каждую серию."
    for: [episode_cards]
    genres: [revenge_thriller, romantasy_revenge, slavic_myth]   # в триллере обрыв в каждой серии (V07)
  - id: M32
    text: "Следующая серия начинается с низкой точки конфликта и нового вопроса, а не с продолжения кульминации."
    for: [episode_cards]
    genres: [revenge_thriller, romantasy_revenge, slavic_myth]   # в триллере — перехлёст и мгновенный результат (V09, V10)
  # Посадки и окупаемости
  - id: M33
    text: "Посадка — деталь, показанная без нажима и важная позже; окупаемость — момент, когда деталь решает исход. Каждая окупаемость финала посажена в первой половине; каждая посадка окупается."
    for: [season_plan, episode_cards, review]
  - id: M34
    text: "Мотив — повторяющаяся посадка, которая каждый раз меняет значение. Это способ показать перемену убеждений без слов."
    for: [season_plan, scripts]
  - id: M35
    text: "Посадка работает сильнее, когда связана с убеждением героя, а не только с механикой сюжета."
    for: [scripts]
  # Сцена
  - id: M36
    text: "Сцена = персонаж хочет → препятствие → выбор → перемена. Нет перемены — нет сцены."
    for: [scripts]
  - id: M37
    text: "Иерархия желаний: желание сцены служит желанию серии, желание серии — желанию сезона. Сцена, не ведущая к цели серии, лишняя."
    for: [episode_cards, scripts]
  - id: M38
    text: "Входить поздно, выходить рано: сцена начинается на пороге конфликта и заканчивается на выборе, а не после разговора."
    for: [scripts]
  - id: M39
    text: "Диалог — переговоры, а не обмен сведениями: каждая реплика — ход за своё желание. Подтекст сильнее прямого текста."
    for: [scripts]
  - id: M40
    text: "Ошибки сцен: герои согласны друг с другом; экспозиция без конфликта; разговор о прошлом вместо действия в настоящем; «передача информации» без цены для говорящего."
    for: [scripts, review]
  # Ошибки актов
  - id: M41
    text: "Ошибки первого акта: нет конфликта до завязки; герой пассивен и ждёт события; знакомство слишком долгое; завязка не ставит перед выбором; ставки не заявлены."
    for: [season_plan, review]
  - id: M42
    text: "Ошибки второго акта: герой перестаёт двигаться и ждёт финала; препятствия одной силы повторяются; антагонист пропал; мидпойнт ничего не переворачивает; за успехи нет цены."
    for: [season_plan, review]
  # Формат
  - id: M43
    text: "Писать видимое: то, что можно снять и услышать, а не внутренние состояния. Один абзац действия — одна картинка, не длиннее трёх-четырёх строк."
    for: [scripts]
  - id: M44
    text: "Ремарки актёру и камере — минимум; эмоция читается из действия и реплики."
    for: [scripts]
