id: harmon
name: Круг Хармона
author: Дэн Хармон
stub: true
summary: "Восемь шагов истории. Каждый из шести блоков сезона — полный круг и заканчивается большим крючком."
principles:
  - {id: H1, text: "Ты: герой в зоне комфорта"}
  - {id: H2, text: "Нужда: герой чего-то хочет"}
  - {id: H3, text: "Вход: герой попадает в незнакомую ситуацию"}
  - {id: H4, text: "Поиск: герой приспосабливается"}
  - {id: H5, text: "Находка: герой получает желаемое"}
  - {id: H6, text: "Цена: герой платит высокую цену"}
  - {id: H7, text: "Возвращение: герой возвращается к знакомому"}
  - {id: H8, text: "Перемена: герой изменился"}
