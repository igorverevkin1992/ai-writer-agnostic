# Круг истории Дэна Хармона. Пересказ по статьям Хармона и лекциям Моуэри
# (Using the Story Circle, How To Build A Cliffhanger).
id: harmon
name: Круг истории
author: Дэн Хармон
stub: false
source: "Story Structure 101–106 (Хармон); лекции Моуэри о круге истории"
summary: "Восемь шагов: герой в зоне комфорта хочет чего-то, входит в незнакомое, приспосабливается, получает желаемое, платит за него, возвращается и меняется. Круг вложен: сезон, блок, серия и сцена проходят его целиком."
principles:
  - id: H1
    text: "Ты: герой в зоне комфорта. Показан в привычном мире со своим убеждением и своей нехваткой — до того, как мир дрогнет."
    for: [bible, season_plan, episode_cards]
  - id: H2
    text: "Нужда: герой хочет конкретного. Желание названо действием, которое можно снять; настоящая нужда может быть ему ещё не видна."
    for: [bible, season_plan, episode_cards]
  - id: H3
    text: "Вход: герой пересекает порог в незнакомое — своим решением или событием, после которого назад нельзя."
    for: [season_plan, episode_cards]
  - id: H4
    text: "Поиск: герой приспосабливается — пробует, ошибается, платит мелкие цены, учится правилам нового мира."
    for: [season_plan, episode_cards]
  - id: H5
    text: "Находка: герой получает желаемое — и это не то, что ему было нужно. Это мидпойнт круга."
    for: [season_plan, episode_cards]
  - id: H6
    text: "Цена: герой платит тяжёлую цену за полученное. Низшая точка круга; отсюда начинается путь назад."
    for: [season_plan, episode_cards]
  - id: H7
    text: "Возвращение: герой возвращается в знакомое с добытым — предметом, знанием или шрамом."
    for: [season_plan, episode_cards]
  - id: H8
    text: "Перемена: герой изменился и способен на то, чего не мог в первом шаге. Перемена показана действием."
    for: [season_plan, episode_cards]
  - id: H9
    text: "Без хотя бы подобия этих шагов история не читается как история. Шаги можно пропускать, но каждый пропуск стоит узнаваемости — пропускать осознанно."
    for: [review]
  - id: H10
    text: "Круг вложен: сезон, блок, серия и сцена — каждый уровень проходит круг целиком. Ни один шаг не длиннее четверти своего уровня: длинный шаг — знак, что в нём спрятан другой круг."
    for: [season_plan, episode_cards]
  - id: H11
    text: "Нижняя половина круга (шаги 3–6) — незнакомое, верхняя (7–8 и 1–2) — знакомое. Переход через порог отмечен событием, которое нельзя отменить."
    for: [season_plan]
