# Уильям Рабкин, «Writing the Pilot». Пересказ принципов по книге продюсера
# (docs/methods/inbox — локально, не в репозитории). Чужой текст не цитируется.
id: rabkin
name: Пилот и франшиза
author: Уильям Рабкин
stub: false
source: "Writing the Pilot, 2011"
summary: "Пилот продаёт не сюжет, а франшизу: конфликт, который порождает истории каждую неделю, персонажей, определённых выбором, и «кайф» — то единственное, за чем вернутся. Сюжет пилота прост и построен так, чтобы показать людей."
principles:
  - id: R01
    text: "Франшиза — не место действия и не профессия, а механизм, рождающий истории: центральный конфликт между людьми, которые не могут разойтись. Если конфликт разрешим одним разговором — сериала нет."
    for: [concept]
  - id: R02
    text: "Конфликт сериала — столкновение ценностей, и у обеих сторон есть правда. Злодей серии — повод; постоянный конфликт — между постоянными персонажами."
    for: [concept, bible]
  - id: R03
    text: "Персонаж — это его выборы под давлением; биография — не характер. Каждого постоянного определять через то, что он выбирает, когда выбирать больно."
    for: [bible]
  - id: R04
    text: "Второстепенные — опора франшизы: каждый воплощает одну сторону центрального конфликта или одну нагрузку на героя. Персонаж без функции в конфликте — лишний."
    for: [bible, review]
  - id: R05
    text: "Мир сериала — набор правил и ограничений, которые заставляют конфликт повторяться. Правила показываются действием, не объяснением."
    for: [bible]
  - id: R06
    text: "Предыстория (мифология) нужна для характера, не для сюжета: сериал, который живёт разгадкой собственной тайны, теряет случайного зрителя, а постоянных — по мере усложнения."
    for: [concept, season_plan]
  - id: R07
    text: "Два вида пилота: премиссный (показывает событие, запускающее франшизу) и «обычная серия». Премиссный должен одновременно запустить историю и показать, какой будет каждая следующая серия."
    for: [season_plan, episode_cards]
  - id: R08
    text: "Сюжет пилота прост. Его задача — дать сцены, в которых видны характеры и конфликты; закрученная интрига съедает место. За сюжет не возвращаются — возвращаются за людьми."
    for: [season_plan, episode_cards]
  - id: R09
    text: "Первые серии строятся так, чтобы показать героя в его противоречии (не хочет влезать — не может не влезть), а не разгадку."
    for: [episode_cards]
  - id: R10
    text: "«Кайф» — то единственное, что отличает этот сериал от всех остальных; он в кадре с первой серии, а не «потом, когда сюжет разогреется». Что обещано в логлайне, зритель видит сразу."
    for: [concept, logline, season_plan]
  - id: R11
    text: "Зритель считает пилот образцом каждой серии: чего нет в первой серии, того, по его мнению, в сериале не будет."
    for: [season_plan]
  - id: R12
    text: "Почему этот сериал и почему сейчас: сериал говорит со своим временем. У концепта есть ответ, какой страх или надежду зрителя он называет."
    for: [concept]
  - id: R13
    text: "Люди не объясняют друг другу то, что оба знают. Экспозиция — через новичка, конфликт или событие, не через «как ты знаешь»."
    for: [scripts]
  - id: R14
    text: "Персонаж ломается, когда ради сюжета ему дают поступок, несовместимый с его прежними выборами. Проверять каждый поворот против характера, а не характер против поворота."
    for: [review]
