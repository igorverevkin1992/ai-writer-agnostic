# Инженерия вертикальной серии: общие для всех жанров правила формата 9:16.
# Источники: два исследования продюсера (октябрь 2026) — «Архитектура, драматургия и производственная
# экономика вертикальных микродрам» (отраслевые гайды Filmustage, Character.app, MinionArts и др.)
# и «Драматургия вертикальных сериалов в хорроре, мистике и триллере: правила и фреймворк для софта».
# Где два источника расходятся, взята более дробная сетка первого хоррор-документа, а схемы
# Beat Engine (4 части) и 6-битный «позвоночник» сведены к ней (см. V02).
id: vertical
name: Инженерия вертикальной серии
author: Отраслевые гайды 2026
stub: false
source: "Исследования продюсера «Архитектура микродрам» и «Драматургия вертикального хоррора», октябрь 2026"
summary: "Серия 60–120 с — не сжатая сцена, а «тап»: хук в первые 3 с, ставки к 15-й, эскалация, разворот, который читается без звука, и обрыв на вопросе за две секунды до ответа. Серия проектируется от финального кадра назад по таймкодам, потом пишется диалог. Сезон строится от пэйволла и вложенных вопросов, а не от трёх актов."
principles:
  # Единица драматургии
  - id: V01
    text: "Единица драматургии — серия-«тап» 60–120 с (стандарт 90): одна цель, одно препятствие, один разворот, один клиффхэнгер. Сжатое письмо, а не короткое: плотность конфликта растёт кратно, экспозиции нет — только внутри конфликта."
  - id: V02
    text: "Сетка серии (90 с, масштабируется по длительности): ХУК 0–3 с → СТАВКИ 3–15 с → ЭСКАЛАЦИЯ 15–45 с → РАЗВОРОТ 45–75 с → КЛИФФХЭНГЕР последние 5–10 с. Те же биты в терминах Beat Engine: Hook 0–15, Friction 15–60 (ставки + эскалация), Spike 60–90 (разворот), Button (обрыв). Сначала пишется таймкод-скелет, потом диалог."
    for: [episode_cards, scripts, review]
  - id: V03
    text: "Хук: стоп-кадр на 3-й секунде должен быть понятен случайному зрителю без предыстории и без звука. Если нужна предыстория — переписать. Хук 1-й серии работает как самостоятельное 3-секундное промо."
    for: [episode_cards, scripts, review]
  - id: V04
    text: "Ставки к 15-й секунде: чего герой хочет в этой сцене, что потеряет, кто давит («герой хочет X, но Y»). Первая реплика серии формулирует острый вопрос."
    for: [episode_cards, scripts]
  - id: V05
    text: "Эскалация даёт не меньше одной новой информации или ухудшения: улика, звук, второе присутствие, отказ союзника. Конфликт снимаемый — два героя под давлением в одном пространстве, а не подтекст."
    for: [episode_cards, scripts]
  - id: V06
    text: "Разворот — главный удар серии: смена улик, рост ставок или переворот точки зрения, обесценивающий прежние допущения. Тест без звука: если при выключенном звуке поворот исчезает — это была громкость, а не сдвиг. На 60 с — один разворот; на 90–120 с — не больше двух; два разворота при ≤60 с — две серии."
    for: [episode_cards, scripts, review]
  - id: V07
    text: "Серия начинается на ответе и заканчивается на вопросе. Клиффхэнгер — задержанный кадр (held shot), оборванный за две секунды до разрешения, а не реплика: именно кадр уходит в скриншоты. Разрешение в конце серии — ошибка везде, кроме финала сезона. Обрыв посреди фразы без новой информации или угрозы — не клиффхэнгер."
    for: [season_plan, episode_cards, scripts, review]
  - id: V08
    text: "На 60 с — не меньше трёх смен состояния, из них хотя бы один разворот на 180°. Мини-кульминация примерно каждые 45 с."
    for: [episode_cards, scripts]
  # Связка серий
  - id: V09
    text: "Связка с прошлым обрывом — один из четырёх способов: перехлёст (повтор последних 2–5 с; после пэйволла и для зрителя из ленты; больше 5 с съедает хук), мгновенный результат (старт с последствия; в бинж-зонах), ложный результат («это был сон» — через 5–10 с угроза сильнее; не чаще раза на арку), смена точки зрения (тот же момент глазами угрозы; для иронии, с пометкой)."
    for: [episode_cards, scripts]
  - id: V10
    text: "После пэйволла: перехлёст ≤3 с и ответ в первые 10 с. Был физический клиффхэнгер — мгновенный результат. Было откровение — реакция крупно ≤2 с, затем действие."
    for: [episode_cards, scripts]
  # Клиффхэнгеры
  - id: V11
    text: "Архетипы обрыва чередуются на дистанции сезона, чтобы не было привыкания: раскрытие (в том числе появление нового лица, переворот прошлого против героя и «ядерный взрыв» — глобальная тайна через серию опасных сближений), опасность (зритель видит угрозу, герой — нет; угрозу не разрешать в той же серии), точка выбора (рука замирает на полпути — склейка посреди движения), возвращение детали (крупный план предмета из начала сезона, заложенного в первые 10 с этой серии), неотвеченный вопрос (сверхкрупный план лица), визуальный укол (один атмосферный кадр без новой информации)."
    for: [season_plan, episode_cards, review]
  - id: V12
    text: "Ложные тревоги вокруг большой тайны калибруются: зритель должен сгорать от любопытства, но не чувствовать обмана (bait-and-switch) — обман ведёт к необратимому оттоку."
    for: [season_plan, review]
  # Сезон
  - id: V13
    text: "Сезон строится от пэйволла: бесплатно 3–12 серий, типичный барьер — 8–10-я. Номер пэйволла, длительность серии и модель монетизации — входные параметры генерации, а не константы; дуга до барьера пересобирается под них."
    for: [concept, season_plan]
  - id: V14
    text: "Смещённый катарсис: серия барьера ставит самый мучительный вопрос (вопрос получает поворот, а не ответ; угроза немедленная и личная; личная ставка — связь из первых серий), а главное разоблачение и эмоциональная разрядка — через 1–2 серии после барьера, никогда в самой серии барьера. Серии сразу после барьера — самые плотные: купивший должен почувствовать покупку."
    for: [season_plan, episode_cards, review]
  - id: V15
    text: "На пэйволле — второй по силе твист сезона; самый сильный — на перезагрузке в середине или в финале."
    for: [season_plan, review]
  - id: V16
    text: "«Рельсы десяти»: 1-я серия — стартовый хук, 5-я — первый крупный переворот, 10-я — кульминационный разворот под барьер. Первые 10 серий — коммерческий пилот и аргумент конверсии; зритель решает, остаться ли, за первые три серии (около четырёх минут)."
    for: [concept, season_plan]
  - id: V17
    text: "Финал сезона — одна из трёх форм: Ответ (тайна раскрыта, цена уплачена), Инверсия (получили желаемое, потеряли нужное) или Дверь (вопрос сезона закрыт, в последнем кадре — больший). Финал гасит самое старое обещание 1-й серии постерным кадром без закадрового голоса и оставляет ровно одну нить незавершённой."
    for: [season_plan, review]
  - id: V18
    text: "Мифология не должна проглотить сериал: случайный зритель не удержит десятки фактов, разбросанных по 90-секундным роликам. Одна центральная идея, факты — только те, на которых стоят сцены."
    for: [concept, bible, review]
  # Персонажи и локации
  - id: V19
    text: "Без ансамбля: ядро конфликта — 2–3 персонажа, весь пакет — 4–6 карточек (герой, героиня или второй лид в роли антагониста, 1–2 вспомогательных). Персонаж без механической функции в петле напряжения (сжимает пружину, ослабляет или взрывает) — предмет интерьера, его убирают; «сделать человечнее» в 9:16 не работает."
    for: [concept, bible, review]
  - id: V20
    text: "Экспозиция «3+10»: к 3-й секунде виден конфликт, к 13-й — кто чего хочет и что мешает. Факт нужен сейчас → UI-элемент или одна реплика под действием; нужен потом → визуальная улика без пояснения, объяснение в момент выплаты; не нужен — удалить. Флэшбеки, длинные закадровые монологи и экспозиционные проходы запрещены; предыстория — через контекстные маркеры в активном диалоге и действии."
    for: [bible, episode_cards, scripts, review]
  - id: V21
    text: "Персонаж — «архетип + трещина + выбор»: архетип читается за 3 с («медсестра ночной смены»), трещина — скрытая вина, ложь или провал памяти, будущий поворот; развитие — только через выбор под угрозой."
    for: [bible]
  - id: V22
    text: "Мир — правило через нарушение и цену, не через объяснение: записка «после 3:00 не открывать» → сосед открыл → утром его квартира пуста. Не больше одного нового правила на серию."
    for: [bible, season_plan, episode_cards]
  - id: V23
    text: "Локаций на сезон — 3–6, в идеале одна якорная; серии часто идут подряд в одной локации; расписание съёмок строится от локации, не от хронологии. Автомобильные погони, перестрелки, массовые сцены и сложные «кто убийца» с разветвлённой мифологией — кладбище вертикальных драм."
    for: [concept, bible, episode_cards]
  # Диалог, кадр, звук
  - id: V24
    text: "Каждая реплика делает двойную работу и меняет баланс власти на входе и выходе из сцены. Реплика ≤12–15 слов (жёстко 20), реплик в 90-секундной серии ≤10–12, монолог запрещён, закадровый голос ≤8 с, экспозиция подряд ≤2 реплик без действия или угрозы, 10 с диалога без смены положения, угрозы или информации — «говорящие головы». Реплику, объясняющую видимое, заменять визуалом; имя, дата, правило мира дублируются визуально. Субтитры обязательны."
    for: [scripts, review]
  - id: V25
    text: "Кадр 9:16: 1–2 лица крупным или средним планом; ≥3 персонажей — монтаж по одному или парами либо «вертикальная группа» (лестница, ярусы); общий план ≤1 на серию и ≤3 с; говорящих ≤3 (жёстко 4). Интерфейс плеера перекрывает края: ключевую деталь не ставить у нижнего и правого края, лица и текст — в центральной трети."
    for: [episode_cards, scripts]
  - id: V26
    text: "Смотрят без звука и на скорости до 2x, зритель приходит из ленты в середину: у каждого сюжетного аудио-бита есть визуальный дубль (обрыв в тишину → замирание; стук → дрожь двери; голос за кадром → субтитр другим стилем; искажение → глитч; уведомление → UI-оверлей). ≥1 сюжетный аудио-бит на серию, звуковой удар ≤1 на серию; резать на неразрешённом звуке с чёрным экраном."
    for: [scripts]
  - id: V27
    text: "Каждое действие или микродвижение — отдельной строкой, реплики разбиты на естественные паузы: текст сценария задаёт монтажный ритм. Сезон пишется единым документом с разделителем серий."
    for: [scripts]
  # Порядок и проверка
  - id: V28
    text: "Порядок генерации серии: клиффхэнгер → разворот, который делает его неизбежным → хук, связанный с прошлой серией → ставки и эскалация → режим знания зрителя → кадр и звук с дублями → диалог под таймкоды → линтер; при блокирующем замечании перегенерировать бит, а не всю серию. На серии 1–3 и серию барьера — втрое больше итераций."
    for: [episode_cards, scripts]
  - id: V29
    text: "Две метрики платформы диктуют правки: досмотр серии ниже 50% — брак темпоритма (чаще провисание в середине серии или запутанная склейка); разблокировка следующей серии ниже 30% на барьере — клиффхэнгер слабее психологического порога оплаты. Оптимизируется вероятность перехода из серии N в N+1, а не «качество вообще»."
    for: [review]
  - id: V30
    text: "Пакет питча: логлайн одним предложением с прямым перечислением тропов без метафор, одноабзацный синопсис структурного конфликта, 4–6 карточек персонажей, карта арок на весь сезон с отмеченным пэйволлом, готовые сценарии первых 10 серий, референсы с цифрами, лукбук."
    for: [concept, logline]
