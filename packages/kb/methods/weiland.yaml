# К. М. Уэйланд, «Creating Character Arcs». Изложено по лекциям Моуэри
# (How to Create Character Arcs 1–2, Pinch Points, The Easiest Way to Build a Character Arc);
# самой книги у продюсера нет.
id: weiland
name: Арки персонажей
author: К. М. Уэйланд
stub: false
source: "Creating Character Arcs — в изложении лекций Моуэри"
summary: "Арка строится на Лжи, в которую верит герой, и Правде, к которой он приходит. Первая половина — герой действует по Лжи и наказан; мидпойнт — момент правды; вторая половина — действует по Правде, ещё не отказавшись от Лжи; кульминация — отказ. Арки бывают позитивные, плоские и негативные."
principles:
  - id: W1
    text: "Ложь героя — конкретное утверждение о мире; Правда — противоположное утверждение. Обе формулируются одной фразой и записаны в библии."
    for: [bible]
  - id: W2
    text: "Призрак — событие, породившее Ложь. Показывать его не обязательно, но он объясняет каждое решение героя в первой половине."
    for: [bible]
  - id: W3
    text: "Желание (want) — что герой думает, что ему нужно; Потребность (need) — Правда. В кульминации герой выбирает между ними."
    for: [bible, season_plan]
  - id: W4
    text: "Позитивная арка: первая половина — герой действует по Лжи и за это наказан; мидпойнт — момент правды; вторая половина — действует по Правде, не отказавшись от Лжи; третья точка — самая низкая; кульминация — отказ от Лжи."
    for: [season_plan]
  - id: W5
    text: "Плоская арка: герой держит Правду, мир живёт Ложью. Меняются окружающие; герой испытывается, но убеждения не меняет."
    for: [bible, season_plan]
  - id: W6
    text: "Негативные арки: разочарование (Правда оказалась горькой), падение (герой знает Правду и отвергает её), растление (герой принимает Ложь худшую, чем вначале)."
    for: [bible]
  - id: W7
    text: "Первая точка (конец первого акта): герой входит в новый мир по своей воле — выбор, не толчок."
    for: [season_plan]
  - id: W8
    text: "Первый пинч (середина первой половины): антагонистическая сила показывает мощь; герой держится за Ложь и платит."
    for: [season_plan]
  - id: W9
    text: "Мидпойнт: герой видит Правду, но ещё не живёт по ней. Это новый взгляд на известное, а не новая информация."
    for: [season_plan]
    genres: [revenge_thriller, romantasy_revenge, slavic_myth]   # у триллера середина — перезагрузка с новым дном
  - id: W10
    text: "Второй пинч: герой впервые действует по Правде; антагонист отвечает — цена ещё выше."
    for: [season_plan]
  - id: W11
    text: "Третья точка (конец второго акта): низшая — потеря, из которой выход только через отказ от Лжи."
    for: [season_plan]
  - id: W12
    text: "Арки второстепенных — зеркала: один герой держит Правду раньше героя (пример), другой идёт по негативной арке — цена той же Лжи."
    for: [bible]
  - id: W13
    text: "Проверка арки: каждая точка — сцена с номером серии и действием героя. «Понимает», «сомневается», «меняется» — не сцена."
    for: [season_plan, review]
