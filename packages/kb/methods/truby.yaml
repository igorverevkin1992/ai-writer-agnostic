# ЗАГЛУШКА (частично). Джон Труби, «Анатомия истории» и «Анатомия жанров»: книга продюсера
# не загрузилась. Здесь — общеизвестные шаги метода и то, что Моуэри пересказывает
# в лекциях (четырёхугольник оппозиции). Жанровые биты Труби — в guides/<genre>.yaml.
id: truby
name: Анатомия истории
author: Джон Труби
stub: true
summary: "Семь ключевых шагов: слабость и потребность, желание, оппонент, план, битва, самооткровение, новое равновесие. Оппонент хочет того же, что и герой; тема спорится действиями через четырёхугольник оппозиции."
principles:
  - id: T1
    text: "Слабость и потребность: у героя есть изъян, который портит ему жизнь, и потребность его преодолеть — психологическая (для себя) и моральная (как он вредит другим)."
    for: [bible]
  - id: T2
    text: "Желание: конкретная цель, к которой герой идёт весь сезон. Одно желание на историю."
    for: [concept, bible]
  - id: T3
    text: "Оппонент хочет того же, что и герой, и потому не может быть устранён разговором. Он лучше всех видит слабость героя и бьёт в неё."
    for: [bible]
  - id: T4
    text: "План: герой строит способ победить; план проваливается, и герой меняет его, платя за каждую смену."
    for: [season_plan]
  - id: T5
    text: "Битва: открытое столкновение, где спор о ценностях решается действием."
    for: [season_plan]
  - id: T6
    text: "Самооткровение героя следует за битвой: он понимает про себя то, чего не видел. Показать действием, не монологом."
    for: [season_plan, scripts]
  - id: T7
    text: "Новое равновесие: мир и герой на новом уровне — выше или ниже прежнего, но не на том же."
    for: [season_plan]
  - id: T8
    text: "Четырёхугольник оппозиции: герой, главный оппонент и ещё двое. Каждый — своя позиция по теме; оппоненты бьют не только героя, но и друг друга."
    for: [bible]
  - id: T9
    text: "Моральный спор ведётся поступками: каждый выбор героя — его ответ на вопрос темы, и каждый ответ имеет последствия."
