# Ответы демо-режима для проектов жанра revenge_thriller (pnpm demo, без ключей).
# Всё, что относится к сериалу, — здесь, а не в коде.
genre: revenge_thriller
heroine: Лиза
partner: Вера
first_hook: Свадебный бокал в руке Лизы дрожит
punchline: Я всё помню. И я никуда не уйду.
sound: Скрип старой сцены
metro_object: фото
villain_knows: Лиза ничего не знает
dialogue:
  - {who: partner, text: "Ты снова здесь так поздно? Что ты ищешь?"}
  - {who: heroine, text: "Старые фотографии для выставки. Ничего особенного."}
  - {who: partner, text: "В этом театре лучше не открывать чужие шкафы."}
  - {who: heroine, text: "Тогда почему этот шкаф заперт на новый замок?"}
  - {who: partner, text: "Не задавай вопросов, на которые не хочешь ответов."}
  - {who: heroine, text: "Я уже знаю ответ. Просто хочу услышать его.", fixed: "Я уже знаю ответ. Мне нужны доказательства."}
  - {who: partner, text: "Иди спать. Завтра у всех тяжёлый день."}
  - {who: heroine, text: "Я не уйду, пока не узнаю правду о семье."}
metro_hint: {every: 7, line: 6, fixes: ["Крупный план ключа в руке"]}
polish_line: Я знаю, что ты сделала. И скоро узнают все.
concepts:
  - {id: c1, title: "Муж женился на мне ради крови", premise: "Реставратор узнаёт, что муж женился на ней ради крови её рода, которая возвращает молодость его семье.", hook: "На свадьбе Лиза слышит: «Она ничего не подозревает».", genre_formula: "предательство мужа → маска → тайный поиск правды → семейная тайна → законный финал", reference_cases: []}
  - {id: c2, title: "Свекровь пьёт мою кровь", premise: "Невестка замечает, что свекровь-прима не стареет, и находит в архиве театра её фото 1966 года.", hook: "Фото 1966 года с лицом свекрови.", genre_formula: "тайна → маска → стравливание → разоблачение", reference_cases: []}
  - {id: c3, title: "Юбилей театра", premise: "К столетию театра семья готовит «угасание» невестки, а она готовит своё выступление.", hook: "Афиша юбилея с её именем в траурной рамке.", genre_formula: "угроза → маска → союз женщин → публичное разоблачение", reference_cases: []}
logline:
  heroine: Лиза, 32 года, реставратор фотографий
  wound: Выросла в семье, где о прошлом молчали
  betrayer: Муж Герман, ведущий актёр театра
  motive: Кровь женщин её рода возвращает молодость семье мужа
  revenge_goal: Разоблачить семью и спасти младшую сестру
  twist_secret: Цикл начал сам Герман, а не его мать
  stakes: Жизнь Лизы и её сестры Даши
  text_35w: Реставратор узнаёт, что муж женился на ней ради крови её рода. Она остаётся рядом, играет любящую жену и готовит месть, после которой он потеряет всё.
  ad_15w: Он женился ради её крови. Она осталась ради мести.
# Одна «найденная» дыра, чтобы в демо было что закрывать.
audit:
  hole_type: 3
  block: "41–50"
  finding: {holeType: 3, severity: blocker, quote: "Лиза сама возвращается в семью, чтобы спасти сестру", viewerQuestion: "Зритель спросит: почему она не идёт в полицию, а возвращается к убийцам?", fixes: ["Показать, что следователь без доказательств не может защитить Дашу", "Дать Лизе план, ради которого она возвращается"]}
respond: {action: cite, fact_id: f_dasha_target, explanation: "Даша — следующая в роду, поэтому Лиза не может ждать полицию"}
judge: {closed: false, reason: "Ответ объясняет мотив, но не видно, почему полиция не поможет"}
