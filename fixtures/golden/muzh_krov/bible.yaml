# Эталонная библия по концепту продюсера «Муж женился на мне ради крови».
# Корректная: проходит все кодовые проверки. Основа для посева дыр.
# Отличие от концепта: у события 1996 года не указан возраст Лизы (в концепте он
# противоречит её возрасту в 2026-м — см. README.md).
world_rules:
  - rule: Молодость — свойство рода Лизы
    why: Женщины этой семьи от природы стареют очень медленно
    cost: Род становится добычей для сестёр Орловых
    cannot: Другая кровь не работает
    who_knows: [Вера, Анна, Герман, Олег, Зоя]
    practical_effect: Бабушке 82, выглядит на 60; Лизе 28, дают 20
  - rule: Сёстры не бессмертные
    why: Они стареют как все, а кровь лишь откатывает их к 25 годам
    cost: Раз в 30 лет им нужна новая жертва
    cannot: Остановить старение навсегда
    who_knows: [Вера, Анна, Зоя]
    practical_effect: Раз в 30 лет нужна подмена «матери» и «дочери»
  - rule: Нужна только молодая кровь
    why: Кровь старой женщины рода не работает
    cost: Жертва всегда — молодая женщина
    cannot: Использовать бабушку
    who_knows: [Вера, Анна, Герман]
    practical_effect: Бабушка им не нужна, а Лиза и Даша нужны
  - rule: Кровь забирают под видом лечения
    why: Смерть от «болезни крови» выглядит естественно и не вызывает следствия
    cost: Нужен свой врач, который ставит диагнозы
    cannot: Забрать кровь без ведома врача
    who_knows: [Вера, Анна, Герман, Олег]
    practical_effect: Жертва не спит и всё видит, но уверена, что её лечат
  - rule: Никаких клыков
    why: Кровь хранят в медицинских пакетах
    cost: Остаются пакеты и следы от игл
    cannot: Пить кровь напрямую
    who_knows: [Вера, Анна]
    practical_effect: Сёстры пьют кровь из фарфоровых чашек
