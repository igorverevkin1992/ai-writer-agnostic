  severity: critical
  description: '57-я: «Яромир оседает на землю» — очаг залит. 59-я: «Яромир подносит телефон к микрофону праздника», а «открывает глаза» только после того, как Уля раздула угли. Он одновременно без сознания и держит телефон'
  why_noticed: Это климакс. Зритель увидит и то, и другое за две минуты экранного времени
  fixes: '1) Тамара звонит, телефон Яромира лежит рядом с ним — трубку берёт Климова, стоящая над ним. Следователь слышит признание из первых уст, и юридически это сильнее. 2) Яромир слабеет, но в сознании: «оседает» заменить на «хватается за перила». 3) Телефон заранее подключён к звуку праздника — Уля попросила об этом в 55-й'
  agent_rule: 'Проверять физическое состояние каждого персонажа в каждой сцене климакса: где он, в сознании ли, что у него в руках'
