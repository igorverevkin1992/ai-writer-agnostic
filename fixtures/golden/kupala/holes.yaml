  category:
  - М
  severity: high
  description: 'За 60–120 секунд: закадровый голос под водой, вечеринка, бокал «от свекрови», тост Тамары, взгляд Яромира, поцелуй Глеба и Кристины «на 60-й секунде», уход, причал, салют, толчок, венок тонет, затопленное село, колокол. Одиннадцать событий'
  why_noticed: На телефоне зритель не успеет понять, кто Яромир и кто Кристина. Продюсер попросит «разгрузить пилот»
  fixes: 1) Взгляд Яромира через костёр убрать из 1-й и дать в 2-й как воспоминание Ули. 2) Тост Тамары сократить до одной фразы за кадром. 3) Затопленное село и колокол оставить только в клиффхэнгере, без «крыши и колокольня» — один образ
  agent_rule: В серии 60–120 секунд не больше одного события, одного поворота и одного клиффхэнгера. Всё, что не работает на них, — в следующую серию
- id: k09
  episode: 8
  episodes: 8, 10, 50
  category:
  - Д
  - З
  - В
  severity: high
  description: 'В 8-й Уля слышит: «Не трогай её. Ждём сорок дней» — Тамара командует. В 10-й: «свадьбу затевала Тамара». Правило 1 требует признания того, «чья воля утопила». Но в 50-й Уля «ждёт — вот сейчас метка уйдёт» после признания Глеба. Зритель с 10-й серии знает, чья это воля. И само слово «воля», а не «рука» на экране до 50-й не звучит'
  why_noticed: Героиня выглядит глупее зрителя. И финальный поворот «признание не сработало» опирается на формулировку, которую зрителю не сказали
  fixes: '1) В 5-й Яромир говорит правило дословно: «Признаться должен тот, чья воля. Не рука». 2) В 50-й Уля ждёт не потому, что верит в Глеба, а потому что надеется: «мама велела» вслух — это уже воля Тамары, произнесённая. Пусть она скажет это вслух, и зритель поймёт её логику. 3) Или Уля ждёт ареста Тамары после признания Глеба — и ждёт признания на допросе'
  agent_rule: Каждое условие главного правила должно прозвучать на экране до того, как на нём построен поворот. Проверять, не знает ли зритель раньше героини то, чем она удивляется
