  description: Дневник Прасковьи «оставлен в доме» на острове три года назад. Дом пуст, ключи у Глеба (16-я). Тамара боится дневника (26-я), но за три года никто его не забрал. В 20-й Уля читает дневник в доме Вороновых — то есть он был у неё в вещах. Когда Тамара узнала, что дневник существует, и почему не забрала его из вещей невестки, если забрала ключи?
  why_noticed: Зритель видел, что Вороновы роются в вещах Ули. Дневник — самое опасное, что там есть
  fixes: '1) Тамара узнаёт о дневнике в 21-й: в срыве Уля кричит «В бабушкином дневнике написано, что мама не пила!». С этой секунды Тамара его ищет — и в 26-й посылает Глеба. 2) Дневник Уля увозит на остров в чемодане в 22-й — показать крупно. 3) Дневник хранился в Москве, Уля привезла его только после утопления'
  agent_rule: 'У каждого важного предмета — история: где лежал, кто знал, почему не взяли раньше. Проверять «почему злодей не сделал это раньше»'
