  severity: high
  description: 'В 18-й Уля говорит следователю, что «ничего не помнит о причале». В 30-й при всех: «Я всё помню. Меня столкнули с причала». Она солгала следователю — это ст. 307 УК для потерпевшего и удар по доверию Климовой. И это противоречит теме «побеждает правдой»'
  why_noticed: 'Климова дотошная. Она первая спросит: «Вы мне лгали?» Сюжет это игнорирует'
  fixes: '1) В 18-й Уля не лжёт, а молчит: «Я пока не готова говорить о причале». Это работает и на тему, и на 33-ю серию «молчать — не значит лгать». 2) В 30-й Климова спрашивает про ложь, Уля отвечает: «Я боялась за жизнь» — и это правда'
  agent_rule: Героиня, которая побеждает правдой, не должна лгать официальному лицу. Проверять каждую реплику героини следователю на ложь
