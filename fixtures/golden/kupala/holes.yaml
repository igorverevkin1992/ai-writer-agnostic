# Эталонный список дыр для pnpm eval: 68 дыр из разбора Fable 5.1 (review_fable.md).
# Категории А–П — по промпту продюсера (docs/hole_review_prompt.md).
source: Разбор дыр Fable 5.1 по концепту «Муж утопил меня в Купальскую ночь» (30.09.2026), review_fable.md
holes:
- id: k01
  episode: 3
  episodes: 3, 10, 18–19
  category:
  - Д
  - Б
  severity: critical
  description: 'В 10-й: «Полиция забрала у Жанны телефон». В этом телефоне — вся переписка с Кристиной: «Подсыпь ей», «Т. сказала: свадьбу затевали ради острова». Значит, с 10-й серии полиция уже знает мотив «остров» и букву «Т.». Но Климова до 30-й ничего не проверяет, а в 19-й Тамара «отдаёт следователю только одно сообщение» — откуда оно у Тамары, если «их у неё и нет, они у Ули»?'
  why_noticed: Зритель видит, как улику отдали полиции в 10-й, а следствие 20 серий её не замечает. Продюсер спросит, где Тамара взяла сообщение
  fixes: '1) Жанна стёрла переписку с телефона, но заранее сохранила копию в облаке — полиция получила пустой телефон. 2) Тамара не отдаёт сообщение, а даёт показания: «Кристина просила Жанну усыпить невестку — из ревности». 3) Или Уля в анонимном пакете (18-я) кладёт Тамаре и «Подсыпь ей» — специально, чтобы той было что отдать'
  agent_rule: Каждую улику вести по цепочке «у кого она сейчас». Если предмет попал к полиции — считать, что полиция знает всё, что в нём есть
- id: k02
  episode: 19
  episodes: 19–20, 60
  category:
  - А
  severity: critical
  description: 'Кристину задерживают за покушение. Она знает: Глеб держал Улю за руку, Тамара приказала. Ей выгодно сразу сдать обоих — сделка со следствием. Вместо этого она молчит, бросает Уле намёк про Лужина и в 60-й сидит «за покушение». Ни слова о том, почему она молчит'
  why_noticed: «Почему она их не сдала?» — первый вопрос в комментариях. Злодей действует против собственной выгоды
  fixes: 1) Кристина беременна от Глеба и защищает его — а значит, и Тамару. Сказать это одной репликой в 19-й. 2) Адвокат Тамары обещает Кристине «отмазать», как обещал Жанне — и Кристина верит, хотя зритель уже видел, чем это кончилось. 3) Кристина даёт показания, но это её слово против семьи — Климова копит
  agent_rule: У каждого пойманного злодея есть выгодный ход — сдать старших. Если он молчит, назвать причину в кадре
- id: k03
  episode: 20
  episodes: 20, 32, 39–40, 44, 60
  category:
  - Б
  - О
  severity: critical
  description: Тело Нины «так и не нашли» (задел на 2-й сезон). Но Лужин «написал ложное заключение о смерти» с причиной «утопление в состоянии опьянения». Без тела нет ни осмотра, ни медицинского свидетельства о смерти, ни причины. Смерть без тела устанавливает суд (ст. 45 ГК), а не врач. Отсюда же вопрос, как 7-летняя Уля «унаследовала» остров
  why_noticed: Любой, кто сталкивался с оформлением смерти, споткнётся. Ключевая улика 20-й и удар Климовой в 39-й держатся на документе, которого не может быть
  fixes: '1) Заменить справку на «медицинскую характеристику»: Лужин как врач семьи написал в полицию, что Нина «страдала алкоголизмом» — и дело закрыли как несчастный случай. 2) Или тело нашли, а на дальнем берегу в 60-й стоит не живая Нина, а «та, кого держит вода». 3) Наследство: Нину признали умершей через суд через полгода, опекун — Прасковья; сказать одной строкой'
  agent_rule: 'Каждый документ в сюжете проверять вопросом: «кто и на каком основании мог его выдать». Задел на продолжение не должен противоречить уликам первого сезона'
- id: k04
  episode: 22
  episodes: 22, 24, 49, 57
  category:
  - В
  severity: critical
  description: 'Правило 3: «Живёт он, пока горит очаг в доме Марфы». Дом на острове пуст 20 лет (с 2006-го), бабушка умерла 3 года назад. В 22-й Уля «разжигает очаг» — впервые. Значит, 20 лет очаг не горел, а Яромир жил. При этом в 57-й залитые угли почти убивают его'
  why_noticed: 'Это единственное правило, на котором держится и любовная линия, и финал. Продюсер спросит первым: «А кто топил печь двадцать лет?»'
  fixes: '1) Огонь Марфы не гаснет сам — только от озёрной воды. В 22-й Уля находит в пустом доме тлеющие угли, и это жутко. Мокрые следы Нины «от воды к очагу» тогда читаются как «кто-то хранил огонь» — двойная посадка на 2-й сезон. 2) Переписать правило: «пока очаг не залит водой». 3) Яромир сам 20 лет тайком приплывал поддерживать огонь — тогда он бывал в доме и знал Нину, что тянет за собой другие вопросы'
  agent_rule: Когда правило чуда сформулировано, прогнать его по всему прошлому мира, не только по 60 сериям. Правило должно работать и в годы до 1-й серии
- id: k05
  episode: 37
  episodes: '37'
  category:
  - В
  - Л
  severity: critical
  description: 'Правило 3: «минута — смерть». Лодка тонет «на середине озера», Яромира «течение несёт к острову», Уля вытаскивает его у берега. Это заведомо дольше минуты. По собственному правилу он мёртв'
  why_noticed: Зритель помнит цифру «минута» — её сказали в 5-й серии и повторили в разделе «Как закрыли дыры»
  fixes: '1) Лодка тонет на мелководье у самого острова: Тамара сказала «у острова», он туда и шёл. Уля вытаскивает за секунды. 2) Он не в воде, а на перевёрнутом корпусе; в воду падает у берега. 3) Ввести меру: «минута в воде — потеря сознания, десять минут — смерть» и повторить в 5-й серии'
  agent_rule: Если у слабости есть числовая мера, каждую сцену со слабостью сверять с числом, а не с ощущением
- id: k06
  episode: 45
  episodes: 45, 48–51
  category:
  - А
  - Б
  - Д
  severity: critical
  description: 'В 45-й Тамара сама присылает Уле копию подписанного договора с Яромиром с пунктом «остров передаётся после вступления Г. Воронова в наследство». Это письменное доказательство, что смерть Ули планировали до Купалы, — с подписью самой Тамары. В 49-й Яромир идёт к Климовой и говорит, что знал о плане. В 51-й Климова: «Слово сына против слова матери — этого мало». Договор и показания Яромира исчезли из расчёта'
  why_noticed: Зритель видел договор в 45-й крупным планом. Продюсер спросит, зачем злодейка своими руками отдала улику
  fixes: '1) Формулировку пункта сделать невинной: «после перехода права на остров к любому из Вороновых» — доказывает, что Яромир знал, но не доказывает умысла на убийство. 2) Показания Яромира сделать слабыми: «Тамара говорила намёками, слова „убить“ не было». Климова в 51-й перечисляет всё: «магнат догадывался, врач — про справку двадцатилетней давности, сын отказался — для ареста мало». 3) Тамара присылает не договор, а одно письмо от юриста Яромира'
  agent_rule: Каждая улика, показанная зрителю, должна быть учтена следствием в следующих сериях — либо объяснено, почему она не работает. Злодей не отдаёт бумагу с собственной подписью
