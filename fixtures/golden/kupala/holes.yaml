  severity: high
  description: 'В 16-й: ключи от маминого дома «забрали из Улиных вещей» и отдали Кристине. В 19-й Кристину задержали — ключи у неё или у полиции. В 22-й Уля приплывает ночью и просто входит в дом. Чем открыла? Брелок-лодочка, снятый крупно, больше не появляется'
  why_noticed: Крупный план ключей в 16-й — обещание. В 22-й оно нарушено, а брелок повис
  fixes: '1) В 19-й, когда Кристину уводят, её сумка падает — Уля поднимает связку с брелоком. Кайф маленькой победы. 2) Запасной ключ под крыльцом — Уля помнит с детства. 3) Брелок окупить в финале: Уля кладёт его на очаг рядом с венком'
  agent_rule: 'Каждый предмет, снятый крупным планом, — посадка. Вести список и проверять: где он сейчас и где окупается'
- id: k11
  episode: 18
