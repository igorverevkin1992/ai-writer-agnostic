# Библия «Муж утопил меня в Купальскую ночь» — точно по концепту продюсера (concept.md), со всеми
# его дырами: на ней агента сверяют с эталонным разбором (holes.yaml). Не исправлять.
# Формат библии требует год рождения не раньше 1900: у Яромира («живёт веками») стоит 1900 условно.
world_rules:
  - rule: Сорок дней
    why: Кто утонул в Купальскую ночь и был вытащен до рассвета, возвращается, но только на сорок дней
    cost: Если тот, чья воля её утопила, не признается вслух, на рассвете сорокового дня вода заберёт её навсегда
    cannot: Спастись местью, побегом или убийством злодея — спасает только признание вслух
    who_knows: [Уля, Тамара, Яромир]
    practical_effect: Счётчик дней в углу кадра; до рассвета сорокового дня под водой она не задыхается
  - rule: Вода показывает правду
    why: Утопленница видит то, что знает вода
    cost: Ложь в отражении — бесплатно; взгляд в воду озера в прошлое стоит одного дня из сорока
    cannot: Проверить ложь без отражения; проверить ложь Яромира; доказать что-либо суду
    who_knows: [Уля, Тамара, Яромир]
    practical_effect: У лжеца в отражении лицо утопленника — чёрные глаза, серая кожа, тина на шее; прошлое в воде — без звука, обрывками, в синем цвете
  - rule: Огонь и вода гасят друг друга
    why: Огонь — это Яромир, вода — навь
    cost: Вода убивает Яромира не сразу — секунда ожог, минута смерть; живёт он, пока горит очаг в доме Марфы на острове
    cannot: Его огонь не сжигает утопленницу — в ней холод нави
    who_knows: [Яромир]
    practical_effect: Он злится — мигает свет, искрит проводка; рядом с ним вспыхивает огонь в камине
