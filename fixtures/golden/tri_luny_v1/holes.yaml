  fixes: "Три поступка из лжи до серии 30, каждый дорого стоит.\n- Серия 7: на гати он бьёт железом снова и снова, хотя кот кричит «не железом». Каждый удар — шёпот громче. Оберег сгорает именно от этого. Цена лжи показана.\n- Серия 14–15: на переправе Гордей выбирает перебить разбойников, хотя можно было договориться (атаман предлагал «отработать»). Победа будит водяного: «железо зовёт». Из-за этого он теряет меч. Цена лжи показана.\n- Серия 25: на погосте он снова железом — и железо не берёт. Три раза «сила» не работает, и только на третий он начинает слушать. Это и есть движение к 30."
