  fixes: "Рост угрозы мерить тем, что Гордей теряет навсегда и что уже не может использовать. Блок 1: он ещё воин с мечом и щитом. Блок 2: без меча. Блок 3: без щита. Блок 4: без руки. Блок 5: без оружия ведёт других. Каждая битва должна начинаться с того, что он тянется к тому, чего уже нет. Один повторяющийся кадр на блок: рука ложится на пустые ножны, на пустой ремень щита, на бесполезную руку."
  agent_rule: "Рост угрозы измеряется потерями, а потеря должна быть показана до того, как случилась; «больше» — не рост; рост — это «меньше средств»"
- id: v1_6.1
  category: ["К"]
  severity: "high"
  description: "Каждый блок должен проверять тему с нового угла — сейчас углы не названы. «люди рядом страшнее чудовищ» — все они одинаково «плохие люди». Чем они разные по теме — не сказано."
  fixes: "У каждого блока свой неправильный ответ на вопрос «кто платит»:\n| Блок | Кто платит по мнению людей блока | Реплика, которая это говорит |\n|---|---|---|\n| 1. Болотная деревня | Чужие | «Своих не отдаём. А ты не свой» |\n| 2. Разбойники | Кто слабее | «Платят все, кто не может не платить» |\n| 3. Выжившие погоста | Никто — мёртвые пусть сторожат | «Похоронишь — кто добро стеречь будет?» |\n| 4. Нежата у Яги | Не платить, а брать | «Зачем платить, если можно взять?» |\n| 5. Староста | Платить — но не собой | «Отдадим его, и всё кончится» |\n| Гордей в финале | Платит должник, собой | «Бери меня» |\n\nТак тема идёт через все пять блоков, и зритель к финалу знает все неправильные ответы."
  agent_rule: "У злодея должна быть правда и личная цена молчания; тема должна проходить через каждый блок; тема без спора — лозунг"
