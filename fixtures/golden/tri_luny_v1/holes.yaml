  description: "Кикимору убивают. Это слишком легко и не по фольклору. Кикимора — первое чудовище, и её «добивают». Воин с третьей попытки убивает нечисть. Потом четыре чудовища, которых убить нельзя. Лестница начинается с неверной ноты: «нечисть убиваема»."
