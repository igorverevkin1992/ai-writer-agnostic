  fixes: "В серии 1, под кольчугой рядом с птицей, — оберег. Два предмета от двух женщин. В 7 сгорает первый. Остаётся птица. Это два кадра.\nРешения Гордея за сезон (после исправлений). Считаю только те, где он выбирает сам и платит.\n\n| Серия | Решение | Цена |\n|---|---|---|\n| 2 | Идти за словом кота, не веря | Время |\n| 8 | Бросить железо, зажечь гать | Оберег уже сгорел; бой проигран как бой |\n| 14 | Перебить разбойников вместо сделки | Будит водяного |\n| 18 | Отдать меч за Нежату | Меч, статус |\n| 22 | Окликнуть дочь | Её память о нём |\n| 27 | Назвать мёртвых, а не жечь | Ночь, риск |\n| 31 | Сжечь свой щит для мёртвых | Щит, счёт дней |\n| 33 | Пройти через людей без удара | Унижение перед Нежатой |\n| 38 | Войти к Яге, а не обходить | Всё, что дальше |\n| 40 | Накормить врага последним хлебом | Хлеб, голод |\n| 42 | Отдать руку, не сказав правды | Рука (откат) |\n| 44 | Лечь в печь | Страх смерти |\n| 50 | Идти к могиле, а не к воротам | Против старосты |\n| 55 | Оставить стену Нежате, идти к полю | Деревня без него |\n| 58 | Не добить | Победа |\n| 59 | Отдать себя | Свобода |\n\nШестнадцать решений. В исходной карте — около восьми, и три из них принимает кот."
  agent_rule: "Грех — выбор, а не ошибка; «охотник на нечисть» — зона «Ведьмака» и неправдоподобие; рост угрозы измеряется потерями, а потеря должна быть показана до того, как случилась; Нет негатива о войске; ложь героя в одном кадре; потеря показана до потери"
