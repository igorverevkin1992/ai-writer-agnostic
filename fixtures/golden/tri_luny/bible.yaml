# Библия «Три луны» — точно по концепту продюсера (concept.md, версия 2, 02.10.2026), со всеми его дырами:
# на ней агента сверяют с разбором. Не исправлять.
# Действие — Русь XI–XII века «без точной даты»: годы условные, 1100 — год сезона.
# У существ (Баюн, Леший, Яга) годы рождения тоже условные: они старше людей.
# heard_eps и plays_eps законов — из таблицы «Законы леса» концепции («Где зритель слышит», «Где играет»).
world_rules:
  - rule: Долг платит должник
    why: Лес берёт плату за то, что у него взяли
    cost: Нет должника — лес берёт его кровь, когда она дорастёт до долга. Должник вернулся и заплатил — кровь свободна
    cannot: Закрыть долг чужой платой — полями, скотом, чужими людьми
    who_knows: [Баюн, Леший, Пахом]
    practical_effect: Лес взял Василису, когда ей исполнилось семь — столько, сколько было лешонку
    heard_eps: [4, 29, 45]
    plays_eps: [59]
  - rule: Ложь кормит лес, правда его останавливает
    why: За десять лет люди привыкли врать лесу и откупаться
    cost: Каждый год лжи — поле. Правда, сказанная там, где сделан долг, при тех, кто платил, останавливает лес
    cannot: Остановить лес правдой у ворот, в чужом месте или без свидетелей
    who_knows: [Баюн, Леший]
    practical_effect: После правды корни отступают на шаг; после лжи трещит частокол
    heard_eps: [20, 44, 51]
    plays_eps: [20, 52, 58]
  - rule: Три луны
    why: Срок, за который лес делает взятого своим
    cost: До рассвета после третьего полнолуния — иначе лесная навсегда. Что лес успел взять до срока — не отдаст
    cannot: Вернуть то, что лес забрал до срока
    who_knows: [Баюн, Леший]
    practical_effect: Зарубки на щите, потом на топорище Нежаты; полнолуния в 12-й, 36-й и 55-й сериях
    heard_eps: [4]
    plays_eps: [60]
  - rule: Лес не ходит за реку
    why: За рекой степь, там свои хозяева
    cost: Лес отдаёт только у своей межи
    cannot: Войти в лес напрямую и забрать дочь
    who_knows: [Баюн, Леший]
    practical_effect: Лес ждал должника десять лет, пока тот воевал за рекой
    heard_eps: [4, 23]
    plays_eps: [23]
  - rule: Имя там, где слышит нечисть
    why: Имя — нить, за которую лес тянет память
    cost: Назвал имя близкого — лес забирает у него память о тебе
    cannot: Позвать дочь по имени и не потерять её
    who_knows: [Баюн]
    practical_effect: В 22-й серии Гордей зовёт дочь по имени, и она забывает, что у неё есть отец
    heard_eps: [4]
    plays_eps: [22]
  - rule: Железо зовёт
    why: Нечисть чует того, кто ударил
    cost: Каждый удар железом по нечисти — зов; нечисть идёт по следу
    cannot: Отбиться от нечисти железом
    who_knows: [Баюн]
    practical_effect: Шёпот кикиморы множится с каждым ударом; навьи идут по следу железа
    heard_eps: [4, 7]
    plays_eps: [7, 15, 35, 53]
  - rule: За проход в Навь платят лучшим
    why: Яга — страж границы миров
    cost: Яга берёт то, что человек умеет лучше всего. С того, кто ничего не умеет, взять нечего
    cannot: Пройти Навь даром или силой
    who_knows: [Баюн]
    practical_effect: Гордей платит силой правой руки — она покрывается корой
    heard_eps: [38]
    plays_eps: [41, 42]
