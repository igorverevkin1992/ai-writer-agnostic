# Ответы демо-режима для проектов жанра slavic_myth (pnpm demo, без ключей).
genre: slavic_myth
heroine: Гордей
partner: Нежата
first_hook: Стена червлёных щитов на берегу; небо чернеет от стрел
punchline: Зверем был я.
sound: Стук щитов, свист стрел, потом тишина
metro_object: деревянная птица
villain_knows: Должник не вернётся
dialogue:
  - {who: partner, text: "С кем ты говоришь? Тут никого нет."}
  - {who: heroine, text: "С тем, кто знает дорогу домой."}
  - {who: partner, text: "Ты воин или нет? Перебьём их и пройдём."}
  - {who: heroine, text: "Железом лес не отобьёшь."}
  - {who: partner, text: "Тогда чем? Ты отдал меч."}
  - {who: heroine, text: "Тем, чего у меня ещё не взяли.", fixed: "Собой."}
  - {who: partner, text: "Двадцать девять зарубок. Я считаю."}
  - {who: heroine, text: "Считай. До третьей луны."}
metro_hint: {every: 7, line: 5, fixes: ["Крупный план деревянной птицы в руке Гордея"]}
polish_line: Я убил ребёнка. Я не посмотрел.
concepts:
  - {id: c1, title: "Три луны", premise: "Дружинник возвращается с победной войны и узнаёт: лес забрал его семилетнюю дочь за долг, и сроку — три луны. Долг — его собственный: десять лет назад он убил сына лешего и не посмотрел, кого убивает.", hook: "На поле среди мёртвых чёрный кот: «Домой не спеши. Её уже нет».", genre_formula: "талисман → дорога через иной мир → лестница чудовищ с ценой → правда на мидпоинте → обряд вместо битвы → искупление", reference_cases: []}
  - {id: c2, title: "Межевой столб", premise: "Перевозчик, который всю жизнь откупался от водяного чужими людьми, должен заплатить сам, когда вода требует его сына.", hook: "Из тихой воды на него смотрит его собственное лицо — утопленником.", genre_formula: "сделка → долг → нисхождение → публичная правда", reference_cases: []}
  - {id: c3, title: "Дедова ночь", premise: "Вдова зовёт мёртвых за стол, чтобы узнать, кто погубил её мужа, а мёртвые указывают на всю деревню.", hook: "За поминальным столом лишний стул отодвигается сам.", genre_formula: "запрет → нарушение → череда чужаков → вина общины → искупление", reference_cases: []}
logline:
  heroine: Гордей, 38 лет, дружинник, вернувшийся с войны
  wound: Десять лет назад за двойную плату убил «зверя» — сына лешего — и не посмотрел на тело
  betrayer: "Сам Гордей; нанял его староста Пахом, зная, кого он убьёт"
  motive: Хотел плату, чтобы снарядиться в дружину
  revenge_goal: "Дойти домой за три луны и вернуть дочь; с мидпоинта — заплатить долг собой"
  twist_secret: Зверем был он сам, а жена и деревня знали правду десять лет
  stakes: Дочь станет лесной навсегда
  text_35w: "Дружинник возвращается с войны и узнаёт, что лес забрал его дочь за долг. Пройдя пять чудовищ, он понимает: десять лет назад он убил сына лешего и не посмотрел."
  ad_15w: Он шёл домой с войны. Дома его ждал его грех.
# Одна «найденная» дыра, чтобы в демо было что закрывать.
audit:
  category: А
  block: план сезона
  finding: {level: high, episodes: "14", quote: "Твой староста сам просил тебя назад не пускать", viewerQuestion: "Зритель спросит: откуда староста знал, что Гордей вернётся этой дорогой и именно сейчас?", whyNoticed: "Это первая улика против старосты — зритель проверит её", fixes: ["Показать, что староста годами платил всем перевозчикам на реке", "Дать атаману сказать, сколько лет назад и за что ему заплатили"], agentRule: "Каждое действие злодея на расстоянии проверять: как он узнал, где и когда будет герой"}
respond: {action: cite, fact_id: f_pakhom_asked, explanation: "Староста просил разбойников о Гордее, потому что боялся его возвращения все десять лет"}
judge: {closed: false, reason: "Ответ объясняет мотив, но не объясняет, откуда староста знал дорогу и время"}
summary:
  verdict: "Сезон держится на сильной связке «одна рана — одна цель — лестница чудовищ с ценой» и честном финале без драки. Слабые места — правила: законов леса семь, а не один-три, и зритель их не удержит. Платный барьер стоит в 8-й серии, а не в 10-й, как велит жанр. Возраст Василисы не сходится с десятью годами войны. После правки правил и хронологии сезон готов."
  dangers:
    - {where: "Серии 1–11 — Василисе семь, а Гордей ушёл на войну десять лет назад, когда Любава была беременна", why: "Зритель посчитает годы и перестанет верить хронологии"}
    - {where: "Серия 4 — кот называет шесть законов леса подряд", why: "Лекция вместо нарушения: зритель листает дальше"}
  legal:
    - "Убийство ребёнка лешего как грех героя: проверить формулировки для заявки в госфонд и возрастной рейтинг 16+"
