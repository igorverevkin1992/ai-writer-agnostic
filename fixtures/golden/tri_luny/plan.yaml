# План сезона «Три луны» — точно по концепту продюсера (concept.md, версия 2), со всеми его дырами.
# Не исправлять. Событие, обрыв и тип обрыва — из карты сезона концепта дословно; название, вопрос,
# эмоции, действие героя и разметка (настроение, удары, опорные точки) — Claude Code по тексту серий.
