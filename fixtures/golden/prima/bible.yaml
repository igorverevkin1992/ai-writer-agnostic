world_rules:
  - rule: Прима не репетирует одна
    why: Регина должна видеть каждое движение, иначе прима «уходит в свою сторону»; настоящий смысл — ночная сцена принадлежит спрятанной приме, которую Регина выводит репетировать «возвращение»
    cost: Нарушила — ночью в зале ты не одна; за тобой фигура в костюме Жизели, а охрана «велела не пускать»
    cannot: Репетировать без Регины и остаться незамеченной
    who_knows: [Регина, Семён, Лика, Петрович]
    practical_effect: Ночная репетиция Аси в 15-й оборачивается погоней за фигурой в костюме Жизели; в 27-й Лика объясняет, что это была она
    heard_eps: [2]
    plays_eps: [15]
  - rule: На крест не встают до премьеры
    why: Крест — метка следующей примы; кто встал раньше, того театр уже выбрал
    cost: Кира встаёт на крест в 10-й — и с этого дня она «следующая»
    cannot: Снять метку, если встал
    who_knows: [Регина, Лика]
    practical_effect: Регина ставит Киру на крест, и театр начинает готовить её замену
    heard_eps: [4]
    plays_eps: [10]
  - rule: Таблетку — за час до выхода, не раньше
    why: Фольклор труппы, который Регина поддерживает, чтобы никто не считал дозы. Механика — в дозе, а не во времени — половинка снимает страх и размывает вечер («сценический транс», норма для труппы); целая или «вторая половинка после поклона» даёт провал на час-два, и в этот час человек внушаем
    cost: Приняла больше — провал, очнёшься там, куда тебя привели
    cannot: Помнить, что делала под целой таблеткой
    who_knows: [Регина, Лика]
    practical_effect: В 20-й Ася от страха глотает две половинки и приходит в себя в опечатанной гримёрке с мелом на руках; в 37-й Регина растворяет целую — Ася просыпается на кресте
    heard_eps: [7]
    plays_eps: [20, 37]
  - rule: Из театра не уходят примой — либо легендой, либо никем
    why: Имя примы на афише — товарный знак театра; прима подписывает согласие на его регистрацию (в труппе это зовут «отказом от имени») и не может выйти под этим именем в другом театре. Легенда исчезнувшей продаёт билеты и наполняет фонд; стёртая живёт под паспортным именем, и труппа, сменившаяся за семь лет, не узнаёт в костюмерше афишу
    cost: Подписавшая и уехавшая получает деньги и чужое имя; отказавшаяся уехать остаётся персоналом
    cannot: Уйти со своим сценическим именем
    who_knows: [Семён, Регина, Лика, Юля, Марта]
    practical_effect: В 28-й Лика объясняет правило; в 50-й выясняется, что бумага Аси — не отказ, а «согласие попечителя» на контракт Киры
    heard_eps: [14]
    plays_eps: [28, 50]
