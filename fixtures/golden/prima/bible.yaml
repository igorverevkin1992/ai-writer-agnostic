facts:
  - {id: f_lika_alive, text: "Лика жива и спрятана за зеркалом гримёрки, в бункере под сценой"}
  - {id: f_pills, text: "«Таблетка от сцены» — бензодиазепин по бланкам «врача театра»: половинка снимает страх и размывает вечер, целая даёт провал памяти и внушаемость"}
  - {id: f_asya_entered, text: "В ночь премьеры Ася входила в гримёрку Лики — под таблеткой, по указанию Регины"}
  - {id: f_three_primas, text: "До Лики Регина стёрла трёх прим: Ингу (2005), Марту (2012), Юлю (2019); цикл — семь лет"}
  - {id: f_contract, text: "Имя примы на афише — товарный знак театра; прима подписывает согласие на его регистрацию («отказ от имени» на жаргоне труппы) и не может выйти под этим именем в другом театре; театр продаёт легенду исчезнувшей"}
  - {id: f_semyon_pays, text: "Семён платит Регине из «фонда легенды» за каждую подготовленную замену — бумажными квитанциями"}
  - {id: f_asya_signed, text: "В ночь премьеры Ася подписала бумагу из папки Семёна — какое-то «согласие»; полный текст она прочтёт только в квартире Регины"}
  - {id: f_consent, text: "«Согласие попечителя» Аси — согласие на контракт несовершеннолетней Киры с театром и её подготовку к сезону 2033: Кира названа заменой"}
  - {id: f_kira_cross, text: "Крест на своём шкафчике Кира нарисовала сама по просьбе Регины («Поставь свою метку»)"}
  - {id: f_asya_cross, text: "Крест на полу гримёрки Лики в ночь премьеры рисовала рука Аси под голос Регины «Ровнее»"}
  - {id: f_stage_names, text: "Прима на афише — сценическое имя; стёртые примы живут в театре под паспортным, и труппа, сменившаяся за семь лет, их не узнаёт"}
  - {id: f_note, text: "«Записку Лики» об отъезде написала и звонок «жива, уехала» дежурному сделала сама Лика под таблеткой, с голоса Регины; по ним розыск закрыл проверку"}
  - {id: f_dima_spy, text: "Дима с 2025 года работал на Семёна: следил за Ликой через её почту и свою камеру в её гримёрке"}
  - {id: f_no_doctor, text: "Врача в театре нет с 2019 года; аптечка и журнал выдачи таблеток — у Регины; рецепты — по бланкам «врача театра», которого приводит Семён"}
  - {id: f_private, text: "Театр частный: Семён — учредитель, директор и распорядитель фонда; над ним никого, кроме надзора и прокуратуры"}
  - {id: f_petrovich, text: "Трос штанкета над сценой надпилил охранник Петрович по приказу Семёна", since_ep: 53}
