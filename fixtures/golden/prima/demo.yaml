# Ответы демо-режима для проектов жанра vertical_thriller (pnpm demo, без ключей).
genre: vertical_thriller
heroine: Ася
partner: Дима
first_hook: Туфли на меловом кресте в луче; аплодисменты идут, примы нет
punchline: Без тебя я — Ася.
sound: Аплодисменты, потом скрип мела по доскам
metro_object: меловой крест
villain_knows: Ася ничего не вспомнит
dialogue:
  - {who: partner, text: "Камера молчала полчаса. Кто-то её выключил."}
  - {who: heroine, text: "Или кто-то не хотел, чтобы я себя увидела."}
  - {who: partner, text: "Это ты. В коридоре. В 22:51."}
  - {who: heroine, text: "Я не помню этого коридора."}
  - {who: partner, text: "Регина говорит, ты была в общежитии."}
  - {who: heroine, text: "Регина говорит за меня даже то, что я помню.", fixed: "Регина говорит за меня."}
  - {who: partner, text: "Что будешь делать?"}
  - {who: heroine, text: "Не принимать таблетку. И не спать."}
metro_hint: {every: 7, line: 5, fixes: ["Крупный план мела на пальцах Регины"]}
polish_line: Я не ты. Я — Ася.
concepts:
  - {id: c1, title: "Прима", premise: "Актриса второго состава становится примой в ночь, когда прежняя прима исчезает со сцены, — и находит запись, где в гримёрку исчезнувшей входит она сама. Театр делает из неё легенду, репетитор — убийцу, а младшая сестра уже стоит на меловом кресте, где стояли все примы до неё.", hook: "В луче на меловом кресте стоят только туфли; аплодисменты не кончаются.", genre_formula: "исчезновение на премьере → запись, где входишь ты → таблетка и провалы → живая прима за зеркалом → три стёртые примы → согласие на замену сестрой → крест стёрт ладонями", reference_cases: []}
  - {id: c2, title: "Квартира 9Б", premise: "Девушка снимает квартиру, под ковром которой записка её почерком: «Не открывай дверь в 3:07». В 3:07 стучат, и в глазке — она сама.", hook: "Записка её почерком под чужим ковром.", genre_formula: "правило → нарушение → сосед мёртв → двойник → дом, которого нет в планах", reference_cases: []}
  - {id: c3, title: "Ночная смена", premise: "Медсестра ночной смены получает сообщение «Не заходи в 412» от коллеги, который умер три дня назад, — и видео, где она входит в 412 вчера в 03:12.", hook: "Монитор палаты — прямая линия; пациент сзади смотрит в камеру.", genre_formula: "нарушение нормы → видео опровергает память → газлайтинг → двойник → цена", reference_cases: []}
logline:
  heroine: Ася, 24 года, актриса второго состава, ставшая примой за одну ночь
  wound: Не помнит ночь премьеры — и на записи в гримёрку исчезнувшей примы входит она
  betrayer: "Регина, репетитор, которая «делает» прим и стирает их; за ней директор Семён"
  motive: Легенда исчезнувшей примы продаёт билеты и наполняет фонд театра
  revenge_goal: "Узнать, что случилось с Ликой; с мидпоинта — вытащить сестру с креста и уйти с собственным именем"
  twist_secret: Лика жива за зеркалом и сама выбрала Асю себе на замену; Ася подписала «согласие на замену» — на сестру
  stakes: Сестра станет следующей стёртой примой
  text_35w: "Актриса второго состава становится примой в ночь исчезновения прежней — и находит запись, где в гримёрку исчезнувшей входит она сама. Театр делает из неё легенду, а сестра уже стоит на меловом кресте."
  ad_15w: Прима исчезла. На записи в её гримёрку входишь ты.
# Одна «найденная» дыра, чтобы в демо было что закрывать.
audit:
  category: Р
  block: план сезона
  finding: {level: high, episodes: "15", quote: "Охранник хватает Асю — выдох. В руке у него шаль Лики", viewerQuestion: "Зритель спросит: откуда у охранника шаль Лики, если её вещи вывезли в 3-й серии?", whyNoticed: "Шаль — первая вещь Лики, которую видят после опечатывания гримёрки; зритель помнит, что вещи увезли", fixes: ["Показать в 14-й, что Регина оставила себе шаль Лики", "Дать охраннику сказать, кто ему её дал"], agentRule: "Каждый предмет исчезнувшего персонажа после его исчезновения — с указанием, у кого он был"}
respond: {action: cite, fact_id: f_lika_alive, explanation: "Лика жива и в театре: её вещи никуда не уезжали, шаль у Регины с ночи премьеры"}
judge: {closed: false, reason: "Факт объясняет, что шаль в театре, но не объясняет, откуда она у охранника и зачем он её показывает"}
summary:
  verdict: "Сезон держится на одном вопросе и пяти вложенных: каждый закрывается там, где открывается следующий, крупнее прежнего. Барьер поставлен правильно — вопрос получает поворот, угроза личная, ставка — сестра. Слабое место — середина 37–39: три страдания подряд на пределе ритма, и серия 43 «Перформанс» рискует выглядеть повтором 8-й. Второе — Лика как персонаж: до 27-й она голос и рука, после 27-й её мотивы меняются трижды; зрителю нужна одна фраза, почему она выбрала Асю."
  dangers:
    - {where: "Серии 37–39 — три серии страдания подряд, героиня под таблеткой и без партии", why: "Ритм каркаса допускает три, но зритель ленты уйдёт на второй"}
    - {where: "Серия 43 — «перформанс» как вторая ложная разгадка после 8-й", why: "Повтор приёма ложной разгадки читается как затягивание"}
  legal:
    - "Таблетки Регины: не называть препарат и не показывать способ приёма как инструкцию; рейтинг 16+"
