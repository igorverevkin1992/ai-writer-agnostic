facts:
  - {id: f_rule_light, text: "Нюра видна только при зажжённом свете сцены; днём её комната пуста, кружка горячая"}
  - {id: f_blood_taken, text: "С первой недели у Аси собирают кровь: игла в корсете, стекло в туфле, ватки в банке с её именем"}
  - {id: f_nyura_brews, text: "Бутылочки ставит Нюра: она варит снадобье «для той, кто держит свет»"}
  - {id: f_potion, text: "Снадобье — кровь, пот и волосы молодых; выпившая блистает, донор платит днями жизни"}
  - {id: f_vika_donor, text: "Вика — донор Аси: Нюра поит её чаем и срезает прядь, а Вика сама этого хочет ради роли"}
  - {id: f_inga, text: "Инга — донор 1996 года, подруга Марго, постаревшая за осень на тридцать лет; Марк — её сын"}
  - {id: f_cycle, text: "Прима держит свет тридцать лет; потом дом за одну ночь возвращает ей взятое, а Нюра выбирает следующую"}
  - {id: f_three_primas, text: "До Марго было две примы по тридцать лет — Зоя (1936–1966) и Вера (1966–1996); обе кончили за одну ночь"}
  - {id: f_semyon_knows, text: "Семёны трёх поколений держат студию как донорский пункт: «медосмотры» — забор крови, вахта и костюмерная — для списанных"}
  - {id: f_anna, text: "Нюра — Анна Покровская, хозяйка дома, сгоревшая на сцене в 1906-м; она есть, пока горит свет сцены, и гаснет с ним"}
  - {id: f_mark_glass, text: "Стекло в туфлю Аси в первый вечер насыпал Марк — чтобы Нюра выбрала её и показала себя"}
