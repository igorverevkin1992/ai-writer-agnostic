betrayal:
  who: Марго
  what: С первого вечера сделала Асю своим донором — иглы в корсете, стекло в туфле, чай «по рецепту», — а потом поставила ей бутылочку, чтобы Ася выпила сама и выбрала донора из студии; подругу Вику Марго назначила Асе донором заранее, галочкой в списке 2025 года
  why: Тридцать лет Марго кончаются этой осенью; дом выберет следующую — и ей нужна та, что боится, как она сама в 1996-м
  year: 2026
  accomplices: [Нюра, Семён]
  who_else_knew:
    - {name: Нюра, why_silent: "Свет должен гореть; кто его держит — ей всё равно"}
