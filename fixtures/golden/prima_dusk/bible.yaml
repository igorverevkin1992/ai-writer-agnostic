world_rules:
  - rule: 'Нюру днём не ищи — она приходит на чай, когда зажигают сцену'
    why: Нюра — Анна Покровская, сгоревшая на своей сцене в 1906-м; она есть, пока горит свет сцены, и спит, пока он выключен
    cost: Нарушила — днём комната пуста, кружка горячая, а в тёмном зале за тобой фигура в костюме
    cannot: Увидеть Нюру при дневном свете или поймать её вне театра
    who_knows: [Марго, Семён, Инга, Нюра]
    practical_effect: В 15-й Ася ищет Нюру днём — находит пустую вахту и погоню в тёмном зале; в 49-й Нюра исчезает на рассвете посреди фразы
    heard_eps: [2]
    plays_eps: [15, 49]
  - rule: 'Бутылочку пьют перед выходом, глоток — не больше, и не делятся'
    why: Снадобье берёт с донора ровно столько, сколько выпито; лишний глоток — и оно берёт с ближайшего
    cost: Выпила всё — летаешь, а партнёр в кулисе оседает на пол
    cannot: Выпить больше глотка без того, чтобы кто-то рядом не погас
    who_knows: [Марго, Нюра, Инга]
    practical_effect: В 20-й Ася выпивает бутылочку целиком — Лёва падает в обморок за кулисой
    heard_eps: [7]
    plays_eps: [20]
  - rule: 'Каждый глоток — чей-то день'
    why: 'Снадобье не создаёт молодость, а переносит: что получила прима, отдал донор'
    cost: Хочешь блистать — кто-то рядом гаснет; хочешь блистать сильнее — гаснет быстрее
    cannot: Пить без донора
    who_knows: [Марго, Нюра, Семён, Инга]
    practical_effect: В 37-й Ася выпивает полную бутылочку из рук Нюры — ночью Вика падает с лестницы «как после потери литра крови»
    heard_eps: [14]
    plays_eps: [37]
  - rule: 'Дом не отпускает — пропустила бутылочку или ушла — долг возвращают за одну ночь'
    why: Снадобье — взятое в долг; тридцать лет дом терпит, потом забирает всё сразу; кто пил и перестал — платит тем же
    cost: Прима без бутылочки седеет за один монолог; донор, который сказал правду при полном свете, не встаёт
    cannot: Уйти из дома, не вернув взятого
    who_knows: [Нюра, Инга, Марго, Семён]
    practical_effect: В 45-й Марго выходит на юбилей без бутылочки и за монолог стареет на тридцать лет; в 57-й Инга дочитывает монолог 1996 года и умирает на сцене; в 59-й Ася получает своё — лицо тридцатилетней
    heard_eps: [33]
    plays_eps: [45, 57, 59]
