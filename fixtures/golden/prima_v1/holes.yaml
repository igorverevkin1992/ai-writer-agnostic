# Эталонный список дыр для pnpm eval: 28 намеренных смысловых дыр, заложенных Claude Code 17.10.2026
# в копию «Примы» (prima_v1). Структурные поля плана не тронуты: ни одну из них не ловит код,
# это проверка аудитора-модели. Категории — по review.yaml, типы — по holes/catalog.yaml.
source: Посев смысловых дыр в «Приму» для оценки аудитора (docs/audit-2026-10-17.md, волна 0)
holes:
- id: p01
  holeType: 11
  category: [Д]
  episode: 8
  episodes: 8, 12
  severity: high
  description: В 8-й Ася говорит Регине «Вы сами резали ту запись — я видела шов», но о монтажном шве и об аккаунте Регины она узнаёт только в 12-й
  agent_rule: Персонаж не действует по информации, которой у него ещё нет
- id: p02
  holeType: 1
  category: [Р]
  episode: 7
  episodes: 7, 20
  severity: critical
  description: Правило третье — «таблетку за час до выхода, не раньше; раньше — провал». В 7-й Ася принимает таблетку за три часа до прогона и танцует чисто, без провала. Правило нарушено без цены, а в 20-й то же нарушение даёт провал
  agent_rule: Числовое условие правила мира сверять с каждой сценой, где оно должно сработать; нарушение без цены — дыра
- id: p03
  holeType: 4
  category: [Е, Д]
  episode: 21
  episodes: 21, 46, 56
  severity: medium
  description: На рецепте — подпись главврача городской поликлиники, фамилия незнакома. Этот человек больше не появляется, в 46-й и 56-й улика не используется
  agent_rule: Каждая показанная улика ведётся по цепочке до следствия или до объяснения, почему не работает
- id: p04
  holeType: 6
  category: [А]
  episode: 29
  severity: critical
  description: Семён, застав Асю над папкой с подписями, сам отдаёт ей папку «Забери, она твоя». Злодей отдаёт бумаги с собственной подписью — против своей выгоды
  agent_rule: Злодей не отдаёт документ с собственной подписью; каждое действие злодея проверять вопросом «зачем это ему»
- id: p05
  holeType: 5
  category: [Б]
  episode: 46
  episodes: 46, 48
  severity: critical
  description: Регину «арестовывают на два месяца по заявлению Аси». Арест — только по решению суда, задержание без суда — до 48 часов; в 48-й её «отпускают» через считанные дни
  agent_rule: Юридический ход проверять тремя вопросами — кто имеет право, сколько занимает, что даёт на самом деле
- id: p06
  holeType: 2
  category: [Б, Д]
  episode: 20
  severity: high
  description: Ася теряет сознание на сцене при полном зале посреди вариации; врача никто не вызывает, спектакль продолжают, она приходит в себя в опечатанной гримёрке
  agent_rule: «Почему не вызвали врача» закрывается репликой в той же серии; рядом с событием есть люди — кто-то должен заметить
- id: p07
  holeType: 7
  category: [О, Н]
  episode: 33
  episodes: 25, 33
  severity: high
  description: Юля говорит, что её стёрли двенадцать лет назад (2014), а афиша в 25-й и хронология библии дают 2019
  agent_rule: Одна дата — одно число во всём документе; реплики персонажей сверять с хронологией
- id: p08
  holeType: 9
  category: [Н]
  episode: 42
  severity: medium
  description: «Ася, Юля и Марина перекрывают проход» — персонажа Марины нет, гардеробщицу зовут Марта
  agent_rule: Одно имя — один персонаж; имена сверять со списком библии
- id: p09
  holeType: 9
  category: [М]
  episode: 56
  severity: high
  description: В 90-секундной серии Ася «за один разговор пересказывает Диме всю схему с 2005 года, по годам» — экспозиция на полчаса говорящих голов
  agent_rule: В серии одно событие и один поворот; истина должна быть увидена, а не рассказана
- id: p10
  holeType: 8
  category: [Л]
  episode: 40
  severity: high
  description: Открытая репетиция «при полном зале в две тысячи зрителей и трёх телевизионных камерах» — массовка и съёмочная техника вне производственной рамки
  agent_rule: Каждую серию проверять по списку зон и лимитам производства; массовка не входит в рамку
- id: p11
  holeType: 4
  category: [Е]
  episode: 58
  episodes: 53, 58, 59
  severity: high
  description: В 53-й Марта соглашается выйти на сцену и сказать правду; в 58-й выходит только Юля, Марта исчезает из финала без объяснения
  agent_rule: Обещанный выход второстепенного персонажа окупается или объясняется; у каждой линии — номер серии развязки
- id: p12
  holeType: 11
  category: [Д]
  episode: 13
  episodes: 13, 14
  severity: high
  description: В 13-й Ася требует у Регины «отдать диктофон», а находит диктофон только в 14-й
  agent_rule: Персонаж не действует по информации, которой у него ещё нет
- id: p13
  holeType: 3
  category: [З]
  episode: 54
  episodes: 53, 54
  severity: high
  description: После покушения (противовес) Ася «сидит в общежитии и ждёт, пока полиция сама во всём разберётся» — героиня пассивна в ответ на удар
  agent_rule: После удара злодеев у героини — ответный ход в следующей серии, а не ожидание
- id: p14
  holeType: 10
  category: [К]
  episode: 60
  severity: critical
  description: Тема — «выбирать самой, уйти с именем». В финале Ася «подписывает с Семёном контракт примы на следующий сезон» — при том, что Семёна забрала полиция в 59-й, а сама она уходит из театра
  agent_rule: Каждую победу проверять на соответствие теме; финал не противоречит сам себе
- id: p15
  holeType: 5
  category: [Г]
  episode: 53
  episodes: 52, 53, 57
  severity: high
  description: В 52-й «до закрытия 24 часа», в 53-й «три дня спустя», в 57-й «ночь перед закрытием» — счётчик времени не сходится
  agent_rule: Задать, когда тикает счётчик, и сверить по нему каждую серию
- id: p16
  holeType: 2
  category: [Р]
  episode: 13
  episodes: 13, 24
  severity: critical
  description: Регина при Асе говорит «Это я снимала» — угроза раскрывает себя героине в той же серии, где зритель её видит; при этом вопрос «кто водил Асю» остаётся открытым до 24-й
  agent_rule: Угроза, показанная зрителю, не раскрывается герою в той же серии; закрытый вопрос не держат открытым
- id: p17
  holeType: 5
  category: [Г, О]
  episode: 17
  severity: high
  description: На зеркале в бункере надпись датирована 2031 годом при действии в 2026-м
  agent_rule: Каждую дату в кадре сверять с годом действия
- id: p18
  holeType: 6
  category: [А, Д]
  episode: 43
  episodes: 43, 46
  severity: critical
  description: Семён сам раздаёт журналистам полные записи Димы, включая ловушку у люка, — улики против себя и Регины; в 46-й по этим же записям Регину задерживают
  agent_rule: Злодей не действует против своей выгоды; улика, отданная публично, учтена всеми, кто её получил
- id: p19
  holeType: 7
  category: [Д, Н]
  episode: 52
  episodes: 10, 52
  severity: high
  description: В 10-й сообщение «Теперь ты» отправлено в 22:53, в 52-й Дима восстанавливает, что Регина отправила его в 23:40
  agent_rule: Одна константа — одно число во всём документе
- id: p20
  holeType: 10
  category: [П, Б]
  episode: 54
  severity: critical
  description: Следователь берёт у Семёна конверт и за час закрывает дело на Диму — продажная полиция, нарушение российских рамок
  agent_rule: Силовые структуры и суд — честные и компетентные
- id: p21
  holeType: 3
  category: [З, Б]
  episode: 24
  episodes: 24, 46
  severity: high
  description: У Аси запись, где Регина ведёт её под таблеткой к люку, и она «решает в полицию не идти» без причины; в полицию она идёт только в 46-й
  agent_rule: Каждое «почему не в полицию» закрывается репликой в той же серии
- id: p22
  holeType: 5
  category: [Д, Е]
  episode: 15
  episodes: 3, 15
  severity: medium
  doubt: true
  description: У охранника в руке шаль Лики, хотя в 3-й вещи Лики вывезли; сам охранник, исполнявший приказ Регины, больше не появляется (дыра из исходной «Примы», отмечена в demo.yaml)
  agent_rule: Предмет, вывезенный из кадра, не появляется без объяснения; у исполнителя злодея — судьба
- id: p23
  holeType: 5
  category: [Г, Л]
  episode: 17
  episodes: 16, 17
  severity: medium
  description: Дима «за ночь вытачивает ключ по пластилиновому слепку на кухне общежития» — без мастерской и заготовки это невозможно
  agent_rule: Быт и физика — у каждого предмета путь, который можно снять
- id: p24
  holeType: 10
  category: [Р, М]
  episode: 19
  episodes: 15, 19, 23
  severity: high
  description: Обрыв 19-й — ложное спасение («выдох» и «пока не про тебя»); вместе с 15-й и 23-й это три ложных спасения на девять серий при норме не чаще раза на шесть
  agent_rule: Ложное спасение не повторяется чаще раза на шесть серий
- id: p25
  holeType: 11
  category: [Д]
  episode: 41
  episodes: 41, 48
  severity: high
  description: Кира в 41-й кричит «Ты подписала согласие на замену — на меня!», а о подписи узнаёт от Регины только в 48-й; сама Ася узнаёт про «замену» в 50-й
  agent_rule: Кто что знает и с какой серии — сверять с таблицей знания
- id: p26
  holeType: 10
  category: [Р]
  episode: 60
  severity: high
  description: В финале два открытых вопроса — Лика на новом кресте и голос Регины в зале — при норме «ровно один новый вопрос»
  agent_rule: В финале ровно один новый вопрос
- id: p27
  holeType: 4
  category: [Е]
  episode: 6
  severity: low
  description: Ася копирует папку Димы на флешку и прячет её в пуанте; флешка больше не упоминается, хотя Диму увольняют и записи приходится восстанавливать
  agent_rule: Зачем показали предмет, если он не выстрелил
- id: p28
  holeType: 7
  category: [О, Г]
  episode: 27
  episodes: 1, 27
  severity: critical
  description: Лику «готовят к возвращению уже три года», хотя она исчезла в ночь премьеры этого сезона (1-я серия, 2026) и исчезновение ещё обсуждает пресса
  agent_rule: Сроки в репликах сверять со счётчиком сюжета и хронологией
