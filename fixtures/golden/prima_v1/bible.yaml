world_rules:
  - rule: Прима не репетирует одна
    why: Регина должна видеть каждое движение, иначе прима «уходит в свою сторону»
    cost: Нарушила — ночью в зале ты не одна; охрана «велела не пускать»
    cannot: Репетировать без Регины и остаться незамеченной
    who_knows: [Регина, Семён, Лика]
    practical_effect: Ночная репетиция Аси в 15-й оборачивается погоней за фигурой в костюме Жизели
    heard_eps: [2]
    plays_eps: [15]
  - rule: На крест не встают до премьеры
    why: Крест — метка следующей примы; кто встал раньше, того театр уже выбрал
    cost: Кира встаёт на крест в 10-й — и с этого дня она «следующая»
    cannot: Снять метку, если встал
    who_knows: [Регина, Лика]
    practical_effect: Регина ставит Киру на крест, и театр начинает готовить её замену
    heard_eps: [4]
    plays_eps: [10]
  - rule: Таблетку — за час до выхода, не раньше
    why: Препарат Регины снимает страх и память; «раньше» — провал на сцене
    cost: Приняла от страха раньше — провал, очнёшься там, куда тебя привели
    cannot: Помнить, что делала под таблеткой
    who_knows: [Регина]
    practical_effect: В 20-й Ася принимает таблетку до гала и приходит в себя в опечатанной гримёрке с мелом на руках
    heard_eps: [7]
    plays_eps: [20]
  - rule: Из театра не уходят примой — либо легендой, либо никем
    why: Легенда исчезнувшей примы продаёт билеты; ушедшая примой уносит имя с собой
    cost: Подписавшая «отказ» получает деньги и теряет имя; отказавшаяся остаётся персоналом
    cannot: Уйти с именем
    who_knows: [Семён, Регина, Лика]
    practical_effect: В 50-й выясняется, что контракт Аси — «согласие на замену»
    heard_eps: [14]
    plays_eps: [50]
