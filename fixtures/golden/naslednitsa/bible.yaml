# Эталонная библия ромэнтэзи «Наследница Вороновых» по карте сезона из исследования продюсера
# (30.09.2026). Имена по решению продюсера: Туманские (вместо Орловых), Савелий Дёмин (вместо Штерна).
# Корректная: проходит все кодовые проверки жанра romantasy_revenge.
world_rules:
  - rule: Дар Вороновых — слышать ложь и видеть клятвы
    why: Дар идёт по женской линии рода и просыпается от предательства крови
    cost: Холод в пальцах, седина, провалы в памяти; чем сильнее дар, тем выше цена
    cannot: Наказать или заставить — дар даёт только знание
    who_knows: [Маргарита, Савелий, Евдокия]
    practical_effect: Ложь «звенит», медальон теплеет у лжеца, гаснут лампы
  - rule: Клятва рода связывает Туманских
    why: Род держится на клятве не поднимать руку на своих
    cost: Нарушивший клятву теряет место в роду и силу
    cannot: Лев не может сам выступить против матери силой — только словом перед советом и судом
    who_knows: [Лев, Маргарита, Евдокия]
    practical_effect: Лев даёт Вере знание, допуск и укрытие, но не побеждает за неё
  - rule: Суд не принимает магию
    why: Мир живёт по закону, дар видят только посвящённые
    cost: Каждое знание от дара нужно подтвердить уликой
    cannot: Доказать правду одним даром
    who_knows: [Вера, Ника, Лев]
    practical_effect: После каждого «звона лжи» Вера ищет документ, запись или свидетеля
