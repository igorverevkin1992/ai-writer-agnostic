# Ответы демо-режима для проектов жанра romantasy_revenge (pnpm demo, без ключей).
genre: romantasy_revenge
heroine: Вера
partner: Лев
first_hook: В холле отеля гаснут лампы, когда Кирилл лжёт
punchline: Ложь звенит. Ты звенишь.
sound: Звон стекла и тихий гул медальона
metro_object: медальон
villain_knows: Вера — просто горничная
dialogue:
  - {who: partner, text: "Ты опять в архиве ночью. Что ты ищешь?"}
  - {who: heroine, text: "Фото матери. Они здесь, я знаю."}
  - {who: partner, text: "В этом доме лучше не открывать чужие двери."}
  - {who: heroine, text: "Тогда почему эта дверь пахнет гарью?"}
  - {who: partner, text: "Не спрашивай о том, чего не сможешь забыть."}
  - {who: heroine, text: "Я уже слышу, где ложь. Хочу услышать правду.", fixed: "Я уже слышу, где ложь. Мне нужны доказательства."}
  - {who: partner, text: "Уходи до рассвета. Савелий делает обход."}
  - {who: heroine, text: "Я не уйду, пока не верну имя матери."}
metro_hint: {every: 7, line: 6, fixes: ["Крупный план медальона, который теплеет"]}
polish_line: Ты отверг меня. Теперь я отвергаю тебя.
concepts:
  - {id: c1, title: "Наследница Вороновых", premise: "Горничная в родовом отеле Туманских узнаёт, что она наследница рода Вороновых, а пожар, в котором погибла её мать, устроила хозяйка отеля.", hook: "На приёме лампы гаснут, когда жених лжёт ей в лицо.", genre_formula: "унижение → искра силы → маска → подъём статуса → законное разоблачение", reference_cases: [fated_forbidden_alpha]}
  - {id: c2, title: "Обручённые кровью", premise: "Отвергнутая невеста слышит ложь и видит клятвы; наследник проклятого рода нанимает её, чтобы найти предателя.", hook: "Клятва жениха вспыхивает чёрным.", genre_formula: "отказ → сделка → опасная любовь → переворот статуса", reference_cases: []}
  - {id: c3, title: "Хозяйка рода", premise: "Подкидыш-служанка возвращает себе дом, в котором выросла прислугой.", hook: "На её запястье проступает герб дома.", genre_formula: "служанка → замечена → нужна → опасна → хозяйка рода", reference_cases: []}
logline:
  heroine: Вера, 24 года, горничная в родовом отеле
  wound: Мать погибла при пожаре, дар рода «ушёл»
  betrayer: Жених Кирилл, изменивший с невестой наследника
  motive: Наследство Веры и место при Туманских
  revenge_goal: Вернуть имя матери и наследство, наказать предателей по закону
  twist_secret: Пожар устроила хозяйка отеля, а проклятие её сына — украденный дар Вороновых
  stakes: Имя рода, жизнь Льва и её собственная сила
  text_35w: Горничная родового отеля узнаёт, что она наследница древнего рода. Она слышит ложь, скрывает дар и возвращает имя матери, а сын хозяйки становится её опасной любовью.
  ad_15w: Её сделали служанкой. Она вернёт себе род.
audit:
  category: Б
  block: план сезона
  finding: {level: critical, episodes: "40, 45", quote: "Веру выгоняют из отеля", viewerQuestion: "Зритель спросит: почему совладелицу так легко выгнать и почему она сразу не идёт в суд?", whyNoticed: "В 40-й Вера стала совладелицей — зритель помнит это", fixes: ["Показать, что иск о недееспособности временно лишает её прав", "Дать Нике сказать, сколько нужно ждать решения суда"], agentRule: "После каждой победы героини проверить: не отменяет ли она следующий удар злодея"}
respond: {action: cite, fact_id: f_forged_will, explanation: "Подделанное завещание ещё не оспорено, поэтому совет рода может выгнать её до суда"}
judge: {closed: false, reason: "Ответ объясняет причину, но в кадре не видно, почему суд не защищает её сразу"}
summary:
  verdict: "Сезон хорошо держит лестницу злодеев и тайну рода. Слабое место — правовая сторона наследства: после того как Вера стала совладелицей, её слишком легко выгоняют. Зритель запомнил её победу и почувствует обман. Остальные дыры точечные и закрываются одной репликой. После правки 40–45-й серий сезон готов."
  dangers:
    - {where: "Серии 40–45 — Веру выгоняют из отеля", why: "Победа героини отменяется без объяснения, зритель чувствует обман"}
  legal:
    - "Подделка завещания и иск о недееспособности: показать процедуру без ошибок, чтобы не вводить зрителя в заблуждение"
