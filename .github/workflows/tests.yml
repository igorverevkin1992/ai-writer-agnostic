name: Тесты конвейера

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS — потому что `Запустить_панель.command` и кириллические пути должны работать и там (аудит 2, п. 31)
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Git с кириллическими путями
        run: git config --global core.quotepath off
      - name: Установка
        run: pip install -e ".[dev]"
      - name: Линт кода (ruff)
        run: ruff check konveyer tests
      - name: Тесты
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests/ -q

  pytest-llm-sdk:
    # SDK моделей установлены: ветки адаптеров хотя бы импортируются (ключей нет — сеть не используется)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка с SDK
        run: pip install -e ".[llm,dev]"
      - name: Линт кода (ruff)
        run: ruff check konveyer tests
      - name: Тесты
        run: python -m pytest tests/ -q

  pytest-lock:
    # ровно те версии, что в requirements.lock (проверенная установка автора)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка по lock-файлу
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Тесты
        run: python -m pytest tests/ -q

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Сборка панели (tsc + vite)
        working-directory: panel
        run: |
          npm ci
          npm run build
      - name: Сборка совпадает с закоммиченной
        run: git diff --exit-code --stat -- "konveyer/data/панель"
