[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "konveyer"
version = "2.0.0"
description = "КОНВЕЙЕР — универсальный производственный конвейер книжной серии (ТЗ v1.0)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "Jinja2>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Верхние границы SDK — по мажорным версиям: смена мажора меняет HTTP-стек и типы; точные версии
# проверенной установки — requirements.lock, порядок обновления — Запуск.md, раздел «Обновление».
llm = ["google-genai>=1.0,<3", "anthropic>=0.40,<2"]
# Тяжёлые разборщики форматов необязательны (NFR-12): без них импорт таких файлов даёт понятное сообщение.
docx = ["python-docx>=1.1"]   # импорт .docx и рукопись тома в .docx (`konveyer том закрыть`); без неё — только .md
xlsx = ["openpyxl>=3.1"]      # импорт .xlsx
pdf = ["pypdf>=4.0"]          # импорт .pdf
onboarding = ["python-docx>=1.1", "openpyxl>=3.1", "pypdf>=4.0"]
dev = ["pytest>=7.4", "ruff>=0.5", "python-docx>=1.1", "openpyxl>=3.1", "pypdf>=4.0"]

[project.scripts]
konveyer = "konveyer.cli:app"

[tool.setuptools.packages.find]
# подпакеты (steps, onboarding) входят в колесо; проверяется тестом tests/test_упаковка.py
include = ["konveyer*"]

[tool.setuptools.package-data]
konveyer = ["data/**/*", "шаблоны/*", "типы/*.yaml", "модули/**/*", "методики/**/*", "языки/*.yaml"]

[tool.setuptools.exclude-package-data]
konveyer = ["**/__pycache__/*", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# минимальный набор, чистый сегодня: синтаксис/неиспользуемое (F), zip без strict (B905)
select = ["E9", "F", "B905"]
